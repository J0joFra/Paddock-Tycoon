name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Il file generato è aggiornato
        run: |
          python3 tools/build.py
          git diff --exit-code index.html || (echo "index.html non è aggiornato: esegui python3 tools/build.py e fai commit" && exit 1)
      - run: npm test
