<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
</style>
<title>Paddock Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,700&display=swap">
<style>
/* Layout: telefono in orizzontale. Tabellone a sinistra alto quanto lo schermo, plancia di gioco a destra. Tema chiaro bianco e rosso, unico di proposito. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f5; --line:#dde2ea; --ink:#15171c; --muted:#6b7280;
  --red:#e10a1e; --red-deep:#b3000f; --on-red:#ffffff; --gold:#f5b400; --green:#15a34a; --violet:#7c3aed;
  --f-display:'Titillium Web',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Titillium Web',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.35;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 20px;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
.app{max-width:1080px;margin:0 auto;display:grid;gap:12px}
@media(min-width:900px) and (min-height:621px){.app{grid-template-columns:minmax(0,600px) minmax(0,1fr);align-items:start}}
.side{display:grid;gap:10px;align-content:start;min-width:0}

/* Barra */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-family:var(--f-display);font-weight:900;font-style:italic;font-size:22px;letter-spacing:-.01em;line-height:1;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo b{color:var(--red);font-weight:900}
.mark{width:24px;height:24px;border-radius:7px;background:var(--red);position:relative;flex:none;box-shadow:0 3px 8px rgba(225,10,30,.3)}
.mark::after{content:"";position:absolute;inset:6px;background:repeating-conic-gradient(#fff 0 25%,var(--red) 0 50%) 0 0/6px 6px;border-radius:2px}
.icons{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-weight:900;font-size:18px}
.ib svg{width:20px;height:20px}
.ib:focus-visible,.btn:focus-visible,.chip:focus-visible,.cell:focus-visible{outline:2px solid var(--red);outline-offset:2px}
#fsbtn{display:none}
@media (pointer:coarse){#fsbtn{display:grid}}

/* Piloti */
.tower{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.chip{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:7px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:5px 8px;text-align:left;cursor:pointer;min-width:0}
.chip .tk{grid-row:span 2;width:14px}
.chip .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center;min-width:0}
.chip .cash{font-weight:900;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.05}
.chip.turn{border-color:var(--red);box-shadow:0 0 0 2px rgba(225,10,30,.15)}
.chip.out{opacity:.35}
.b{font-size:9px;font-weight:700;letter-spacing:.06em;padding:0 4px;border-radius:3px;background:var(--surface-2);color:var(--muted);flex:none;line-height:1.6}
.b.red{background:var(--red);color:var(--on-red)}
.b.gold{background:var(--gold);color:var(--ink)}

/* Tabellone */
.board{display:grid;grid-template-columns:1.3fr repeat(7,1fr) 1.3fr;grid-template-rows:1.3fr repeat(7,1fr) 1.3fr;gap:2px;background:var(--line);border:2px solid var(--line);border-radius:14px;overflow:hidden;width:100%;max-width:600px;aspect-ratio:1;margin-inline:auto;box-shadow:0 8px 30px rgba(21,23,28,.08)}
.cell{background:var(--surface);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;min-height:0;padding:2px;cursor:pointer;font-weight:900;font-size:clamp(8px,2.3vw,12px);text-align:center;line-height:1;border:0;color:var(--ink)}
.cell .strip{position:absolute;background:var(--g)}
.side-b .strip{top:0;left:0;right:0;height:20%}
.side-t .strip{bottom:0;left:0;right:0;height:20%}
.side-l .strip{right:0;top:0;bottom:0;width:20%}
.side-r .strip{left:0;top:0;bottom:0;width:20%}
.cell .pr{font-weight:600;font-size:.78em;color:var(--muted);font-variant-numeric:tabular-nums}
.cell.owned{box-shadow:inset 0 0 0 2.5px var(--oc)}
.cell.mort{background:repeating-linear-gradient(135deg,var(--surface) 0 4px,var(--surface-2) 4px 8px);color:var(--muted)}
.cell .lv{display:flex;gap:1px;height:.6em}
.cell .lv i{width:.45em;background:var(--red);border-radius:1px}
.cell .lv b{font-size:.8em;background:var(--ink);color:var(--surface);padding:0 2px;border-radius:2px;line-height:1.2}
.cell .roy{position:absolute;top:1px;right:2px;font-size:.75em;color:var(--violet)}
.cell .tks{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;position:absolute;bottom:3px;left:2px;right:2px}
.tk{display:inline-block;width:clamp(7px,2vw,11px);aspect-ratio:1;border-radius:50%;background:var(--pc);box-shadow:0 0 0 1.5px var(--surface)}
.tk.me{box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px var(--ink)}
.cell.special{color:var(--muted)}
.cell.k{font-size:clamp(9px,2.6vw,14px);color:var(--ink)}
.cell.go{background:repeating-conic-gradient(var(--ink) 0 25%,var(--surface) 0 50%) 0 0/10px 10px}
.cell .lbl{padding:2px 4px;border-radius:4px;background:var(--surface)}
.cell.cops .lbl{background:var(--red);color:var(--on-red)}
.cell.sc .lbl{background:var(--gold)}
.cell.pit .lbl{border:1.5px solid var(--ink)}
.cell.hl{background:#fff3c4}
.center{grid-area:2/2/9/9;background:radial-gradient(circle at 50% 45%,rgba(225,10,30,.13),transparent 62%),var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.5vw,10px);padding:8px;text-align:center;min-width:0}
.center .brand{font-weight:900;font-style:italic;font-size:clamp(15px,4.4vw,28px);line-height:1}
.center .brand b{color:var(--red)}
.dice{display:flex;gap:10px}
.die{width:clamp(28px,8.5vw,48px);aspect-ratio:1;background:var(--red);border-radius:24%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%;box-shadow:0 4px 0 var(--red-deep),0 6px 14px rgba(225,10,30,.25)}
.die i{border-radius:50%;margin:10%}
.die i.on{background:var(--on-red)}
.die.rolling{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}100%{transform:rotate(-9deg)}}
.now{font-weight:700;font-size:clamp(11px,3vw,15px);display:flex;align-items:center;gap:6px}
.now small{color:var(--muted);font-weight:600}
.msg{font-weight:700;font-size:clamp(11px,2.9vw,15px);max-width:26ch;min-height:2.6em;text-wrap:balance;display:flex;align-items:center;justify-content:center}
.msg.card{background:var(--ink);color:var(--surface);border-radius:10px;padding:6px 10px;font-weight:600;animation:pop .25s ease-out}
.msg.warn{color:var(--red)}
.msg.good{color:var(--green)}
@keyframes pop{from{transform:scale(.85);opacity:0}}

/* Plancia azioni */
.act{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 0}
.btn{font-family:var(--f-display);font-weight:900;font-size:16px;text-transform:uppercase;letter-spacing:.03em;padding:8px 14px;min-height:48px;border-radius:12px;background:var(--surface-2);border:1.5px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--red);color:var(--on-red);box-shadow:0 4px 0 var(--red-deep)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--red-deep)}
.btn.out{background:var(--surface);border-color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--surface)}
.btn.sm{font-size:12px;min-height:34px;padding:4px 10px;border-radius:9px}
.btn.xs{font-size:11px;min-height:28px;padding:2px 8px;border-radius:7px}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn small{font-weight:600;opacity:.85;text-transform:none}
.deal{display:grid;grid-template-columns:8px auto minmax(0,1fr) auto;gap:10px;align-items:center}
.deal .thumb{width:clamp(48px,14vmin,80px);display:flex}
.deal .thumb:empty{display:none}
.trk{display:block;overflow:visible}
.trk.mini{width:100%;height:auto;max-height:clamp(34px,11vmin,60px)}
.trk.big{width:100%;height:auto;max-height:min(46vh,240px)}
.trk .draw{stroke-dasharray:1;animation:draw 1.2s ease-out}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.trkcard{position:relative;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--g) 18%,transparent),transparent 70%),var(--surface-2);border-radius:14px;padding:14px 18px 22px;display:flex;justify-content:center}
.trkkm,.trkcc{position:absolute;bottom:6px;font-size:12px;font-weight:700;color:var(--muted)}
.trkkm{left:10px}
.trkkm b{color:var(--ink);font-size:14px}
.trkcc{right:10px}
.auc .thumb{width:72px}
.deal .sw{height:100%;min-height:40px;border-radius:4px;background:var(--g)}
.deal b{display:block;font-weight:900;font-size:18px;line-height:1.1}
.deal small{color:var(--muted);font-weight:600}
.deal .px{font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.waitline{display:flex;align-items:center;gap:8px;font-weight:900;text-transform:uppercase;min-height:48px;justify-content:center}
.waitline .tk{width:12px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.ticker{display:flex;align-items:center;gap:8px;background:transparent;border:0;padding:2px 4px;color:var(--muted);font-size:13px;text-align:left;cursor:pointer;min-width:0}
.ticker span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ticker svg{width:16px;height:16px;flex:none}

/* Fogli */
.backdrop{position:fixed;inset:0;background:rgba(21,23,28,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:90%;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;animation:up .2s ease-out;box-shadow:0 -10px 40px rgba(21,23,28,.18)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h2{font-weight:900;font-style:italic;font-size:24px;margin:0;line-height:1.05;text-wrap:balance;display:flex;align-items:center;gap:8px}
.sheet p{margin:0;color:var(--muted)}
.sheet h3{margin:0;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.handoff{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--surface);border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px}
.band{height:8px;border-radius:4px;background:var(--g)}
.rt{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center}
.rt div{background:var(--surface-2);border-radius:8px;padding:5px 2px;display:grid;gap:1px}
.rt small{font-size:10px;color:var(--muted);font-weight:700}
.rt b{font-size:14px;font-variant-numeric:tabular-nums}
.rt .cur{background:var(--red);color:var(--on-red)}
.rt .cur small{color:var(--on-red)}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{background:var(--surface-2);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:600}
.fact b{font-weight:900}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border:1.5px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:6px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--g)}
.tile .h{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding-top:2px}
.tile .h b{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .h span{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.tile .a{display:flex;gap:4px;flex-wrap:wrap}
.tile .a .btn{flex:1 1 auto}
.tile.mort{background:repeating-linear-gradient(135deg,var(--surface) 0 6px,var(--surface-2) 6px 12px)}
.debt{display:flex;justify-content:space-between;align-items:center;background:#ffe9eb;border-radius:12px;padding:10px 12px;gap:10px}
.debt b{font-size:24px;font-weight:900;color:var(--red);font-variant-numeric:tabular-nums}
.auc{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.auc .big{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.auc .who{font-weight:700;display:flex;gap:6px;align-items:center}
.bidders{display:flex;gap:6px;flex-wrap:wrap}
.bidders span{display:flex;gap:4px;align-items:center;font-size:12px;font-weight:700;background:var(--surface-2);padding:2px 8px;border-radius:20px}
.bidders span.gone{opacity:.35;text-decoration:line-through}
.trade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trade>div{min-width:0;display:grid;gap:6px;align-content:start;background:var(--surface-2);border-radius:12px;padding:8px}
.picks{display:flex;flex-wrap:wrap;gap:4px}
.pick{display:flex;align-items:center;gap:4px;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:4px 7px;font-size:12px;font-weight:700;cursor:pointer}
.pick .sw{width:6px;height:14px;border-radius:2px;background:var(--g)}
.pick.on{border-color:var(--red);background:#ffe9eb}
.pick.mort{text-decoration:line-through dotted}
.step{display:flex;align-items:center;gap:4px}
.step b{flex:1;text-align:center;font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.clauses{display:grid;gap:6px;background:var(--ink);color:var(--surface);border-radius:12px;padding:10px}
.clauses h3{color:var(--gold)}
.cl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:600}
.cl select{background:#2a2d35;color:var(--surface);border:0;border-radius:6px;padding:4px 6px;font:inherit;font-weight:700}
.sum{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.sum dt{color:var(--muted);font-weight:700}
.sum dd{margin:0;font-weight:700}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:6px;align-items:center}
.teamc{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-size:17px;cursor:pointer}
.teams{display:flex;flex-wrap:wrap;gap:4px}
.teams span{font-size:11px;font-weight:600;background:var(--surface-2);border-radius:6px;padding:2px 6px;color:var(--muted)}
.teams b{color:var(--ink)}
.prow input{background:var(--surface-2);border:1.5px solid var(--line);border-radius:8px;padding:8px;color:var(--ink);font:inherit;font-weight:700;min-width:0;width:100%;-webkit-user-select:text;user-select:text}
.swatch{width:28px;height:28px;border-radius:50%;background:var(--pc);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.seg{display:flex;background:var(--surface-2);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{background:transparent;border:0;padding:5px 10px;font-weight:700;font-size:12px;color:var(--muted);cursor:pointer;border-radius:6px;display:flex;gap:5px;align-items:center}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(21,23,28,.12)}
.cardbig{background:var(--ink);color:var(--surface);border-radius:14px;padding:16px;font-size:17px;font-weight:700}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.rules div{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:13px}
.rules b{display:block;font-weight:900;font-size:14px}
.rank{display:grid;gap:6px}
.rank div{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:var(--surface-2);padding:8px 10px;border-radius:10px;font-variant-numeric:tabular-nums;font-weight:700}
.rank div:first-child{background:#ffe9eb;box-shadow:inset 0 0 0 2px var(--red)}
.rank div:first-child .pos{color:var(--red)}
.rank .pos{font-weight:900;font-size:20px;font-style:italic}
.logl{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:13px}
.logl li:first-child{font-weight:700}
.muted{color:var(--muted)}

/* Orizzontale su telefono */
@media (orientation:landscape) and (max-height:620px){
  html,body{height:100%}
  body{overflow:hidden;padding-block:6px;box-sizing:border-box}
  .app{max-width:none;height:100%;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:stretch}
  .boardcol{height:100%;min-height:0;display:flex;align-items:center}
  .board{height:100%;width:auto;max-width:none;box-sizing:border-box;border-radius:12px}
  .side{overflow-y:auto;gap:8px;padding-right:2px;overscroll-behavior:contain}
  .logo{font-size:18px}
  .ib{width:34px;height:34px}
  .sheet{max-height:96%;max-width:760px;border-radius:16px 16px 0 0;padding-top:12px;gap:10px}
}
/* Verticale su telefono: chiedi di ruotare */
.rotate{display:none}
@media (orientation:portrait) and (max-width:760px) and (pointer:coarse){
  .rotate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px))}
  .rotate h2{font-weight:900;font-style:italic;font-size:28px;margin:0}
  .rotate .phone{width:48px;height:80px;border:4px solid var(--red);border-radius:11px;position:relative;animation:turn 2.4s ease-in-out infinite}
  .rotate .phone::after{content:"";position:absolute;left:50%;bottom:5px;width:10px;height:3px;margin-left:-5px;background:var(--red);border-radius:2px}
  @keyframes turn{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
}
/* Monoposto, effetti, partenza */
.board{position:relative}
.cars{position:absolute;inset:0;pointer-events:none;z-index:3}
.car{position:absolute;left:0;top:0;width:var(--car,14px);height:calc(var(--car,14px)*1.7);margin-left:calc(var(--car,14px)/-2);margin-top:calc(var(--car,14px)*-.85);transition:transform .14s linear;filter:drop-shadow(0 1.5px 1.5px rgba(21,23,28,.35))}
.car svg{width:100%;height:100%;display:block}
.car.me{z-index:2;filter:drop-shadow(0 0 3px var(--gold)) drop-shadow(0 0 2px var(--gold)) drop-shadow(0 1.5px 1.5px rgba(21,23,28,.35))}
.cell .ic{width:1.8em;height:1.8em;flex:none}
.cell .ic+span{font-size:.72em}
.cell .drs{background:var(--green);color:#fff;padding:1px 4px;border-radius:3px}
.cell.wk::after{content:"";position:absolute;top:2px;right:2px;width:1em;height:1em;background:repeating-conic-gradient(var(--ink) 0 25%,#fff 0 50%) 0 0/.5em .5em;border-radius:2px;box-shadow:0 0 0 1px var(--ink);animation:flag 1.1s ease-in-out infinite}
@keyframes flag{50%{transform:rotate(-14deg) scale(1.15)}}
.pot{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pot span{font-size:clamp(9px,2.3vw,12px);font-weight:700;background:var(--surface-2);border-radius:20px;padding:1px 9px;white-space:nowrap}
.pot span.full{background:var(--gold)}

.fx{position:fixed;inset:0;pointer-events:none;z-index:60}

.float.minus{color:var(--red)}

.order .dd{display:flex;gap:5px}
.order .die{width:30px;box-shadow:0 2px 0 var(--red-deep)}

.pole{display:flex;align-items:center;gap:10px;font-weight:900;font-style:italic;font-size:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.stats div{background:var(--surface-2);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted);font-weight:700}
.stats b{display:block;color:var(--ink);font-size:14px}

body{overflow:hidden;box-sizing:border-box;padding-block:6px;padding-right:max(34px,calc(env(safe-area-inset-right,0px) + 28px))}
.app{max-width:none;height:100%;display:block;margin:0}
.boardcol{height:100%;min-height:0;display:block}
.board{width:100%;height:100%;max-width:none;aspect-ratio:auto;box-sizing:border-box;border-radius:14px;grid-template-columns:1.25fr repeat(7,1fr) 1.25fr;grid-template-rows:1.25fr repeat(7,1fr) 1.25fr}
.cell{font-size:clamp(8px,2.8vmin,15px)}
.cell.k{font-size:clamp(9px,3.1vmin,17px)}

.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(3px,1.4vmin,10px);text-align:center;min-width:0;min-height:0}

.die{width:clamp(26px,9.5vmin,60px)}
.msg{font-size:clamp(11px,3.1vmin,17px)}
.now{font-size:clamp(11px,3vmin,16px)}
.bar .logo{display:none}
.bar{justify-content:flex-end}
.ib{width:clamp(30px,8vmin,38px);height:clamp(30px,8vmin,38px)}
.tower{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:5px}
.chip{padding:3px 7px}
.chip .cash{font-size:clamp(13px,3.6vmin,18px)}
.act{padding:clamp(6px,1.6vmin,10px);gap:6px;background:var(--surface-2);border:0}

.btn.sm{min-height:clamp(30px,8vmin,38px)}

function tone(f,dur,type='sine',vol=.12,when=0,slide){
  const a=ac(); if(!a) return;
  const t=a.currentTime+when, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(dur,vol=.2,when=0,hp=800){
  const a=ac(); if(!a) return;
  const t=a.currentTime+when, n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let k=0;k<n;k++) d[k]=(Math.random()*2-1)*(1-k/n);
  const s=a.createBufferSource(), g=a.createGain(), f=a.createBiquadFilter();
  f.type='highpass'; f.frequency.value=hp; s.buffer=buf; g.gain.value=vol;
  s.connect(f).connect(g).connect(a.destination); s.start(t);
}

function gain(p,n){p.cash+=n;sfx('coin');log(`${p.name} +${fmt(n)}`);}
function lvCost(i,l){const up=G[SQ[i].g].up,b=l===4?up*2:up,o=S.own[i];return o&&P(o.owner).team==='eng'?r5(b*.75):b;}
function upCost(i){return lvCost(i,S.own[i].level+1);}
function levelValue(i,l){const up=G[SQ[i].g].up;return l<=3?l*up:5*up;}
function propValue(i){const o=S.own[i];return (o.mort?SQ[i].price/2:SQ[i].price)+(SQ[i].t==='c'?levelValue(i,o.level):0);}
function netWorth(p){return p.cash+propsOf(p).reduce((a,i)=>a+propValue(i),0)-(p.loan?p.loan.owe:0);}
const mortValue=i=>Math.floor(SQ[i].price/2);
const unmortCost=i=>r5(SQ[i].price*.55);
function pactActive(a,b){return (S.pacts||[]).some(x=>((x.a===a&&x.b===b)||(x.a===b&&x.b===a))&&S.round<=x.until);}
function roysOn(i){return (S.roys||[]).filter(r=>r.prop===i&&S.round<=r.until);}
function rentOf(i){
  const sq=SQ[i],o=S.own[i],owner=P(o.owner);
  if(o.mort) return 0;
  if(sq.t==='u'){const n=propsOf(owner).filter(j=>SQ[j].t==='u'&&!S.own[j].mort).length;return (S.dice[0]+S.dice[1])*(n===2?12:5);}
  const t=rentTable(sq);
  let r=o.level===0?(ownsGroup(owner,sq.g)?t[0]*2:t[0]):t[o.level];
  if(S.weekend===i) r*=2;
  if(owner.team==='mkt') r=r5(r*1.15);
  return r;
}
function pickWeekend(){
  const cs=SQ.map((s,i)=>i).filter(i=>SQ[i].t==='c');
  S.weekend=cs[Math.floor(Math.random()*cs.length)];
  log(`🏁 GP del weekend: ${SQ[S.weekend].name} · diritti ×2`);
}
const st=id=>(S.stats=S.stats||{})[id]||(S.stats[id]={rent:0,deals:0,built:0});
function canUpgrade(p,i){const sq=SQ[i],o=S.own[i];return sq.t==='c'&&o&&o.owner===p.id&&o.level<4&&ownsGroup(p,sq.g)&&!groupHasMort(sq.g)&&p.cash>=upCost(i);}
function upgrade(i){const p=P(S.own[i].owner),c=upCost(i);p.cash-=c;S.own[i].level++;st(p.id).built++;sfx('build');log(`${p.name}: ${S.own[i].level===4?'GP':'tribuna'} a ${SQ[i].name} (−${fmt(c)})`);}
function sellUpgrade(i){const o=S.own[i],p=P(o.owner),c=lvCost(i,o.level),b=Math.floor(c/2);o.level--;p.cash+=b;sfx('coin');log(`${p.name} smonta a ${SQ[i].name} (+${fmt(b)})`);}
function canMortgage(i){const o=S.own[i];return o&&!o.mort&&o.level===0&&(SQ[i].t==='u'||!groupHasUpgrades(SQ[i].g));}
function mortgage(i){const o=S.own[i],p=P(o.owner);o.mort=true;p.cash+=mortValue(i);sfx('coin');log(`${p.name} ipoteca ${SQ[i].name} (+${fmt(mortValue(i))})`);}
function unmortgage(i){const o=S.own[i],p=P(o.owner),c=unmortCost(i);if(p.cash<c)return;p.cash-=c;o.mort=false;sfx('pay');log(`${p.name} riscatta ${SQ[i].name} (−${fmt(c)})`);}
function hasAssets(p){return propsOf(p).some(i=>S.own[i].level>0||canMortgage(i));}
function autoRaise(p,need){
  for(let g=0;g<200&&p.cash<need;g++){
    const ups=propsOf(p).filter(i=>S.own[i].level>0).sort((a,b)=>G[SQ[a].g].up-G[SQ[b].g].up);
    if(ups.length){sellUpgrade(ups[0]);continue;}
    const m=propsOf(p).filter(canMortgage).sort((a,b)=>SQ[a].price-SQ[b].price);
    if(m.length){mortgage(m[0]);continue;}
    break;
  }
}
async function pay(p,amt,creditor,why,opt={}){
  if(p.out||amt<=0) return true;
  if(!creditor&&!opt.full&&p.team==='law') amt=Math.max(5,r5(amt/2));
  if(p.cash<amt){
    sfx('alarm');
    if(p.cpu) autoRaise(p,amt); else await debtScreen(p,amt,creditor,why);
  }
  if(p.cash<amt){await bankrupt(p,creditor);return false;}
  p.cash-=amt; if(creditor) creditor.cash+=amt; else S.pot=(S.pot||0)+amt;
  sfx('pay'); log(`${p.name} −${fmt(amt)}${creditor?' → '+creditor.name:''} · ${why}`);
  return true;
}
async function bankrupt(p,creditor){
  sfx('bankrupt');
  if(creditor){creditor.cash+=p.cash;}
  for(const i of propsOf(p)){ if(creditor){S.own[i].owner=creditor.id;S.own[i].level=0;} else delete S.own[i]; }
  p.cash=0;p.out=true;p.stopgo=false;p.outAt=Date.now();
  S.roys=(S.roys||[]).filter(r=>r.holder!==p.id);
  S.pacts=(S.pacts||[]).filter(x=>x.a!==p.id&&x.b!==p.id);
  log(`💥 ${p.name} in bancarotta${creditor?': tutto a '+creditor.name:''}`);
  setMsg(`${p.name} in bancarotta!`,'warn'); render(); await wait(900);
  checkOver();
}
function checkOver(){if(S.players.filter(p=>!p.out).length<=1&&!S.over)endGame();}
function ranking(){return [...S.players].sort((a,b)=>(a.out-b.out)||(netWorth(b)-netWorth(a))||((b.outAt||0)-(a.outAt||0)));}
function recordHist(){S.hist=S.hist||[];const v=S.players.map(p=>p.out?0:Math.max(0,netWorth(p)));const last=S.hist[S.hist.length-1];if(last&&last.r===S.round)last.v=v;else S.hist.push({r:S.round,v});}
function endGame(){
  recordHist();
  S.over=true;S.phase='over';
  const w=ranking()[0];
  const c=S.champ;
  if(c&&!S.scored){
    S.scored=true;const mult=c.idx===c.n-1?2:1;
    S.gained=ranking().map((p,k)=>{const g=(PTS[k]||0)*mult;c.pts[p.id]+=g;return g;});
    c.wins[w.id]++;c.results.push(ranking().map(p=>p.id));
  }
  setMsg(c?`🏁 ${w.name} vince il ${c.names[c.idx]}!`:`🏁 ${w.name} campione!`,'good');log(`Bandiera a scacchi: vince ${w.name}`);
  sfx('win');save();render();confetti(220);showGameOver();
}

// ================= Fogli (modali) =================
let sheetDismiss=true, choice=null;
function openSheet(html,dismiss=true){$('#sheet').innerHTML=html;$('#backdrop').hidden=false;sheetDismiss=dismiss;}
function closeSheet(){$('#backdrop').hidden=true;$('#sheet').innerHTML='';}
function ask(html){return new Promise(res=>{choice=res;openSheet(html,false);});}
$('#backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop'&&sheetDismiss)closeSheet();});
const handoff=p=>S.players.filter(x=>!x.cpu&&!x.out).length>1?`<div class="handoff">📱 Passa il telefono a ${tok(p)} ${esc(p.name)}</div>`:'';

async function debtScreen(p,amt,creditor,why){
  while(p.cash<amt){
    const mine=propsOf(p).sort((a,b)=>a-b);
    const tiles=mine.map(i=>{
      const o=S.own[i];let a='';
      if(o.level>0) a+=`<button class="btn xs dark" data-choice="down:${i}">Smonta +${fmt(Math.floor(lvCost(i,o.level)/2))}</button>`;
      if(canMortgage(i)) a+=`<button class="btn xs dark" data-choice="mort:${i}">Ipoteca +${fmt(mortValue(i))}</button>`;
      if(!a) return '';
      return `<div class="tile ${o.mort?'mort':''}" style="--g:${gcol(i)}"><div class="h"><b>${esc(SQ[i].name)}</b><span>${o.mort?'IPO':LV_SHORT[o.level]}</span></div><div class="a">${a}</div></div>`;
    }).join('');
    const any=hasAssets(p);
    const c=await ask(`${handoff(p)}<h2>${any?'Servono fondi':'Bancarotta'}</h2>
      <div class="debt"><span>${esc(why)}${creditor?' → '+esc(creditor.name):''}<br><small class="muted">In cassa ${fmt(p.cash)}</small></span><b>${fmt(amt)}</b></div>
      ${any?`<div class="tiles">${tiles}</div>`:`<p>Niente più da ipotecare o smontare.</p>`}
      <div class="row"><button class="btn ${any?'out':'primary'}" data-choice="bk" ${any?'disabled':''}>Dichiara bancarotta</button></div>`);
    if(c==='bk') break;
    const [k,i]=c.split(':');
    if(k==='down') sellUpgrade(+i); else if(k==='mort') mortgage(+i);
    render();
  }
  closeSheet();
}

// ================= Movimento e caselle =================
async function moveSteps(p,n){
  const dir=Math.sign(n);stepK=0;
  for(let k=0;k<Math.abs(n);k++){
    p.pos=(p.pos+dir+32)%32;
    if(dir>0&&p.pos===0){const b=LAP_BONUS+(p.team==='sponsor'?50:0);p.cash+=b;sfx('coin');log(`${p.name} passa dal via +${fmt(b)}`);}
    else sfx('step');
    render(); await wait(130);
  }
}
async function moveTo(p,t){const n=(t-p.pos+32)%32;await moveSteps(p,n===0?32:n);}
async function stopGo(p,reason){sfx('siren');setMsg(reason,'warn');log(`${p.name}: ${reason}`);p.pos=PIT;p.stopgo=true;render();await wait(700);}

async function resolve(p){
  if(p.out||S.over) return;
  const sq=SQ[p.pos];
  if(sq.t==='c'||sq.t==='u'){
    const o=S.own[p.pos];
    if(!o){S.phase='buy';S.pending=p.pos;setMsg(`${sq.name} libero`);return;}
    if(o.owner===p.id){setMsg(`In casa a ${sq.code}`);return;}
    const owner=P(o.owner);
    if(o.mort){setMsg(`${sq.code} ipotecato: gratis`,'good');return;}
    if(pactActive(p.id,owner.id)){setMsg(`🤝 Patto con ${owner.name}: gratis`,'good');log(`${p.name} non paga ${owner.name} (patto)`);return;}
    const r=rentOf(p.pos);
    setMsg(`${S.weekend===p.pos?'🏁 GP! ':''}Diritti ${fmt(r)} → ${owner.name}`,'warn');render();
    const ok=await pay(p,r,owner,`diritti ${sq.name}`);
    if(ok) st(owner.id).rent+=r;
    if(ok) for(const ry of roysOn(p.pos)){
      const h=P(ry.holder); if(h.out||ry.holder===owner.id) continue;
      const cut=Math.floor(r*ry.pct/100); if(cut<=0) continue;
      const amt=Math.min(cut,owner.cash); owner.cash-=amt; h.cash+=amt;
      log(`🕶️ ${h.name} incassa il ${ry.pct}% (${fmt(amt)}) su ${sq.name}`);
    }
    return;
  }
  switch(sq.t){
    case 'card':return drawCard(p);
    case 'tax':setMsg(`${sq.name} ${fmt(sq.amount)}`,'warn');await pay(p,sq.amount,null,sq.name);return;
    case 'drs':{const n=p.team==='aero'?6:3;setMsg(`DRS aperto: +${n}`,'good');sfx('engine');render();await wait(500);await moveSteps(p,n);return resolve(p);}
    case 'cops':return stopGo(p,'Commissari FIA · Stop & Go');
    case 'pit':setMsg('Transito in Pit Lane');return;
    case 'sc':
      if(S.pot>0){const w=S.pot;S.pot=0;gain(p,w);setMsg(`🚨 Montepremi Safety Car: +${fmt(w)}`,'good');log(`${p.name} incassa il montepremi (${fmt(w)})`);render();if(w>=150)confetti(90);}
      else setMsg('Safety Car: montepremi vuoto');
      return;
    case 'go':setMsg('Semaforo Verde!');return;
  }
}
async function drawCard(p){
  if(!S.deck||S.deckPos>=S.deck.length){S.deck=shuffle([...CARDS.keys()]);S.deckPos=0;}
  const c=CARDS[S.deck[S.deckPos++]];
  sfx('card');setMsg('📻 '+c.txt,'card');log(`${p.name} · Radio: ${c.txt}`);render();
  await wait(1400);
  await c.fx(p);
}

// ================= Aste =================
function cpuMaxBid(p,i){
  const sq=SQ[i];let v=sq.price;
  if(sq.g){
    const idx=groupIdx(sq.g),mine=idx.filter(j=>S.own[j]&&S.own[j].owner===p.id).length;
    if(mine===idx.length-1) v*=1.8; else if(mine>0) v*=1.3;
    if(S.players.some(o=>o!==p&&!o.out&&idx.filter(j=>S.own[j]&&S.own[j].owner===o.id).length===idx.length-1)) v*=1.35;
  }
  return Math.min(Math.floor(v*df().bid*(.85+Math.random()*.3)),p.cash-60);
}
async function auction(i){
  const sq=SQ[i];
  let ids=S.players.filter(p=>!p.out).map(p=>p.id);
  const start=ids.indexOf(S.turn);ids=ids.slice(start).concat(ids.slice(0,start));
  const all=[...ids];let bid=0,leader=null,k=0;const max={};
  sfx('gavel');S.phase='auction';
  const view=(p,human)=>`${human?handoff(p):''}<h2>🔨 Asta · ${esc(sq.name)}</h2>
    <div class="auc"><div class="thumb">${sq.t==='c'?trackSVG(i,'mini'):`<div class="band" style="--g:${gcol(i)};width:8px;height:56px"></div>`}</div>
    <div><div class="big">${fmt(bid)}</div><div class="who">${leader!==null?tok(P(leader))+' '+esc(P(leader).name):'<span class="muted">Nessuna offerta · listino '+fmt(sq.price)+'</span>'}</div></div></div>
    <div class="bidders">${all.map(id=>`<span class="${ids.includes(id)?'':'gone'}">${tok(P(id))}${esc(P(id).name)}</span>`).join('')}</div>
    ${human?`<div class="row">${[10,50,100].map(n=>`<button class="btn ${n===10?'primary':'dark'}" data-choice="${n}" ${bid+n>p.cash?'disabled':''}>+${n}</button>`).join('')}<button class="btn out" data-choice="pass">Passo</button></div>`
      :`<div class="waitline">${tok(p)} ${esc(p.name)} ci pensa…</div>`}`;
  for(let guard=0;guard<300&&ids.length;guard++){
    if(ids.length===1&&leader===ids[0]) break;
    const pid=ids[k%ids.length];
    if(pid===leader){k++;continue;}
    const p=P(pid);let c;
    if(p.cpu){
      openSheet(view(p,false),false);await wait(650);
      if(max[pid]===undefined) max[pid]=cpuMaxBid(p,i);
      const room=max[pid]-bid;
      c= room>=10 ? (room>150&&Math.random()<.4?'50':'10') : 'pass';
    } else c=await ask(view(p,true));
    if(c==='pass'){ids.splice(k%ids.length,1);log(`${p.name} passa`);sfx('no');}
    else{bid+=+c;leader=pid;k++;sfx('bid');}
  }
  closeSheet();
  if(leader!==null){
    const w=P(leader);w.cash-=bid;S.own[i]={owner:w.id,level:0,mort:false};
    sfx('gavel');setMsg(`🔨 ${w.name} vince ${sq.code} a ${fmt(bid)}`,'good');log(`Asta: ${w.name} compra ${sq.name} per ${fmt(bid)}`);
  } else {setMsg(`${sq.code}: nessuna offerta`);log(`Asta deserta per ${sq.name}`);}
}

// ================= Turni =================
function afterPhase(){const p=cur();return (S.lastDbl&&!p.out&&!p.stopgo&&!S.over)?'roll':'end';}
async function roll(){
  if(busy||S.over||S.phase!=='roll') return;
  busy=true;render();
  const p=cur(),d1=rnd6(),d2=rnd6();
  await animateDice(d1,d2);
  S.dice=[d1,d2];S.lastDbl=d1===d2;if(S.lastDbl)S.doubles++;
  log(`${p.name} 🎲 ${d1}+${d2}${S.lastDbl?' doppio':''}`);
  if(S.doubles>=3) await stopGo(p,'3 doppi: Stop & Go');
  else{setMsg(S.lastDbl?`Doppio! ${d1+d2}`:`${d1+d2}`);await moveSteps(p,d1+d2);await resolve(p);}
  if(S.phase!=='buy'&&!S.over) S.phase=afterPhase();
  busy=false;save();render();
}
function buy(){
  if(S.phase!=='buy'||busy) return;
  const p=cur(),i=S.pending,sq=SQ[i];if(p.cash<sq.price)return;
  p.cash-=sq.price;S.own[i]={owner:p.id,level:0,mort:false};sfx('buy');
  log(`${p.name} compra ${sq.name} (${fmt(sq.price)})`);
  const full=sq.g&&ownsGroup(p,sq.g);
  setMsg(full?`Gruppo ${G[sq.g].n} completo!`:`${sq.code} è tuo`,'good');
  if(full) confetti(80);
  S.pending=null;S.phase=afterPhase();save();render();
}
async function toAuction(){
  if(S.phase!=='buy'||busy) return;
  busy=true;const i=S.pending;S.pending=null;
  await auction(i);
  S.phase=afterPhase();busy=false;save();render();
}
function endTurn(){if(S.over||busy||S.phase!=='end')return;nextTurn();}
function nextTurn(){
  if(S.over) return;
  const n=S.players.length;let i=S.turn,k=0,crossed=false;
  do{i=(i+1)%n;k++;if(i===(S.first||0))crossed=true;}while(P(i).out&&k<=n);
  if(crossed){
    S.round++;
    const exp=(S.roys||[]).filter(r=>S.round>r.until).length+(S.pacts||[]).filter(x=>S.round>x.until).length;
    S.roys=(S.roys||[]).filter(r=>S.round<=r.until);S.pacts=(S.pacts||[]).filter(x=>S.round<=x.until);
    if(exp) log(`${exp} accordi sotto banco scaduti`);
    recordHist();
    if(S.limit&&S.round>S.limit){log(`Fine dei ${S.limit} giri`);endGame();return;}
    pickWeekend();
  }
  S.turn=i;startTurn();
}
async function startTurn(){
  const p=cur();
  S.doubles=0;S.lastDbl=false;S.phase='roll';S.pending=null;
  setMsg(`Tocca a ${p.name}`);banner(p);keepAwake();
  if(p.loan&&S.round>p.loan.due){
    const owe=r5(p.loan.owe*1.2);p.loan=null;
    setMsg(`🦈 Lo strozzino riscuote ${fmt(owe)}`,'warn');log(`🦈 Lo strozzino riscuote ${fmt(owe)} da ${p.name} (con mora)`);sfx('siren');render();await wait(900);
    await pay(p,owe,null,'strozzino',{full:true});
    if(p.out||S.over){save();render();if(!S.over){await wait(700);nextTurn();}return;}
  }
  if(p.stopgo){
    S.phase='stopgo';save();render();
    const c=p.cpu?cpuStopGo(p):await ask(`${handoff(p)}<h2>🚦 Stop &amp; Go</h2><p>${esc(p.name)} è fermo in Pit Lane.</p>
      <div class="row">
        ${p.flags>0?`<button class="btn primary" data-choice="flag">Bandiera verde ×${p.flags}</button>`:''}
        <button class="btn ${p.flags?'dark':'primary'}" data-choice="pay" ${p.cash>=STOPGO_FEE?'':'disabled'}>Paga ${fmt(STOPGO_FEE)}</button>
        <button class="btn dark" data-choice="bribe" ${p.cash>=BRIBE?'':'disabled'}>🕶️ Bustarella ${fmt(BRIBE)} <small>${p.team==='law'?75:50}%</small></button>
        <button class="btn out" data-choice="skip">Salto il turno</button>
      </div>`);
    closeSheet();
    p.stopgo=false;
    if(c==='flag'){p.flags--;log(`${p.name} usa Bandiera verde`);sfx('coin');S.phase='roll';}
    else if(c==='pay'){p.cash-=STOPGO_FEE;S.pot=(S.pot||0)+STOPGO_FEE;sfx('pay');log(`${p.name} paga lo Stop & Go`);S.phase='roll';}
    else if(c==='bribe'){
      p.cash-=BRIBE;S.pot=(S.pot||0)+BRIBE;sfx('pay');
      if(Math.random()<(p.team==='law'?.75:.5)){setMsg('🕶️ Commissari corrotti: si riparte!','good');log(`${p.name} corrompe i commissari`);S.phase='roll';sfx('deal');}
      else{setMsg('🕶️ Bustarella scoperta! Turno saltato','warn');log(`${p.name} scoperto a corrompere i commissari`);S.phase='end';sfx('siren');}
    }
    else{setMsg(`${p.name} sconta lo Stop & Go`,'warn');log(`${p.name} salta il turno`);S.phase='end';}
    save();render();
    if(S.phase==='end'){await wait(900);endTurn();return;}
  }
  save();render();
  if(p.cpu) cpuTurn();
}

// ================= CPU =================
function cpuStopGo(p){
  if(p.flags>0) return 'flag';
  if(p.cash>=400&&Math.random()<.25) return 'bribe';
  if(p.cash>=250) return 'pay';
  return 'skip';
}
function cpuWantsBuy(p,i){
  const sq=SQ[i];if(p.cash<sq.price)return false;
  const completes=sq.g&&groupIdx(sq.g).every(j=>j===i||(S.own[j]&&S.own[j].owner===p.id));
  return completes||p.cash-sq.price>=df().reserve;
}
function cpuManage(p){
  for(const i of propsOf(p)) if(S.own[i].mort&&p.cash-unmortCost(i)>=400) unmortgage(i);
  for(let n=0;n<20;n++){
    const o=propsOf(p).filter(i=>canUpgrade(p,i)&&p.cash-upCost(i)>=df().build).sort((a,b)=>S.own[a].level-S.own[b].level||upCost(a)-upCost(b));
    if(!o.length)break;upgrade(o[0]);
  }
}
async function cpuSeekTrade(p){
  S.asked=S.asked||{};
  if(Math.random()>df().trade) return;
  for(const g of Object.keys(G)){
    if(groupHasUpgrades(g)) continue;
    const idx=groupIdx(g),mine=idx.filter(i=>S.own[i]&&S.own[i].owner===p.id);
    if(mine.length!==idx.length-1) continue;
    const j=idx.find(i=>!mine.includes(i));
    if(!S.own[j]||S.own[j].owner===p.id) continue;
    const q=P(S.own[j].owner),key=p.id+'-'+j;
    if(S.asked[key]&&S.round-S.asked[key]<4) continue;
    S.asked[key]=S.round;
    const swap=tradable(p).find(i=>{const s=SQ[i];return s.g&&s.g!==g&&groupIdx(s.g).every(k=>k===i||(S.own[k]&&S.own[k].owner===q.id));});
    const cash=r10(SQ[j].price*(1.6+Math.random()*.6));
    if(swap===undefined&&p.cash-cash<200) continue;
    const offer=blankOffer(p.id,q.id);
    offer.get=[j];
    if(swap!==undefined) offer.give=[swap]; else offer.cashGive=cash;
    // tocco "corrotto": a volte offre un patto o una percentuale

async function cpuTurn(){

function tradable(p){return propsOf(p).filter(i=>S.own[i].level===0&&!(SQ[i].g&&groupHasUpgrades(SQ[i].g)));}
function blankOffer(from,to){return {from,to,give:[],get:[],cashGive:0,cashGet:0,royGive:{pct:0,turns:2},royGet:{pct:0,turns:2},pact:0};}
function invert(o){return {from:o.to,to:o.from,give:[...o.get],get:[...o.give],cashGive:o.cashGet,cashGet:o.cashGive,royGive:{...o.royGet},royGet:{...o.royGive},pact:o.pact};}
function offerValid(o){
  const a=P(o.from),b=P(o.to);
  return !a.out&&!b.out&&a.cash>=o.cashGive&&b.cash>=o.cashGet&&o.give.every(i=>S.own[i]&&S.own[i].owner===a.id)&&o.get.every(i=>S.own[i]&&S.own[i].owner===b.id)
    &&(o.give.length||o.get.length||o.cashGive||o.cashGet||o.pact);
}
function execOffer(o){
  const a=P(o.from),b=P(o.to);
  o.give.forEach(i=>S.own[i].owner=b.id);o.get.forEach(i=>S.own[i].owner=a.id);
  a.cash+=o.cashGet-o.cashGive;b.cash+=o.cashGive-o.cashGet;
  S.roys=S.roys||[];S.pacts=S.pacts||[];
  if(o.royGive.pct) o.give.forEach(i=>S.roys.push({prop:i,holder:a.id,pct:o.royGive.pct,until:S.round+o.royGive.turns}));
  if(o.royGet.pct) o.get.forEach(i=>S.roys.push({prop:i,holder:b.id,pct:o.royGet.pct,until:S.round+o.royGet.turns}));
  if(o.pact) S.pacts.push({a:a.id,b:b.id,until:S.round+o.pact});
  st(a.id).deals++;st(b.id).deals++;
  sfx('deal');log(`🤝 Affare ${a.name} ⇄ ${b.name}`);setMsg(`🤝 Affare ${a.name} ⇄ ${b.name}`,'good');
  save();render();
}
function rentPower(p){return propsOf(p).reduce((s,i)=>s+(S.own[i].mort?0:(SQ[i].t==='u'?40:rentOf(i))),0);}
function valFor(i,receiver,bundle){
  const sq=SQ[i];let v=S.own[i].mort?sq.price*.5:sq.price;
  if(sq.g&&groupIdx(sq.g).every(j=>bundle.includes(j)||(S.own[j]&&S.own[j].owner===receiver.id))) v+=sq.price*1.5;
  return v;
}
const royFactor=r=>Math.min(.8,r.pct/100*r.turns*.35);
function cpuEval(o){ // dal punto di vista di chi riceve l'offerta (o.to)
  const R=P(o.to),A=P(o.from);
  let gain=o.cashGive+o.give.reduce((s,i)=>s+valFor(i,R,o.give)*(1-royFactor(o.royGive)),0)
          +o.get.reduce((s,i)=>s+SQ[i].price*royFactor(o.royGet),0);
  let loss=o.cashGet+o.get.reduce((s,i)=>s+(S.own[i].mort?SQ[i].price*.5:SQ[i].price)+(valFor(i,A,o.get)-SQ[i].price)*.6,0);
  if(o.pact){const d=(rentPower(A)-rentPower(R))*o.pact*.4; if(d>0) gain+=d; else loss+=-d;}
  return {gain,loss};
}
function cpuRespond(o){
  const R=P(o.to),A=P(o.from);
  const {gain,loss}=cpuEval(o);
  if(gain>=loss*df().accept+5&&gain>0) return {type:'accept'};
  const deficit=r10(loss*1.15-gain+10);
  const c=invert(o);
  if(c.cashGive>0){const red=Math.min(c.cashGive,deficit);c.cashGive-=red;const rest=deficit-red;if(rest>0)c.cashGet+=rest;}
  else c.cashGet+=deficit;
  if(c.cashGet<=A.cash&&deficit<1500&&Math.random()<.85) return {type:'counter',offer:c,line:'Così non ci sto. Facciamo così:'};
  if(c.give.length&&!c.royGive.pct){const c2=invert(o);c2.royGive={pct:50,turns:3};if(cpuEval(invert(c2)).gain>=0) return {type:'counter',offer:c2,line:'Niente soldi? Allora mi tengo il 50% dei diritti per 3 giri.'};}
  return {type:'reject'};
}
function offerSummary(o,viewer){
  const me=P(viewer),other=P(viewer===o.from?o.to:o.from);

  const cl=[];
  if(v.royGive.pct&&v.give.length) cl.push(`Tu tieni il ${v.royGive.pct}% dei diritti su ciò che cedi per ${v.royGive.turns} giri`);
  if(v.royGet.pct&&v.get.length) cl.push(`${esc(other.name)} tiene il ${v.royGet.pct}% su ciò che ti cede per ${v.royGet.turns} giri`);
  if(v.pact) cl.push(`Patto: nessun diritto tra voi per ${v.pact} giri`);
  return `<div class="trade"><div><h3>Ricevi</h3>${side(v.get,v.cashGet)}</div><div><h3>Dai</h3>${side(v.give,v.cashGive)}</div></div>
    ${cl.length?`<div class="clauses"><h3>🕶️ Sotto banco</h3>${cl.map(t=>`<div class="cl">${t}</div>`).join('')}</div>`:''}`;
}

async function negotiate(o){
  for(let chain=0;chain<6;chain++){
    if(!offerValid(o)){log('Trattativa saltata');return false;}
    const R=P(o.to),A=P(o.from);
    let resp;
    if(R.cpu){
      resp=cpuRespond(o);
      if(resp.type!=='accept'){
        if(A.cpu&&resp.type==='counter'){ // tra CPU: accettano la controfferta se ancora conveniente
          const ev=cpuEval(resp.offer); resp= ev.gain>=ev.loss? {type:'accept',offer:resp.offer}:{type:'reject'};
          if(resp.type==='accept'){execOffer(resp.offer);return true;}
        }
      }
    } else {
      const c=await ask(`${handoff(R)}<h2>📨 Offerta da ${tok(A)} ${esc(A.name)}</h2>${o.line?`<p><b>“${esc(o.line)}”</b></p>`:''}${offerSummary(o,R.id)}
        <div class="row"><button class="btn primary" data-choice="ok">Accetta</button><button class="btn dark" data-choice="counter">Controfferta</button><button class="btn out" data-choice="no">Rifiuta</button></div>`);
      closeSheet();
      if(c==='ok') resp={type:'accept'};
      else if(c==='no') resp={type:'reject'};
      else{
        const n=await editOffer(invert(o),true,`Controfferta a ${esc(A.name)}`);
        resp=n?{type:'counter',offer:n}:{type:'reject'};
      }
    }
    if(resp.type==='accept'){execOffer(o);if(R.cpu&&!A.cpu) await say(`${esc(R.name)} accetta! 🤝`);return true;}
    if(resp.type==='reject'){sfx('no');log(`${R.name} rifiuta ${A.name}`);setMsg(`${R.name} rifiuta l'offerta`,'warn');render();if(R.cpu&&!A.cpu) await say(`${esc(R.name)} rifiuta.`);return false;}
    o=resp.offer;if(resp.line)o.line=resp.line;
    sfx('bid');log(`${R.name} fa una controfferta`);
  }
  log('Trattativa arenata');return false;
}
function say(t){return ask(`<h2>${t}</h2><div class="row"><button class="btn primary" data-choice="ok">OK</button></div>`).then(()=>closeSheet());}

async function startTrade(pre={}){

}

function confetti(n=140){
  if(reduced)return;
  const cv=$('#confetti');cv.hidden=false;const ctx=cv.getContext('2d'),s=devicePixelRatio||1;
  const W=cv.width=innerWidth*s,H=cv.height=innerHeight*s;
  const cols=['#e10a1e','#f5b400','#15171c','#2563eb','#15a34a','#ec4899','#ffffff'];
  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.35,y:H*.4,vx:(Math.random()-.5)*16*s,vy:(-Math.random()*13-4)*s,r:Math.random()*6,vr:(Math.random()-.5)*.4,w:(4+Math.random()*5)*s,h:(6+Math.random()*8)*s,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){
    ctx.clearRect(0,0,W,H);
    ps.forEach(q=>{q.vy+=.38*s;q.x+=q.vx;q.y+=q.vy;q.vx*=.985;q.r+=q.vr;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.fillStyle=q.c;ctx.fillRect(-q.w/2,-q.h/2,q.w,q.h);ctx.restore();});
    if(t-t0<2800)requestAnimationFrame(f);else{ctx.clearRect(0,0,W,H);cv.hidden=true;}
  })(t0);
}

function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p;}
function chartHTML(){
  const h=S.hist||[];if(h.length<2)return '';

  const x=k=>L+(W-L-Rr)*k/(h.length-1),y=v=>T+(H-T-B)*(1-v/top);
  let g='';
  for(let v=0;v<=top+1e-9;v+=step) g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${v>=1000?(v/1000).toFixed(v%1000?1:0)+'k':v}</text>`;
  g+=`<text x="${L}" y="${H-6}" font-size="10" fill="var(--muted)">Giro ${h[0].r}</text><text x="${W-Rr}" y="${H-6}" text-anchor="end" font-size="10" fill="var(--muted)">Giro ${h[h.length-1].r}</text>`;
  const lines=S.players.map((p,pi)=>`<polyline points="${h.map((e,k)=>x(k).toFixed(1)+','+y(e.v[pi]).toFixed(1)).join(' ')}" fill="none" stroke="${p.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(h.length-1)}" cy="${y(h[h.length-1].v[pi])}" r="4" fill="${p.color}" stroke="var(--surface)" stroke-width="2"/>`).join('');

}

    const sums=cont.filter(id=>res[id]).map(id=>res[id][0]+res[id][1]),mx=Math.max(0,...sums);
    return `<h2>🏎️ Chi parte in pole?</h2>${tie?'<p><b>Pari! Spareggio.</b></p>':''}
      <div class="order">${S.players.map(p=>{const r=res[p.id];const on=r&&cont.includes(p.id)&&r[0]+r[1]===mx;
        return `<div class="${on?'best':''}">${tok(p)}<span>${esc(p.name)}</span><span class="dd">${r?`<span class="die">${dieHTML(r[0])}</span><span class="die">${dieHTML(r[1])}</span>`:'<span class="muted">…</span>'}</span><span class="sum">${r?r[0]+r[1]:''}</span></div>`;}).join('')}</div>${btn}`;
  };
  for(let guard=0;guard<10&&cont.length>1;guard++){
    for(const id of cont){
      const p=P(id);
      if(p.cpu){openSheet(view(`<div class="waitline">${tok(p)} ${esc(p.name)} lancia…</div>`),false);await wait(550);}
      else await ask(view(`${handoff(p)}<div class="row"><button class="btn primary" data-choice="roll">🎲 Lancia ${esc(p.name)}</button></div>`));
      res[id]=[rnd6(),rnd6()];sfx('dice');
      openSheet(view(''),false);await wait(450);
    }
    const mx=Math.max(...cont.map(id=>res[id][0]+res[id][1]));
    const top=cont.filter(id=>res[id][0]+res[id][1]===mx);
    if(top.length>1){tie=true;cont=top;cont.forEach(id=>delete res[id]);openSheet(view(''),false);await wait(700);}
    else cont=top;
  }
  const w=P(cont[0]);
  sfx('engine');
  const pole=`<div class="pole">${tok(w)} ${esc(w.name)} parte in pole!</div>`;
  if(S.players.every(p=>p.cpu)){openSheet(view(pole),false);await wait(1200);}
  else await ask(view(pole+`<div class="row"><button class="btn primary" data-choice="go">🚦 Semaforo verde</button></div>`));
  closeSheet();
  return w.id;
}
async function startGame(champ=null){
  syncNames();
  setup.players.forEach((p,i)=>{p.name=(p.name||'').trim()||`Pilota ${i+1}`;});
  if(!champ&&setup.mode!=='single'){
    const n=setup.mode==='c5'?5:3;
    const names=shuffle(RACES.filter(r=>r!=='GP di Las Vegas')).slice(0,n-1).concat('GP di Las Vegas');
    champ={n,idx:0,names,pts:setup.players.map(()=>0),wins:setup.players.map(()=>0),limit:setup.climit||12,results:[]};
  }
  S={players:setup.players.map((p,i)=>({id:i,name:p.name,color:p.color,cpu:p.cpu,team:p.team||rndTeam(),cash:START_CASH,pos:0,out:false,stopgo:false,flags:0,loan:null})),
    own:{},roys:[],pacts:[],turn:0,phase:'roll',doubles:0,lastDbl:false,dice:[5,2],round:1,limit:setup.limit,
    deck:shuffle([...CARDS.keys()]),deckPos:0,log:[],msg:null,over:false,pending:null,asked:{},
    pot:0,weekend:null,stats:{},first:0,fast:setup.fast,diff:setup.diff,hist:[],champ};
  if(champ) S.limit=champ.limit;
  S.phase='order';
  $('#cars').innerHTML='';for(const k in carRot)delete carRot[k];for(const k in prevCash)delete prevCash[k];
  closeSheet();render();
  if(champ){sfx('engine');await ask(`<h2>🏆 ${esc(champ.names[champ.idx])}</h2><p>Gara ${champ.idx+1} di ${champ.n} · ${champ.limit} giri${champ.idx===champ.n-1?' · <b>punti doppi</b>':''}</p>${champ.idx?champTable(champ):''}<div class="row"><button class="btn primary" data-choice="go">Allo schieramento</button></div>`);closeSheet();}
  if(!tutDone()) await tutorial();
  const w=await chooseOrder();
  S.first=S.turn=w;S.phase='roll';recordHist();
  log('Semaforo verde!');pickWeekend();sfx('engine');startTurn();
}

// ================= Tutorial =================
const TUT_KEY='paddock-tycoon-tutorial';
const tutDone=()=>{try{return localStorage.getItem(TUT_KEY)==='1';}catch(e){return true;}};
const TUT=[
  ['#board','🏁 Benvenuto in pista','Il tabellone è un circuito di 32 caselle. Le monoposto girano in senso antiorario; a ogni passaggio dal Semaforo Verde incassi €150M.'],
  ['.dice','🎲 I dadi','Tocca Lancia per muoverti. Con un doppio rilanci, ma al terzo doppio di fila prendi uno Stop & Go.'],
  ['#c22','🏟️ I circuiti','Tocca un circuito per vedere prezzo e diritti. Se ti fermi su uno libero puoi comprarlo o mandarlo all\'asta.'],
  ['#c1','🎨 Gruppi colore','Possiedi tutti i circuiti dello stesso colore? I diritti raddoppiano e puoi costruire tribune e poi il Gran Premio.'],
  ['#tower','🏎️ I piloti','Soldi in cassa e scuderia di ogni pilota. Toccane uno per vedere i suoi circuiti e proporgli un affare.'],
  ['#actions','🕹️ La plancia','Qui lanci, compri, mandi all\'asta e chiudi il turno. Da “Circuiti” gestisci tribune, ipoteche e lo strozzino.'],
  ['#pot','🚨 Eventi del giro','Ogni giro un GP del weekend paga diritti doppi. Tasse e multe riempiono il montepremi: chi si ferma sulla Safety Car lo incassa.'],
  ['#tab','🤝 Affari','Apri la tendina per trattare con gli avversari: soldi, circuiti, controfferte e accordi sotto banco.'],
  [null,'🚦 Pronto?','Se finisci i soldi puoi ipotecare e smontare; perdi solo quando non ti resta nulla. Buona gara!'],
];
function tutorial(){
  return new Promise(res=>{
    let k=0;const ov=document.createElement('div');ov.className='coach';document.body.appendChild(ov);
    const finish=()=>{ov.remove();removeEventListener('resize',draw);try{localStorage.setItem(TUT_KEY,'1');}catch(e){}res();};
    function draw(){
      const [sel,t,d]=TUT[k],el=sel&&document.querySelector(sel),r=el&&el.offsetParent!==null?el.getBoundingClientRect():null;
      const vw=innerWidth,vh=innerHeight,bw=Math.min(320,vw-32);
      let spot='',bx=(vw-bw)/2,by=vh/2-90;
      if(r&&r.width){
        const pad=6;spot=`<div class="spot" style="left:${r.left-pad}px;top:${r.top-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px"></div>`;
        const big=r.width*r.height>vw*vh*.5;
        if(big){bx=(vw-bw)/2;by=vh/2-90;}
        else if(r.right+bw+20<vw){bx=r.right+14;by=Math.min(Math.max(12,r.top),vh-200);}
        else if(r.left-bw-20>0){bx=r.left-bw-14;by=Math.min(Math.max(12,r.top),vh-200);}
        else{bx=Math.min(Math.max(12,r.left),vw-bw-12);by=r.bottom+180<vh?r.bottom+12:Math.max(12,r.top-190);}
      }else spot='<div class="spot none"></div>';
      ov.innerHTML=`${spot}<div class="bubble" style="left:${bx}px;top:${by}px;width:${bw}px" role="dialog" aria-live="polite">
        <div class="tstep">${k+1} / ${TUT.length}</div><b>${t}</b><p>${d}</p>
        <div class="row"><button class="btn sm out" data-tut="skip">Salta</button><button class="btn sm primary" data-tut="next">${k===TUT.length-1?'Via!':'Avanti'}</button></div></div>`;
      const nb=ov.querySelector('[data-tut=next]');nb&&nb.focus({preventScroll:true});
    }
    ov.addEventListener('click',e=>{const b=e.target.closest('[data-tut]');if(!b)return;e.stopPropagation();
      if(b.dataset.tut==='skip'){finish();return;} sfx('bid');k++; if(k>=TUT.length)finish(); else draw();});
    addEventListener('resize',draw);draw();
  });
}

// ================= Eventi =================
async function goFullscreen(){
  try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen({navigationUI:'hide'});}catch(e){}
  try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');}catch(e){}
}
const ACT={
  roll:()=>roll(),buy:()=>buy(),auction:()=>toAuction(),end:()=>endTurn(),
  info:b=>showInfo(+b.dataset.i),pinfo:b=>showPlayer(+b.dataset.i),close:()=>closeSheet(),log:()=>showLog(),
  rules:()=>showRules(),setup:()=>showSetup(),start:()=>startGame(),results:()=>showGameOver(),
  sound:()=>{muted=!muted;try{localStorage.setItem(MUTE_KEY,muted?'1':'0');}catch(e){}paintSound();sfx('coin');},
  fullscreen:()=>goFullscreen(),
  manage:()=>showManage(),
  up:b=>{const i=+b.dataset.i;if(canUpgrade(cur(),i)){upgrade(i);after(b);}},
  down:b=>{const i=+b.dataset.i;if(S.own[i]&&S.own[i].owner===cur().id&&S.own[i].level>0){sellUpgrade(i);after(b);}},
  mort:b=>{const i=+b.dataset.i;if(canMortgage(i)&&S.own[i].owner===cur().id){mortgage(i);after(b);}},
  unmort:b=>{const i=+b.dataset.i;if(S.own[i]&&S.own[i].owner===cur().id){unmortgage(i);after(b);}},
  trade:()=>startTrade(),
  loan:b=>{const p=cur();if(p.loan||p.cpu)return;const n=+b.dataset.v;p.cash+=n;p.loan={owe:Math.round(n*1.3),due:S.round+3};sfx('coin');log(`🦈 ${p.name} prende ${fmt(n)} dallo strozzino`);save();render();showManage();},
  repay:()=>{const p=cur();if(!p.loan||p.cash<p.loan.owe)return;p.cash-=p.loan.owe;log(`${p.name} salda lo strozzino (${fmt(p.loan.owe)})`);p.loan=null;sfx('pay');save();render();showManage();},
  team:b=>{syncNames();const p=setup.players[+b.dataset.i];p.team=TEAM_IDS[(TEAM_IDS.indexOf(p.team)+1)%TEAM_IDS.length];showSetup();},
  diff:b=>{syncNames();setup.diff=b.dataset.v;showSetup();},
  mode:b=>{syncNames();setup.mode=b.dataset.v;showSetup();},
  climit:b=>{syncNames();setup.climit=+b.dataset.v;showSetup();},
  nextrace:()=>{const c=S.champ;if(!c||c.idx>=c.n-1)return;c.idx++;startGame(c);},
  tutorial:()=>{closeSheet();tutorial();},
  tradefor:b=>{closeSheet();startTrade({to:+b.dataset.o,get:b.dataset.i!==undefined?[+b.dataset.i]:[]});},
  'tr-to':b=>{readSelects();TR.o.to=+b.dataset.i;TR.o.get=[];TR.o.cashGet=0;paintEditor();},
  'tr-pick':b=>{readSelects();const a=TR.o[b.dataset.side],i=+b.dataset.i,k=a.indexOf(i);if(k>=0)a.splice(k,1);else a.push(i);paintEditor();},
  'tr-cash':b=>{readSelects();const o=TR.o,k=b.dataset.k,max=k==='cashGive'?P(o.from).cash:P(o.to).cash;o[k]=Math.max(0,Math.min(max,o[k]+ +b.dataset.d));paintEditor();},
  'tr-send':()=>{readSelects();const o=TR.o;delete o.line;
    if(!(o.give.length||o.get.length||o.cashGive||o.cashGet||o.pact)) return paintEditor('Scegli almeno qualcosa.');
    const r=trResolve;trResolve=null;closeSheet();r({...o});},
  'tr-cancel':()=>{const r=trResolve;trResolve=null;closeSheet();r(null);},
  add:()=>{syncNames();const used=setup.players.map(p=>p.color);setup.players.push({name:'CPU '+['Alfa','Bravo','Charlie','Delta','Echo','Fox'][setup.players.length],cpu:true,color:COLORS.find(c=>!used.includes(c)),team:rndTeam()});showSetup();},
  rm:b=>{syncNames();setup.players.splice(+b.dataset.i,1);showSetup();},
  human:b=>{syncNames();setup.players[+b.dataset.i].cpu=false;showSetup();},
  cpu:b=>{syncNames();setup.players[+b.dataset.i].cpu=true;showSetup();},
  lim:b=>{syncNames();setup.limit=+b.dataset.v;showSetup();},
  pace:b=>{syncNames();setup.fast=b.dataset.v==='true';showSetup();},
  col:b=>{syncNames();const p=setup.players[+b.dataset.i],used=setup.players.map(x=>x.color);let k=COLORS.indexOf(p.color);for(let n=0;n<6;n++){k=(k+1)%6;if(!used.includes(COLORS[k]))break;}p.color=COLORS[k];showSetup();},
};
function after(b){save();render();if(b.dataset.ctx==='info')showInfo(+b.dataset.i);else showManage();}
const NO_GAME_OK=['fullscreen','sound','setup','start','rules','close','add','rm','human','cpu','col','lim','pace','info','team','diff','mode','climit','tutorial'];
document.addEventListener('pointerdown',()=>ac(),{once:true});
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-choice]');
  if(c&&!c.disabled&&choice){const r=choice;choice=null;r(c.dataset.choice);return;}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const f=ACT[b.dataset.act];if(!f)return;
  if(!S&&!NO_GAME_OK.includes(b.dataset.act))return;
  f(b);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#backdrop').hidden&&sheetDismiss){closeSheet();return;}
  if(!S||S.over||!$('#backdrop').hidden||cur().cpu||e.target.closest('input,select,textarea'))return;
  const k=e.key.toLowerCase();
  if(k===' '||k==='enter'){e.preventDefault();if(S.phase==='roll')roll();else if(S.phase==='end')endTurn();}
  else if(k==='c'&&S.phase==='buy')buy();
  else if(k==='a'&&S.phase==='buy')toAuction();
});
let wakeLock=null;
async function keepAwake(){try{if(!wakeLock&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null);}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S&&!S.over)keepAwake();});

// ================= Avvio =================
function boot(){
  paintSound();buildBoard();
  const saved=loadSaved();
  if(saved&&saved.players&&!saved.over){
    S=saved;busy=false;S.roys=S.roys||[];S.pacts=S.pacts||[];S.pot=S.pot||0;S.stats=S.stats||{};S.first=S.first||0;
    if(S.phase==='order'){S.phase='roll';}
    if(S.champ){setup.mode=S.champ.n===5?'c5':'c3';setup.climit=S.champ.limit;}
    setup.fast=!!S.fast;setup.diff=S.diff||'normal';S.hist=S.hist||[];
    setup.players.forEach((q,k)=>q.team=S.players[k].team||rndTeam());
    setup.players=S.players.map(p=>({name:p.name,cpu:p.cpu,color:p.color}));setup.limit=S.limit||0;
    if(S.phase==='auction'){S.phase='buy';}
    if(S.phase==='buy'&&S.pending==null) S.phase='end';
    render();
    if(S.phase==='stopgo'){cur().stopgo=true;startTurn();}
    else if(cur().cpu) cpuTurn();
  } else {render();showSetup();}
}
boot();
