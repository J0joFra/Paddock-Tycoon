<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111317">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
<title>Paddock Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Titillium+Web:wght@400;600;700&display=swap">
<style>
/* Layout: monitor del muretto box. Tabellone come un circuito chiuso, timing tower sopra, pannello di direzione gara sotto. Tema unico scuro, scelto di proposito. */
:root{
  --asphalt:#111317; --panel:#1a1d23; --panel-2:#232831; --line:#2e333c; --ink:#eef1f5; --muted:#8f98a7;
  --flag:#ffd400; --purple:#b46cff; --green:#35d07f; --danger:#ff4d5e; --on-flag:#111317;
  --f-display:'Saira Condensed','Arial Narrow',Impact,sans-serif;
  --f-body:'Titillium Web',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{background:var(--asphalt);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:12px}
@media(min-width:900px) and (min-height:621px){.wrap{grid-template-columns:minmax(0,580px) minmax(0,1fr);align-items:start}}

.side{display:grid;gap:12px;align-content:start;min-width:0}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:10px}
.logo i{display:inline-block;width:22px;height:16px;background:repeating-conic-gradient(var(--ink) 0 25%,var(--asphalt) 0 50%) 0 0/8px 8px;border-radius:2px}
.logo b{color:var(--flag);font-weight:800}
.menu{display:flex;gap:6px}
.menu .btn,.logo span{white-space:nowrap}
#fsbtn{display:none}
@media (pointer:coarse){#fsbtn{display:inline-block}}

/* Orizzontale su telefono: tabellone alto quanto lo schermo, pannello a destra */
@media (orientation:landscape) and (max-height:620px){
  html,body{height:100%}
  body{overflow:hidden;padding-block:6px;box-sizing:border-box}
  .wrap{max-width:none;height:100%;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:stretch}
  .boardcol{height:100%;min-height:0;display:flex;align-items:center}
  .board{height:100%;width:auto;max-width:none;box-sizing:border-box;border-radius:10px}
  .side{overflow-y:auto;gap:8px;align-content:start;padding-right:2px;overscroll-behavior:contain}
  .logo{font-size:17px}
  .menu .btn{padding:4px 8px;font-size:12px;min-height:30px}
  .chip{min-width:84px;padding:4px 8px 4px 10px}
  .chip .cash{font-size:14px}
  .chip .meta{display:none}
  .panel{padding:8px;gap:8px}
  .btn{min-height:40px;font-size:15px;padding:6px 12px}
  .btn.ghost{min-height:34px;font-size:13px}
  .log ol{max-height:none}
  .sheet{max-height:94%;max-width:680px;border-radius:14px 14px 0 0}
}

/* Verticale su telefono: chiedi di ruotare */
.rotate{display:none}
@media (orientation:portrait) and (max-width:760px) and (pointer:coarse){
  .rotate{position:fixed;inset:0;z-index:50;background:var(--asphalt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px))}
  .rotate h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:28px;margin:0;letter-spacing:.04em}
  .rotate p{margin:0;color:var(--muted);max-width:30ch}
  .rotate .phone{width:46px;height:78px;border:3px solid var(--ink);border-radius:9px;position:relative;animation:turn 2.4s ease-in-out infinite}
  .rotate .phone::after{content:"";position:absolute;left:50%;bottom:5px;width:8px;height:3px;margin-left:-4px;background:var(--flag);border-radius:2px}
  @keyframes turn{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
}

/* Timing tower */
.tower{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tower::-webkit-scrollbar{display:none}
.chip{flex:1 0 auto;min-width:96px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px 6px 12px;position:relative;display:grid;gap:0}
.chip::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:4px;border-radius:0 3px 3px 0;background:var(--pc)}
.chip.now{border-color:var(--flag);background:var(--panel-2)}
.chip.out{opacity:.4}
.chip .nm{font-family:var(--f-display);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;display:flex;gap:6px;align-items:center}
.chip .cash{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
.chip .meta{font-size:11px;color:var(--muted);white-space:nowrap}
.tag{font-family:var(--f-display);font-size:10px;font-weight:700;letter-spacing:.06em;padding:0 5px;border-radius:3px;background:var(--danger);color:var(--ink)}
.tag.cpu{background:var(--line);color:var(--muted)}

/* Board */
.board{display:grid;grid-template-columns:1.3fr repeat(7,1fr) 1.3fr;grid-template-rows:1.3fr repeat(7,1fr) 1.3fr;gap:2px;background:var(--line);border:2px solid var(--line);border-radius:12px;overflow:hidden;width:100%;max-width:580px;aspect-ratio:1;margin-inline:auto}
.cell{background:var(--panel);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;min-height:0;padding:2px;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:clamp(8px,2.3vw,12px);letter-spacing:.03em;text-align:center;line-height:1;border:0;color:var(--ink)}
.cell:focus-visible{outline:2px solid var(--flag);outline-offset:-2px;z-index:2}
.cell .strip{position:absolute;background:var(--g)}
.side-b .strip{top:0;left:0;right:0;height:20%}
.side-t .strip{bottom:0;left:0;right:0;height:20%}
.side-l .strip{right:0;top:0;bottom:0;width:20%}
.side-r .strip{left:0;top:0;bottom:0;width:20%}
.cell .pr{font-family:var(--f-body);font-weight:600;font-size:.75em;color:var(--muted);font-variant-numeric:tabular-nums}
.cell.owned{box-shadow:inset 0 0 0 2px var(--oc)}
.cell .lv{display:flex;gap:1px;height:.6em}
.cell .lv i{width:.45em;background:var(--flag);border-radius:1px}
.cell .lv b{font-size:.8em;background:var(--purple);color:var(--ink);padding:0 2px;border-radius:2px;line-height:1.2}
.cell .tks{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;position:absolute;bottom:3px;left:2px;right:2px}
.tk{width:clamp(7px,2vw,11px);aspect-ratio:1;border-radius:50%;background:var(--pc);box-shadow:0 0 0 1px var(--asphalt)}
.tk.me{box-shadow:0 0 0 1px var(--asphalt),0 0 0 2.5px var(--ink)}
.cell.special{color:var(--muted)}
.cell.k{font-size:clamp(9px,2.6vw,14px);color:var(--ink)}
.cell.go{background:repeating-conic-gradient(#e9ecf1 0 25%,#16181c 0 50%) 0 0/10px 10px}
.cell.go span.lbl,.cell.k span.lbl{background:var(--asphalt);padding:2px 4px;border-radius:3px}
.cell.cops span.lbl{background:var(--danger);color:var(--ink);padding:2px 4px;border-radius:3px}
.cell.sc span.lbl{background:var(--flag);color:var(--on-flag);padding:2px 4px;border-radius:3px}
.cell.pit span.lbl{border:1px solid var(--ink);padding:1px 4px;border-radius:3px}
.cell.hl{background:var(--panel-2)}
.center{grid-area:2/2/9/9;background:radial-gradient(120% 90% at 50% 0%,#1d2129 0%,var(--asphalt) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.6vw,10px);padding:8px;text-align:center;min-width:0}
.center .brand{font-family:var(--f-display);font-weight:800;font-size:clamp(14px,4.2vw,26px);letter-spacing:.06em;text-transform:uppercase;line-height:1}
.center .brand b{color:var(--flag)}
.dice{display:flex;gap:10px}
.die{width:clamp(28px,8.5vw,46px);aspect-ratio:1;background:var(--ink);border-radius:22%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%;box-shadow:0 3px 0 #9aa3b2}
.die i{border-radius:50%;margin:10%}
.die i.on{background:var(--asphalt)}
.die.rolling{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
.now{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:clamp(11px,3vw,15px);display:flex;align-items:center;gap:6px}
.now .tk{width:12px}
.now small{color:var(--muted);font-weight:500}
.msg{font-size:clamp(11px,2.9vw,14px);max-width:30ch;min-height:2.9em;color:var(--ink);text-wrap:balance}
.msg.card{background:var(--purple);color:var(--ink);border-radius:6px;padding:4px 8px}
.msg.warn{color:var(--danger);font-weight:700}
.msg.good{color:var(--green);font-weight:700}

/* Panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 auto}
.btn{font-family:var(--f-display);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;min-height:46px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.btn.primary{background:var(--flag);color:var(--on-flag);border-color:var(--flag)}
.btn.ghost{background:transparent;font-size:14px;min-height:40px}
.btn.danger{background:var(--danger);border-color:var(--danger)}
.btn.sm{font-size:13px;min-height:34px;padding:4px 10px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.waitline{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;min-height:46px}
.waitline .tk{width:12px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.log h3,.sheet h3{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted);margin:0}
.log ol{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px;font-size:13px;max-height:180px;overflow:auto}
.log li{color:var(--muted)}
.log li:first-child{color:var(--ink)}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(5,6,8,.72);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;width:100%;max-width:580px;max-height:88%;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.05;text-wrap:balance}
.sheet p{margin:0;color:var(--muted)}
.sheet .band{height:8px;border-radius:4px;background:var(--g)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:700}
.kv .cur{color:var(--flag)}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel-2);border-radius:8px;padding:8px 10px}
.item .sw{width:10px;height:28px;border-radius:3px;background:var(--g)}
.item .t{min-width:0}
.item .t b{display:block;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.03em;font-size:15px}
.item .t small{color:var(--muted);font-size:12px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center}
.prow input[type=text]{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px;color:var(--ink);font:inherit;min-width:0;width:100%}
.prow input:focus-visible,select:focus-visible,.num:focus-visible{outline:2px solid var(--flag);outline-offset:1px}
.swatch{width:26px;height:26px;border-radius:50%;background:var(--pc);border:2px solid var(--line);cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 10px;font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:12px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--asphalt)}
select,.num{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px;color:var(--ink);font:inherit;width:100%}
label.fld{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.tradecols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tradecols>div{min-width:0;display:grid;gap:6px;align-content:start}
.pick{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;cursor:pointer;text-align:left;width:100%}
.pick.on{border-color:var(--flag);background:#2b2a1c}
.pick .sw{width:8px;height:18px;border-radius:2px;background:var(--g);flex:none}
.cardbox{background:var(--purple);border-radius:10px;padding:16px;font-size:17px;font-weight:600}
.rules{display:grid;gap:10px;font-size:14px}
.rules h4{margin:4px 0 0;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;font-size:15px}
.rules p{color:var(--ink);opacity:.85}
.rank{display:grid;gap:6px}
.rank div{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:var(--panel-2);padding:8px 10px;border-radius:8px;font-variant-numeric:tabular-nums}
.rank div:first-child{border:1px solid var(--flag)}
.rank .pos{font-family:var(--f-display);font-weight:800;font-size:20px}
.muted{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="boardcol">
    <div class="board" id="board"></div>
  </div>
  <div class="side">
    <header class="top">
      <div class="logo"><i></i><span>Paddock <b>Tycoon</b></span></div>
      <div class="menu">
        <button class="btn ghost sm" data-act="fullscreen" id="fsbtn">Schermo intero</button>
        <button class="btn ghost sm" data-act="rules">Regole</button>
        <button class="btn ghost sm" data-act="setup">Nuova</button>
      </div>
    </header>
    <div class="tower" id="tower"></div>
    <section class="panel" id="actions"></section>
    <section class="panel log"><h3>Direzione gara</h3><ol id="log"></ol></section>
  </div>
</main>

<div class="rotate" id="rotate">
  <div class="phone" aria-hidden="true"></div>
  <h2>Gira il telefono</h2>
  <p>Paddock Tycoon si gioca in orizzontale, come un monitor del muretto box.</p>
  <button class="btn primary" data-act="fullscreen">Schermo intero orizzontale</button>
</div>

<div class="backdrop" id="backdrop" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
// ---------- Dati ----------
const START_CASH = 1400, LAP_BONUS = 150, STOPGO_FEE = 50;
const KEY = 'paddock-tycoon-v1';
const G = {
  g1:{n:'Nuovi Orizzonti',c:'#2ec4b6',up:50},
  g2:{n:'Deserto',c:'#f4a259',up:60},
  g3:{n:'Oriente',c:'#ff6b8b',up:90},
  g4:{n:'Americhe',c:'#4cc9f0',up:110},
  g5:{n:'Classici',c:'#a3e635',up:140},
  g6:{n:'Leggende',c:'#c084fc',up:180},
};
const C = (name,code,g,price,km,country)=>({t:'c',name,code,g,price,km,country});
const CARD = {t:'card',name:'Radio Box',code:'RADIO'};
const DRS = {t:'drs',name:'Zona DRS',code:'DRS'};
const SQ = [
  {t:'go',name:'Semaforo Verde',code:'VIA'},
  C('Miami','MIA','g1',60,5.412,'Stati Uniti'),
  CARD,
  C('Las Vegas','LVG','g1',70,6.201,'Stati Uniti'),
  C('Lusail','LUS','g1',80,5.419,'Qatar'),
  {t:'tax',name:"Tassa d'iscrizione",code:'TASSA',amount:80},
  C('Sakhir','BHR','g2',100,5.412,'Bahrein'),
  C('Jeddah','JED','g2',110,6.174,'Arabia Saudita'),
  {t:'pit',name:'Pit Lane',code:'PIT'},
  C('Yas Marina','ABU','g2',120,5.281,'Emirati Arabi'),
  {t:'u',name:'Fornitore Gomme',code:'GOMME',price:150},
  C('Marina Bay','SIN','g3',140,4.940,'Singapore'),
  DRS,
  C('Shanghai','SHA','g3',150,5.451,'Cina'),
  CARD,
  C('Suzuka','SUZ','g3',170,5.807,'Giappone'),
  {t:'sc',name:'Safety Car',code:'SC'},
  C('Austin','COA','g4',190,5.513,'Stati Uniti'),
  CARD,
  C('Città del Messico','MEX','g4',200,4.304,'Messico'),
  C('Interlagos','INT','g4',220,4.309,'Brasile'),
  {t:'u',name:'Fornitore Carburante',code:'FUEL',price:150},
  C('Spa-Francorchamps','SPA','g5',240,7.004,'Belgio'),
  DRS,
  {t:'cops',name:'Commissari FIA',code:'FIA'},
  C('Montréal','MTL','g5',250,4.361,'Canada'),
  C('Hungaroring','HUN','g5',260,4.381,'Ungheria'),
  CARD,
  C('Silverstone','SIL','g6',300,5.891,'Regno Unito'),
  {t:'tax',name:'Superlicenza',code:'TASSA',amount:150},
  C('Monza','MZA','g6',320,5.793,'Italia'),
  C('Monaco','MON','g6',380,3.337,'Principato di Monaco'),
];
const PIT = 8;
const r5 = x => Math.max(5, Math.round(x/5)*5);
const rentTable = sq => [r5(sq.price*.07), r5(sq.price*.45), r5(sq.price*1.2), r5(sq.price*2.4), r5(sq.price*3.6)];
const LEVELS = ['Pista nuda','1 tribuna','2 tribune','3 tribune','Gran Premio'];
const COLORS = ['#ffd400','#ff5d73','#35d07f','#4da3ff','#ff9f1c','#f2f4f8'];

const CARDS = [
  {txt:'Giro più veloce in gara: bonus di €100M.', fx:async p=>gain(p,100)},
  {txt:'Vittoria sotto la pioggia: lo sponsor ti versa €150M.', fx:async p=>gain(p,150)},
  {txt:'Track limits superati tre volte: multa di €50M.', fx:async p=>pay(p,50,null,'multa track limits')},
  {txt:'Firmi con un nuovo title sponsor: incassi €200M.', fx:async p=>gain(p,200)},
  {txt:'Ala anteriore distrutta al via: riparazione da €80M.', fx:async p=>pay(p,80,null,'riparazione ala')},
  {txt:'Unsafe release ai box: Stop & Go in Pit Lane.', fx:async p=>stopGo(p,'Unsafe release: Stop & Go!')},
  {txt:'Undercut perfetto: avanza fino al Semaforo Verde.', fx:async p=>{await moveTo(p,0); await resolve(p);}},
  {txt:'Scia sul rettilineo: avanza di 4 caselle.', fx:async p=>{await moveSteps(p,4); await resolve(p);}},
  {txt:'Testacoda alla prima curva: torna indietro di 3 caselle.', fx:async p=>{await moveSteps(p,-3); await resolve(p);}},
  {txt:'Diritti TV: ogni avversario ti paga €30M.', fx:async p=>{for(const o of rivals(p)) pay(o,30,p,'diritti TV');}},
  {txt:'Festa in hospitality: paghi €25M a ogni avversario.', fx:async p=>{for(const o of rivals(p)){ if(p.out) break; pay(p,25,o,'festa in hospitality'); }}},
  {txt:'Ispezione FIA: €25M per ogni tribuna e €100M per ogni Gran Premio che possiedi.', fx:async p=>{
    let n=0; for(const i of propsOf(p)){ const l=S.own[i].level; n += l===4 ? 100 : l*25; }
    if(n>0) pay(p,n,null,'ispezione FIA'); else log(`${p.name} supera l'ispezione senza spese`);
  }},
  {txt:'Bandiera verde: tieni questa carta. Annulla uno Stop & Go.', fx:async p=>{p.flags++;}},
  {txt:'Invito a Monza: vai a Monza. Se passi dal via incassi il bonus.', fx:async p=>{await moveTo(p,30); await resolve(p);}},
  {txt:'Test privato a Suzuka: vai a Suzuka. Se passi dal via incassi il bonus.', fx:async p=>{await moveTo(p,15); await resolve(p);}},
  {txt:'Errore di strategia: cambi gomme sbagliati, paghi €60M.', fx:async p=>pay(p,60,null,'errore di strategia')},
];

// ---------- Stato ----------
let S = null;
let busy = false, cpuActive = false;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r=>setTimeout(r, reduced ? ms*.35 : ms));
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => '€' + n + 'M';
const rnd6 = () => 1 + Math.floor(Math.random()*6);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const cur = () => S.players[S.turn];
const rivals = p => S.players.filter(o=>o!==p && !o.out);
const propsOf = p => Object.keys(S.own).map(Number).filter(i=>S.own[i].owner===p.id);
const groupIdx = g => SQ.map((s,i)=>i).filter(i=>SQ[i].g===g);
const ownsGroup = (p,g) => groupIdx(g).every(i=>S.own[i] && S.own[i].owner===p.id);
const groupHasUpgrades = g => groupIdx(g).some(i=>S.own[i] && S.own[i].level>0);

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function loadSaved(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function clearSaved(){ try{ localStorage.removeItem(KEY); }catch(e){} }

function log(t){ S.log.unshift(t); S.log.length = Math.min(S.log.length, 60); }
function setMsg(text, kind='info'){ S.msg = {text, kind}; }

// ---------- Economia ----------
function gain(p,n){ p.cash += n; log(`${p.name} incassa ${fmt(n)}`); }
function upCost(i){ const o=S.own[i]; return o.level===3 ? G[SQ[i].g].up*2 : G[SQ[i].g].up; }
function levelValue(i,level){ const up=G[SQ[i].g].up; return level<=3 ? level*up : 5*up; }
function invested(i){ const o=S.own[i]; return SQ[i].price + (SQ[i].t==='c' ? levelValue(i,o.level) : 0); }
function netWorth(p){ return p.cash + propsOf(p).reduce((a,i)=>a+invested(i),0); }
function rentOf(i){
  const sq=SQ[i], o=S.own[i], owner=S.players[o.owner];
  if(sq.t==='u'){
    const n = propsOf(owner).filter(j=>SQ[j].t==='u').length;
    return (S.dice[0]+S.dice[1]) * (n===2 ? 12 : 5);
  }
  const t = rentTable(sq);
  if(o.level===0) return ownsGroup(owner,sq.g) ? t[0]*2 : t[0];
  return t[o.level];
}
function canUpgrade(p,i){
  const sq=SQ[i], o=S.own[i];
  return sq.t==='c' && o && o.owner===p.id && o.level<4 && ownsGroup(p,sq.g) && p.cash>=upCost(i);
}
function upgrade(i){
  const p=S.players[S.own[i].owner], cost=upCost(i);
  p.cash -= cost; S.own[i].level++;
  log(`${p.name} ${S.own[i].level===4 ? 'ottiene il Gran Premio a' : 'costruisce una tribuna a'} ${SQ[i].name} (${fmt(cost)})`);
}
function sellUpgrade(i){
  const o=S.own[i], p=S.players[o.owner];
  const cost = o.level===4 ? G[SQ[i].g].up*2 : G[SQ[i].g].up;
  const back = Math.floor(cost/2);
  o.level--; p.cash += back;
  log(`${p.name} smonta un potenziamento a ${SQ[i].name} (+${fmt(back)})`);
}
function canSell(i){ const sq=SQ[i]; return sq.t==='u' || !groupHasUpgrades(sq.g); }
function sellProp(i){
  const p=S.players[S.own[i].owner], back=Math.floor(SQ[i].price/2);
  delete S.own[i]; p.cash += back;
  log(`${p.name} cede ${SQ[i].name} alla FIA (+${fmt(back)})`);
}
function liquidate(p, need){
  let guard=0;
  while(p.cash < need && guard++ < 200){
    const mine = propsOf(p);
    const ups = mine.filter(i=>S.own[i].level>0).sort((a,b)=>G[SQ[a].g].up-G[SQ[b].g].up);
    if(ups.length){ sellUpgrade(ups[0]); continue; }
    const props = mine.sort((a,b)=>SQ[a].price-SQ[b].price);
    if(props.length){ sellProp(props[0]); continue; }
    break;
  }
}
function pay(p, amt, creditor, why){
  if(p.out) return;
  if(p.cash < amt){
    log(`${p.name} non ha liquidità: vendita automatica dei beni`);
    liquidate(p, amt);
  }
  if(p.cash < amt){ bankrupt(p, creditor); return; }
  p.cash -= amt; if(creditor) creditor.cash += amt;
  log(`${p.name} paga ${fmt(amt)}${creditor ? ' a '+creditor.name : ''} · ${why}`);
}
function bankrupt(p, creditor){
  if(creditor){ creditor.cash += p.cash; log(`${p.name} versa a ${creditor.name} i suoi ultimi ${fmt(p.cash)}`); }
  p.cash = 0; p.out = true; p.stopgo = false;
  for(const i of propsOf(p)) delete S.own[i];
  log(`${p.name} si ritira dal campionato`);
  setMsg(`${p.name} è in bancarotta e si ritira!`, 'warn');
  checkOver();
}
function checkOver(){
  const alive = S.players.filter(p=>!p.out);
  if(alive.length<=1 && !S.over){ endGame(); }
}
function endGame(){
  S.over = true; S.phase = 'over';
  const rank = ranking();
  setMsg(`${rank[0].name} vince il campionato!`, 'good');
  log(`Bandiera a scacchi: vince ${rank[0].name}`);
  save(); render(); showGameOver();
}
function ranking(){
  return [...S.players].sort((a,b)=> (a.out-b.out) || (netWorth(b)-netWorth(a)) || ((b.outAt||0)-(a.outAt||0)));
}

// ---------- Movimento ----------
async function moveSteps(p, n){
  const dir = Math.sign(n);
  for(let k=0;k<Math.abs(n);k++){
    p.pos = (p.pos + dir + 32) % 32;
    if(dir>0 && p.pos===0){ p.cash += LAP_BONUS; log(`${p.name} passa dal Semaforo Verde: +${fmt(LAP_BONUS)}`); }
    render(); await wait(140);
  }
}
async function moveTo(p, target){
  const n = (target - p.pos + 32) % 32;
  await moveSteps(p, n===0 ? 32 : n);
}
async function stopGo(p, reason){
  setMsg(reason, 'warn'); log(`${p.name}: ${reason}`);
  p.pos = PIT; p.stopgo = true; render(); await wait(500);
}

async function resolve(p){
  if(p.out || S.over) return;
  const sq = SQ[p.pos];
  if(sq.t==='c' || sq.t==='u'){
    const o = S.own[p.pos];
    if(!o){ S.phase='buy'; S.pending=p.pos; setMsg(`${sq.name} è libero: costa ${fmt(sq.price)}`); return; }
    if(o.owner===p.id){ setMsg(`${p.name} corre in casa a ${sq.name}`); return; }
    const owner = S.players[o.owner], r = rentOf(p.pos);
    setMsg(`${sq.name} appartiene a ${owner.name}: diritti di gara ${fmt(r)}`, 'warn');
    pay(p, r, owner, `diritti ${sq.name}`); return;
  }
  switch(sq.t){
    case 'card': await drawCard(p); return;
    case 'tax': setMsg(`${sq.name}: paghi ${fmt(sq.amount)}`, 'warn'); pay(p, sq.amount, null, sq.name); return;
    case 'drs': setMsg('Zona DRS: avanzi di 3 caselle', 'good'); render(); await wait(600); await moveSteps(p,3); return resolve(p);
    case 'cops': await stopGo(p, 'Convocato dai Commissari FIA: Stop & Go in Pit Lane'); return;
    case 'pit': setMsg(`${p.name} transita in Pit Lane`); return;
    case 'sc': setMsg('Safety Car: gara neutralizzata, nessun costo'); return;
    case 'go': setMsg('Semaforo Verde!'); return;
  }
}
async function drawCard(p){
  if(!S.deck || S.deckPos>=S.deck.length){ S.deck = shuffle([...CARDS.keys()]); S.deckPos=0; }
  const c = CARDS[S.deck[S.deckPos++]];
  setMsg('Radio Box · ' + c.txt, 'card'); log(`${p.name} · Radio Box: ${c.txt}`);
  render(); await wait(1300);
  await c.fx(p);
}

// ---------- Turni ----------
function afterPhase(){
  const p = cur();
  return (S.lastDbl && !p.out && !p.stopgo && !S.over) ? 'roll' : 'end';
}
async function roll(){
  if(busy || S.over || S.phase!=='roll') return;
  busy = true; render();
  const p = cur();
  const d1=rnd6(), d2=rnd6();
  await animateDice(d1,d2);
  S.dice=[d1,d2]; S.lastDbl = d1===d2;
  if(S.lastDbl) S.doubles++;
  log(`${p.name} lancia ${d1} + ${d2}${S.lastDbl?' · doppio':''}`);
  if(S.doubles>=3){
    await stopGo(p, 'Tre doppi di fila: eccesso di velocità in pit lane. Stop & Go!');
  } else {
    setMsg(`${p.name} avanza di ${d1+d2}`);
    await moveSteps(p, d1+d2);
    await resolve(p);
  }
  if(S.phase!=='buy' && !S.over) S.phase = afterPhase();
  busy = false; save(); render();
}
function buy(){
  if(S.phase!=='buy') return;
  const p=cur(), i=S.pending, sq=SQ[i];
  if(p.cash < sq.price) return;
  p.cash -= sq.price; S.own[i] = {owner:p.id, level:0};
  log(`${p.name} acquista ${sq.name} per ${fmt(sq.price)}`);
  setMsg(`${p.name} ora possiede ${sq.name}`, 'good');
  if(sq.g && ownsGroup(p,sq.g)) { log(`${p.name} completa il gruppo ${G[sq.g].n}`); setMsg(`${p.name} completa il gruppo ${G[sq.g].n}!`, 'good'); }
  S.pending=null; S.phase=afterPhase(); save(); render();
}
function pass(){
  if(S.phase!=='buy') return;
  log(`${cur().name} lascia ${SQ[S.pending].name}`);
  S.pending=null; S.phase=afterPhase(); save(); render();
}
function endTurn(){
  if(S.over || busy || S.phase!=='end') return;
  nextTurn();
}
function nextTurn(){
  if(S.over) return;
  const n = S.players.length; let i = S.turn, k=0;
  do { i=(i+1)%n; k++; } while(S.players[i].out && k<=n);
  if(i <= S.turn){ S.round++; if(S.limit && S.round > S.limit){ log(`Fine dei ${S.limit} giri`); endGame(); return; } }
  S.turn = i;
  startTurn();
}
async function startTurn(){
  const p = cur();
  S.doubles=0; S.lastDbl=false; S.phase='roll'; S.pending=null;
  setMsg(`Tocca a ${p.name}`);
  if(p.stopgo){
    if(p.cpu){
      if(p.flags>0){ p.flags--; p.stopgo=false; log(`${p.name} usa la Bandiera verde`); }
      else if(p.cash>=300){ p.cash-=STOPGO_FEE; p.stopgo=false; log(`${p.name} paga ${fmt(STOPGO_FEE)} e riparte dalla Pit Lane`); }
      else { p.stopgo=false; S.phase='end'; log(`${p.name} sconta lo Stop & Go e salta il turno`); setMsg(`${p.name} sconta lo Stop & Go`,'warn'); }
    } else {
      S.phase='stopgo'; save(); render(); showStopGo(); return;
    }
  }
  save(); render();
  if(p.cpu) cpuTurn();
}

// ---------- CPU ----------
function cpuWantsBuy(p,i){
  const sq=SQ[i];
  if(p.cash < sq.price) return false;
  const completes = sq.g && groupIdx(sq.g).every(j=>j===i || (S.own[j] && S.own[j].owner===p.id));
  return completes || p.cash - sq.price >= 150;
}
function cpuBuild(p){
  for(let n=0;n<20;n++){
    const opts = propsOf(p).filter(i=>canUpgrade(p,i) && p.cash-upCost(i)>=250)
      .sort((a,b)=>S.own[a].level-S.own[b].level || upCost(a)-upCost(b));
    if(!opts.length) break;
    upgrade(opts[0]);
  }
}
let cpuAnswer = null;
async function cpuSeekTrade(p){
  S.asked = S.asked || {};
  for(const g of Object.keys(G)){
    if(groupHasUpgrades(g)) continue;
    const idx = groupIdx(g), mine = idx.filter(i=>S.own[i] && S.own[i].owner===p.id);
    if(mine.length !== idx.length-1) continue;
    const j = idx.find(i=>!mine.includes(i));
    if(!S.own[j]) continue;
    const q = S.players[S.own[j].owner];
    const key = p.id+'-'+j;
    if(S.asked[key] && S.round - S.asked[key] < 4) continue;
    S.asked[key] = S.round;
    // scambio alla pari: un mio circuito che completa un gruppo di q
    const swap = tradable(p).find(i=>{ const sq=SQ[i]; return sq.g && sq.g!==g && groupIdx(sq.g).every(k=>k===i || (S.own[k] && S.own[k].owner===q.id)); });
    const offer = Math.round(SQ[j].price*2.2/10)*10;
    if(swap===undefined && p.cash - offer < 200) continue;
    T = {partner:q.id, give: swap!==undefined ? [swap] : [], get:[j], cashGive: swap!==undefined ? 0 : offer, cashGet:0};
    let ok;
    if(q.cpu) ok = true;
    else {
      const list = arr => arr.map(i=>esc(SQ[i].name)).join(', ') || 'nessun circuito';
      render();
      ok = await new Promise(res=>{ cpuAnswer=res; openSheet(`<h2>Offerta per ${esc(q.name)}</h2>
        <p>${esc(p.name)} vuole ${esc(SQ[j].name)} per completare il gruppo ${G[g].n}.</p>
        <dl class="kv"><dt>Ricevi</dt><dd>${list(T.give)}${T.cashGive?' + '+fmt(T.cashGive):''}</dd><dt>Cedi</dt><dd>${list(T.get)}</dd></dl>
        <div class="row"><button class="btn primary" data-act="caccept">Accetta</button><button class="btn" data-act="creject">Rifiuta</button></div>`, false); });
      closeSheet();
    }
    if(ok){ doTrade(); await wait(700); return; }
    log(`${q.name} rifiuta l'offerta di ${p.name}`); T=null; render();
  }
}
async function cpuTurn(){
  if(cpuActive) return; cpuActive=true;
  let doEnd=false; const p=cur();
  try{
    await wait(700);
    for(let g=0; g<12 && !S.over && cur()===p; g++){
      if(S.phase==='roll'){ if(S.doubles===0) await cpuSeekTrade(p); cpuBuild(p); render(); await roll(); await wait(500); }
      else if(S.phase==='buy'){ if(cpuWantsBuy(p,S.pending)) buy(); else pass(); await wait(600); }
      else if(S.phase==='end'){ cpuBuild(p); save(); render(); await wait(500); doEnd=true; break; }
      else break;
    }
  } finally { cpuActive=false; }
  if(doEnd && cur()===p) endTurn();
}

// ---------- Dadi ----------
const PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function dieHTML(n){ return Array.from({length:9},(_,k)=>`<i class="${PIPS[n].includes(k)?'on':''}"></i>`).join(''); }
async function animateDice(a,b){
  const d1=$('#d1'), d2=$('#d2');
  if(!d1) return;
  d1.classList.add('rolling'); d2.classList.add('rolling');
  for(let k=0;k<8;k++){ d1.innerHTML=dieHTML(rnd6()); d2.innerHTML=dieHTML(rnd6()); await wait(60); }
  d1.classList.remove('rolling'); d2.classList.remove('rolling');
  d1.innerHTML=dieHTML(a); d2.innerHTML=dieHTML(b);
}

// ---------- Render ----------
function coord(i){
  if(i<=8) return [9, 9-i];
  if(i<=16) return [9-(i-8), 1];
  if(i<=24) return [1, 1+(i-16)];
  return [1+(i-24), 9];
}
function side(i){ if(i%8===0) return 'k'; if(i<8) return 'b'; if(i<16) return 'l'; if(i<24) return 't'; return 'r'; }
function buildBoard(){
  const b=$('#board'); let h='';
  SQ.forEach((sq,i)=>{
    const [r,c]=coord(i);
    h += `<button class="cell side-${side(i)}" id="c${i}" data-act="info" data-i="${i}" style="grid-area:${r}/${c}" aria-label="${esc(sq.name)}"></button>`;
  });
  h += `<div class="center"><div class="brand">Paddock <b>Tycoon</b></div><div class="dice"><div class="die" id="d1">${dieHTML(5)}</div><div class="die" id="d2">${dieHTML(2)}</div></div><div class="now" id="now"></div><div class="msg" id="msg"></div></div>`;
  b.innerHTML=h;
}
function cellHTML(i){
  const sq=SQ[i], o=S && S.own[i];
  const tks = S ? S.players.filter(p=>!p.out && p.pos===i).map(p=>`<span class="tk ${S.players[S.turn]===p?'me':''}" style="--pc:${p.color}"></span>`).join('') : '';
  let inner='';
  if(sq.t==='c'){
    inner = `<span class="strip"></span><span>${sq.code}</span>`;
    if(o){ inner += o.level===4 ? `<span class="lv"><b>GP</b></span>` : `<span class="lv">${'<i></i>'.repeat(o.level)}</span>`; }
    else inner += `<span class="pr">${sq.price}</span>`;
  } else if(sq.t==='u'){
    inner = `<span>${sq.code}</span>${o?'':`<span class="pr">${sq.price}</span>`}`;
  } else if(sq.t==='go'){ inner=`<span class="lbl">VIA</span>`; }
  else if(['pit','sc','cops'].includes(sq.t)){ inner=`<span class="lbl">${sq.code}</span>`; }
  else inner = `<span>${sq.code}</span>`;
  return inner + `<span class="tks">${tks}</span>`;
}
function render(){
  if(!$('#c0')) buildBoard();
  SQ.forEach((sq,i)=>{
    const el=$('#c'+i), o=S && S.own[i];
    el.innerHTML = cellHTML(i);
    el.className = `cell side-${side(i)} ${sq.t} ${['c','u','go'].includes(sq.t)?'':'special'} ${i%8===0?'k':''} ${o?'owned':''} ${S && S.pending===i?'hl':''}`;
    el.style.setProperty('--g', sq.g ? G[sq.g].c : 'transparent');
    if(o) el.style.setProperty('--oc', S.players[o.owner].color);
  });
  const now=$('#now'), msg=$('#msg');
  if(!S){
    now.innerHTML = '<small>Prepara la griglia di partenza</small>';
    msg.textContent = ''; msg.className='msg';
    $('#tower').innerHTML=''; $('#actions').innerHTML=`<div class="row"><button class="btn primary" data-act="setup">Nuova partita</button></div>`; $('#log').innerHTML='';
    return;
  }
  const p=cur();
  now.innerHTML = S.over ? `<small>Bandiera a scacchi</small>` : `<span class="tk" style="--pc:${p.color}"></span>${esc(p.name)} <small>· Giro ${S.round}${S.limit?'/'+S.limit:''}</small>`;
  msg.textContent = S.msg ? S.msg.text : ''; msg.className = 'msg ' + (S.msg ? S.msg.kind : '');
  if(!busy){ $('#d1').innerHTML=dieHTML(S.dice[0]); $('#d2').innerHTML=dieHTML(S.dice[1]); }
  // tower
  const order = [...S.players].sort((a,b)=>(a.out-b.out) || netWorth(b)-netWorth(a));
  $('#tower').innerHTML = order.map(q=>`<div class="chip ${q===p && !S.over?'now':''} ${q.out?'out':''}" style="--pc:${q.color}">
    <span class="nm">${esc(q.name)}${q.cpu?'<span class="tag cpu">CPU</span>':''}${q.stopgo?'<span class="tag">S&amp;G</span>':''}${q.out?'<span class="tag">RIT</span>':''}</span>
    <span class="cash">${fmt(q.cash)}</span>
    <span class="meta">${propsOf(q).length} circuiti · patrimonio ${fmt(netWorth(q))}${q.flags?' · bandiera verde ×'+q.flags:''}</span></div>`).join('');
  renderActions();
  $('#log').innerHTML = S.log.slice(0,25).map(t=>`<li>${esc(t)}</li>`).join('');
}
function renderActions(){
  const a=$('#actions'), p=cur();
  if(S.over){ a.innerHTML=`<div class="row"><button class="btn primary" data-act="setup">Nuova partita</button><button class="btn" data-act="results">Classifica finale</button></div>`; return; }
  if(p.cpu){ a.innerHTML=`<div class="waitline"><span class="tk" style="--pc:${p.color}"></span>${esc(p.name)} è in pista…</div>`; return; }
  let main='';
  if(S.phase==='roll') main = `<button class="btn primary" data-act="roll" ${busy?'disabled':''}>${busy?'In pista…':(S.doubles>0?'Doppio! Rilancia':'Lancia i dadi')}</button>`;
  else if(S.phase==='buy'){
    const sq=SQ[S.pending];
    main = `<button class="btn primary" data-act="buy" ${p.cash>=sq.price?'':'disabled'}>Compra ${esc(sq.name)} · ${fmt(sq.price)}</button><button class="btn" data-act="pass">Lascia</button>`;
  }
  else if(S.phase==='end') main = `<button class="btn primary" data-act="end">Fine turno</button>`;
  else if(S.phase==='stopgo') main = `<button class="btn primary" data-act="stopgo">Stop &amp; Go: decidi</button>`;
  const canManage = !busy && ['roll','end','buy'].includes(S.phase);
  a.innerHTML = `<div class="row">${main}</div>
    <div class="row"><button class="btn ghost" data-act="manage" ${canManage?'':'disabled'}>I miei circuiti</button><button class="btn ghost" data-act="trade" ${canManage && S.phase!=='buy'?'':'disabled'}>Proponi scambio</button></div>`;
}

// ---------- Sheet ----------
let sheetDismiss = true;
function openSheet(html, dismiss=true){ $('#sheet').innerHTML=html; $('#backdrop').hidden=false; sheetDismiss=dismiss; const f=$('#sheet').querySelector('button,input'); if(f) f.focus({preventScroll:true}); }
function closeSheet(){ $('#backdrop').hidden=true; $('#sheet').innerHTML=''; }
$('#backdrop').addEventListener('click', e=>{ if(e.target.id==='backdrop' && sheetDismiss) closeSheet(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#backdrop').hidden && sheetDismiss) closeSheet(); });

function showInfo(i){
  const sq=SQ[i], o=S && S.own[i];
  let body='';
  if(sq.t==='c'){
    const t=rentTable(sq), g=G[sq.g];
    const curLvl = o ? o.level : -1;
    body = `<div class="band" style="--g:${g.c}"></div>
      <h2>${esc(sq.name)}</h2>
      <p>${esc(sq.country)} · ${sq.km.toFixed(3).replace('.',',')} km al giro · gruppo ${g.n}</p>
      <dl class="kv">
        <dt>Prezzo</dt><dd>${fmt(sq.price)}</dd>
        <dt class="${curLvl===0?'cur':''}">Diritti, pista nuda</dt><dd class="${curLvl===0?'cur':''}">${fmt(t[0])}</dd>
        <dt>Con tutto il gruppo</dt><dd>${fmt(t[0]*2)}</dd>
        ${[1,2,3,4].map(l=>`<dt class="${curLvl===l?'cur':''}">${LEVELS[l]}</dt><dd class="${curLvl===l?'cur':''}">${fmt(t[l])}</dd>`).join('')}
        <dt>Costo tribuna</dt><dd>${fmt(g.up)}</dd>
        <dt>Costo Gran Premio</dt><dd>${fmt(g.up*2)}</dd>
      </dl>`;
  } else if(sq.t==='u'){
    body = `<h2>${esc(sq.name)}</h2><p>Chi si ferma paga la somma dei dadi × 5, oppure × 12 se il proprietario ha entrambi i fornitori.</p><dl class="kv"><dt>Prezzo</dt><dd>${fmt(sq.price)}</dd></dl>`;
  } else {
    const d = {go:`Ogni volta che passi o ti fermi qui incassi ${fmt(LAP_BONUS)}.`, card:'Pesca un messaggio dal muretto box: può portare premi, multe o spostamenti.', tax:`Paghi ${fmt(sq.amount||0)} alla FIA.`, drs:'Ala mobile aperta: avanzi subito di 3 caselle.', pit:'Area di transito. Chi riceve uno Stop & Go viene portato qui.', sc:'Gara neutralizzata: sosta libera, nessun costo.', cops:'Penalità: vai in Pit Lane con uno Stop & Go. Non incassi il bonus del via.'}[sq.t];
    body = `<h2>${esc(sq.name)}</h2><p>${d}</p>`;
  }
  if(o) body += `<p>Proprietario: <b style="color:${S.players[o.owner].color}">${esc(S.players[o.owner].name)}</b>${sq.t==='c'?' · '+LEVELS[o.level]:''}</p>`;
  openSheet(body + `<div class="row"><button class="btn" data-act="close">Chiudi</button></div>`);
}

function showManage(){
  const p=cur(), mine=propsOf(p).sort((a,b)=>a-b);
  const items = mine.map(i=>{
    const sq=SQ[i], o=S.own[i];
    let acts='';
    if(sq.t==='c'){
      const full=ownsGroup(p,sq.g);
      if(o.level<4) acts += `<button class="btn sm primary" data-act="up" data-i="${i}" ${canUpgrade(p,i)?'':'disabled'}>${o.level===3?'+ GP':'+ Tribuna'} ${fmt(upCost(i))}</button>`;
      if(o.level>0) acts += `<button class="btn sm" data-act="down" data-i="${i}">− Smonta</button>`;
      if(!full && o.level===0) acts += '';
    }
    if(o.level===0 || sq.t==='u') acts += `<button class="btn sm" data-act="sell" data-i="${i}" ${canSell(i)?'':'disabled'}>Cedi +${fmt(Math.floor(sq.price/2))}</button>`;
    const sub = sq.t==='c' ? `${LEVELS[o.level]} · diritti ${fmt(rentOf(i))}${ownsGroup(p,sq.g)?'':' · gruppo incompleto'}` : 'Fornitore';
    return `<div class="item"><span class="sw" style="--g:${sq.g?G[sq.g].c:'var(--muted)'}"></span><div class="t"><b>${esc(sq.name)}</b><small>${sub}</small></div><div class="acts">${acts}</div></div>`;
  }).join('');
  openSheet(`<h2>I circuiti di ${esc(p.name)}</h2>
    <p>Liquidità ${fmt(p.cash)} · patrimonio ${fmt(netWorth(p))}. Le tribune si costruiscono solo con il gruppo completo; dopo 3 tribune puoi ospitare il Gran Premio.</p>
    <div class="list">${items || '<p>Non possiedi ancora nessun circuito.</p>'}</div>
    <div class="row"><button class="btn" data-act="close">Chiudi</button></div>`);
}

function showStopGo(){
  const p=cur();
  openSheet(`<h2>Stop &amp; Go</h2><p>${esc(p.name)} è fermo in Pit Lane. Scegli come scontare la penalità.</p>
    <div class="list">
      ${p.flags>0?`<button class="btn primary" data-act="sg-flag">Usa Bandiera verde (${p.flags})</button>`:''}
      <button class="btn ${p.flags>0?'':'primary'}" data-act="sg-pay" ${p.cash>=STOPGO_FEE?'':'disabled'}>Paga ${fmt(STOPGO_FEE)} e lancia</button>
      <button class="btn" data-act="sg-skip">Salta il turno</button>
    </div>`, false);
}

function showCardRules(){
  openSheet(`<h2>Regolamento</h2><div class="rules">
    <p>Da 2 a 6 giocatori, umani o CPU, sullo stesso telefono. Ognuno parte con ${fmt(START_CASH)}.</p>
    <h4>Il giro</h4><p>Lancia due dadi e avanza in senso antiorario. Ogni passaggio dal Semaforo Verde vale ${fmt(LAP_BONUS)}. Con un doppio rilanci; al terzo doppio di fila prendi uno Stop &amp; Go.</p>
    <h4>Circuiti</h4><p>Se ti fermi su un circuito libero puoi comprarlo. Chi si ferma su un circuito altrui paga i diritti di gara. Se hai tutti i circuiti di un gruppo colore i diritti raddoppiano.</p>
    <h4>Tribune e Gran Premio</h4><p>Con il gruppo completo puoi costruire fino a 3 tribune per circuito, poi ospitare il Gran Premio (costa il doppio di una tribuna). Smontare restituisce metà della spesa.</p>
    <h4>Fornitori</h4><p>Gomme e Carburante: chi si ferma paga la somma dei dadi × 5, oppure × 12 se il proprietario li ha entrambi.</p>
    <h4>Caselle speciali</h4><p>Radio Box: pesca un messaggio del muretto. Zona DRS: avanzi di 3. Safety Car: sosta libera. Commissari FIA: Stop &amp; Go in Pit Lane.</p>
    <h4>Stop &amp; Go</h4><p>Al turno dopo scegli: paga ${fmt(STOPGO_FEE)} e lancia, usa una carta Bandiera verde, oppure salta il turno.</p>
    <h4>Debiti</h4><p>Se non puoi pagare, i tuoi beni vengono ceduti alla FIA a metà prezzo (prima le tribune). Se non basta ti ritiri e il creditore prende i tuoi ultimi contanti.</p>
    <h4>Scambi</h4><p>Nel tuo turno puoi proporre scambi di circuiti e denaro a un avversario. Si scambiano solo circuiti di gruppi senza tribune.</p>
    <h4>Fine partita</h4><p>Vince l'ultimo rimasto in gara oppure, se hai scelto un limite di giri, chi ha il patrimonio più alto alla bandiera a scacchi.</p>
  </div><div class="row"><button class="btn" data-act="close">Chiudi</button></div>`);
}

// ---------- Setup ----------
let setup = { players:[{name:'Tu',cpu:false,color:COLORS[0]},{name:'CPU Alfa',cpu:true,color:COLORS[1]},{name:'CPU Bravo',cpu:true,color:COLORS[2]}], limit:0 };
function showSetup(){
  const saved = loadSaved();
  const rows = setup.players.map((p,i)=>`<div class="prow">
    <button class="swatch" style="--pc:${p.color}" data-act="col" data-i="${i}" aria-label="Cambia colore"></button>
    <input type="text" id="pname-${i}" value="${esc(p.name)}" maxlength="14" data-i="${i}" aria-label="Nome giocatore ${i+1}">
    <div class="seg"><button class="${p.cpu?'':'on'}" data-act="human" data-i="${i}">Umano</button><button class="${p.cpu?'on':''}" data-act="cpu" data-i="${i}">CPU</button></div>
    <button class="btn sm ghost" data-act="rm" data-i="${i}" ${setup.players.length<=2?'disabled':''} aria-label="Rimuovi">✕</button>
  </div>`).join('');
  openSheet(`<h2>Griglia di partenza</h2>
    <p>Aggiungi da 2 a 6 piloti. I giocatori umani si passano il telefono a ogni turno.</p>
    <div class="list">${rows}</div>
    <div class="row"><button class="btn ghost" data-act="add" ${setup.players.length>=6?'disabled':''}>+ Aggiungi pilota</button></div>
    <label class="fld" for="limit">Durata
      <select id="limit">
        <option value="0" ${setup.limit==0?'selected':''}>Fino all'ultimo in gara</option>
        <option value="15" ${setup.limit==15?'selected':''}>15 giri (circa 30 minuti)</option>
        <option value="25" ${setup.limit==25?'selected':''}>25 giri (circa 50 minuti)</option>
      </select></label>
    <div class="row"><button class="btn primary" data-act="start">Semaforo verde</button>
    ${saved && !saved.over && S ? '<button class="btn" data-act="close">Torna alla partita</button>':''}</div>`, !!S);
}
function startGame(){
  setup.players.forEach((p,i)=>{ const v=$('#pname-'+i); if(v) p.name = v.value.trim() || `Pilota ${i+1}`; });
  setup.limit = +$('#limit').value;
  S = {
    players: setup.players.map((p,i)=>({id:i,name:p.name,color:p.color,cpu:p.cpu,cash:START_CASH,pos:0,out:false,stopgo:false,flags:0})),
    own:{}, turn:0, phase:'roll', doubles:0, lastDbl:false, dice:[5,2], round:1, limit:setup.limit,
    deck:shuffle([...CARDS.keys()]), deckPos:0, log:[], msg:null, over:false, pending:null,
  };
  log('Semaforo verde: si parte!');
  closeSheet(); startTurn();
}
function showGameOver(){
  const rank = ranking();
  openSheet(`<h2>Bandiera a scacchi</h2><p>${esc(rank[0].name)} vince il campionato.</p>
    <div class="rank">${rank.map((p,k)=>`<div><span class="pos">${k+1}</span><span><span class="tk" style="--pc:${p.color};display:inline-block;margin-right:6px"></span>${esc(p.name)}${p.out?' · ritirato':''}</span><b>${fmt(netWorth(p))}</b></div>`).join('')}</div>
    <div class="row"><button class="btn primary" data-act="setup">Nuova partita</button><button class="btn" data-act="close">Guarda il tabellone</button></div>`);
}

// ---------- Scambi ----------
let T = null;
function tradable(p){ return propsOf(p).filter(i=>canSell(i) && S.own[i].level===0); }
function showTrade(){
  const p=cur(), others=rivals(p);
  if(!T || !others.includes(S.players[T.partner])) T = {partner:others[0].id, give:[], get:[], cashGive:0, cashGet:0};
  const q=S.players[T.partner];
  const pick = (i,side)=>{ const sq=SQ[i]; const on=T[side].includes(i); return `<button class="pick ${on?'on':''}" data-act="tpick" data-side="${side}" data-i="${i}"><span class="sw" style="--g:${sq.g?G[sq.g].c:'var(--muted)'}"></span>${esc(sq.name)}</button>`; };
  openSheet(`<h2>Proponi uno scambio</h2>
    <div class="seg" style="flex-wrap:wrap">${others.map(o=>`<button class="${o.id===T.partner?'on':''}" data-act="tpartner" data-i="${o.id}">${esc(o.name)}</button>`).join('')}</div>
    <div class="tradecols">
      <div><h3>Tu dai</h3>${tradable(p).map(i=>pick(i,'give')).join('') || '<p class="muted">Nessun circuito cedibile</p>'}
        <label class="fld" for="cg">Denaro (hai ${fmt(p.cash)})<input class="num" id="cg" type="number" min="0" max="${p.cash}" step="10" value="${T.cashGive}"></label></div>
      <div><h3>Tu ricevi da ${esc(q.name)}</h3>${tradable(q).map(i=>pick(i,'get')).join('') || '<p class="muted">Nessun circuito cedibile</p>'}
        <label class="fld" for="ct">Denaro (ha ${fmt(q.cash)})<input class="num" id="ct" type="number" min="0" max="${q.cash}" step="10" value="${T.cashGet}"></label></div>
    </div>
    <p id="tmsg"></p>
    <div class="row"><button class="btn primary" data-act="tpropose">Proponi</button><button class="btn" data-act="close">Annulla</button></div>`);
}
function readTradeCash(){ const a=$('#cg'), b=$('#ct'); if(a) T.cashGive=Math.max(0,Math.floor(+a.value||0)); if(b) T.cashGet=Math.max(0,Math.floor(+b.value||0)); }
function cpuAcceptsTrade(cpu, human){
  const val = (list, receiver) => list.reduce((s,i)=>{
    const sq=SQ[i]; let v=sq.price;
    if(sq.g && groupIdx(sq.g).every(j=>list.includes(j) || (S.own[j] && S.own[j].owner===receiver.id))) v += sq.price*1.5;
    return s+v; },0);
  const gain = val(T.give, cpu) + T.cashGive;
  const loss = T.get.reduce((s,i)=>s+SQ[i].price,0) + val(T.get, human) * .5 + T.cashGet;
  return gain >= loss*1.15 && gain>0;
}
function proposeTrade(){
  readTradeCash();
  const p=cur(), q=S.players[T.partner];
  const m=$('#tmsg');
  if(!T.give.length && !T.get.length && !T.cashGive && !T.cashGet){ m.textContent='Scegli almeno un circuito o una somma.'; return; }
  if(T.cashGive>p.cash){ m.textContent=`Hai solo ${fmt(p.cash)} in cassa.`; return; }
  if(T.cashGet>q.cash){ m.textContent=`${q.name} ha solo ${fmt(q.cash)} in cassa.`; return; }
  if(q.cpu){
    if(cpuAcceptsTrade(q,p)){ doTrade(); openSheet(`<h2>Affare fatto</h2><p>${esc(q.name)} accetta lo scambio.</p><div class="row"><button class="btn primary" data-act="close">OK</button></div>`); }
    else { m.textContent = `${q.name} rifiuta: l'offerta non gli conviene abbastanza.`; m.className='msg warn'; }
    return;
  }
  const list = (arr)=> arr.map(i=>esc(SQ[i].name)).join(', ') || 'nessun circuito';
  openSheet(`<h2>Passa il telefono a ${esc(q.name)}</h2>
    <p>${esc(p.name)} propone:</p>
    <dl class="kv"><dt>${esc(q.name)} riceve</dt><dd>${list(T.give)}${T.cashGive?' + '+fmt(T.cashGive):''}</dd>
    <dt>${esc(q.name)} cede</dt><dd>${list(T.get)}${T.cashGet?' + '+fmt(T.cashGet):''}</dd></dl>
    <div class="row"><button class="btn primary" data-act="taccept">Accetta</button><button class="btn" data-act="treject">Rifiuta</button></div>`, false);
}
function doTrade(){
  const p=cur(), q=S.players[T.partner];
  T.give.forEach(i=>S.own[i].owner=q.id); T.get.forEach(i=>S.own[i].owner=p.id);
  p.cash += T.cashGet - T.cashGive; q.cash += T.cashGive - T.cashGet;
  log(`Scambio tra ${p.name} e ${q.name} concluso`);
  setMsg(`Scambio concluso con ${q.name}`, 'good');
  T=null; save(); render();
}

// ---------- Eventi ----------
async function goFullscreen(){
  try{ if(!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen({navigationUI:'hide'}); }catch(e){}
  try{ if(screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); }catch(e){}
}
const ACT = {
  fullscreen: ()=>goFullscreen(),
  roll: ()=>roll(), buy: ()=>buy(), pass: ()=>pass(), end: ()=>endTurn(),
  info: b=>showInfo(+b.dataset.i), close: ()=>closeSheet(),
  rules: ()=>showCardRules(), setup: ()=>showSetup(), start: ()=>startGame(), results: ()=>showGameOver(),
  manage: ()=>showManage(),
  up: b=>{ const i=+b.dataset.i; if(canUpgrade(cur(),i)){ upgrade(i); save(); render(); showManage(); } },
  down: b=>{ sellUpgrade(+b.dataset.i); save(); render(); showManage(); },
  sell: b=>{ const i=+b.dataset.i; if(canSell(i)){ sellProp(i); save(); render(); showManage(); } },
  stopgo: ()=>showStopGo(),
  'sg-flag': ()=>{ const p=cur(); p.flags--; p.stopgo=false; S.phase='roll'; log(`${p.name} usa la Bandiera verde`); closeSheet(); save(); render(); },
  'sg-pay': ()=>{ const p=cur(); if(p.cash<STOPGO_FEE) return; p.cash-=STOPGO_FEE; p.stopgo=false; S.phase='roll'; log(`${p.name} paga ${fmt(STOPGO_FEE)} e riparte`); closeSheet(); save(); render(); },
  'sg-skip': ()=>{ const p=cur(); p.stopgo=false; S.phase='end'; log(`${p.name} sconta lo Stop & Go e salta il turno`); closeSheet(); save(); render(); setTimeout(endTurn, 400); },
  add: ()=>{ syncNames(); const used=setup.players.map(p=>p.color); setup.players.push({name:`CPU ${['Alfa','Bravo','Charlie','Delta','Echo','Fox'][setup.players.length]}`,cpu:true,color:COLORS.find(c=>!used.includes(c))}); showSetup(); },
  rm: b=>{ syncNames(); setup.players.splice(+b.dataset.i,1); showSetup(); },
  human: b=>{ syncNames(); setup.players[+b.dataset.i].cpu=false; showSetup(); },
  cpu: b=>{ syncNames(); setup.players[+b.dataset.i].cpu=true; showSetup(); },
  col: b=>{ syncNames(); const p=setup.players[+b.dataset.i]; const used=setup.players.map(x=>x.color); let k=COLORS.indexOf(p.color); for(let n=0;n<6;n++){ k=(k+1)%6; if(!used.includes(COLORS[k])) break; } p.color=COLORS[k]; showSetup(); },
  trade: ()=>{ T=null; showTrade(); },
  tpartner: b=>{ readTradeCash(); T={partner:+b.dataset.i,give:T.give,get:[],cashGive:T.cashGive,cashGet:0}; showTrade(); },
  tpick: b=>{ readTradeCash(); const arr=T[b.dataset.side], i=+b.dataset.i; const k=arr.indexOf(i); if(k>=0) arr.splice(k,1); else arr.push(i); showTrade(); },
  tpropose: ()=>proposeTrade(),
  caccept: ()=>{ if(cpuAnswer){ const r=cpuAnswer; cpuAnswer=null; r(true); } },
  creject: ()=>{ if(cpuAnswer){ const r=cpuAnswer; cpuAnswer=null; r(false); } },
  taccept: ()=>{ doTrade(); closeSheet(); },
  treject: ()=>{ log(`${S.players[T.partner].name} rifiuta lo scambio`); setMsg('Scambio rifiutato','warn'); T=null; closeSheet(); save(); render(); },
};
function syncNames(){ setup.players.forEach((p,i)=>{ const v=$('#pname-'+i); if(v) p.name=v.value; }); const l=$('#limit'); if(l) setup.limit=+l.value; }
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const f=ACT[b.dataset.act];
  if(!f) return;
  if(!S && !['fullscreen','setup','start','rules','close','add','rm','human','cpu','col','info'].includes(b.dataset.act)) return;
  f(b);
});

// ---------- Avvio ----------
function boot(){
  buildBoard();
  const saved = loadSaved();
  if(saved && saved.players && !saved.over){
    S = saved; busy=false;
    setup.players = S.players.map(p=>({name:p.name,cpu:p.cpu,color:p.color})); setup.limit=S.limit||0;
    render();
    if(S.phase==='stopgo' && !cur().cpu) showStopGo();
    else if(cur().cpu){ if(S.phase==='buy'||S.phase==='roll'||S.phase==='end') cpuTurn(); }
  } else {
    render(); showSetup();
  }
}
window.claude?.hot?.snapshot?.(()=>({}));
boot();
</script>
</body>
</html>
