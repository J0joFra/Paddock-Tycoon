<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gioco da tavolo di compravendita a tema corse: compra circuiti, costruisci tribune, tratta sotto banco e vinci il campionato.">
<meta name="theme-color" content="#e10a1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Paddock">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
</style>
<title>Paddock Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,700&display=swap">
<style>
/* Layout: telefono in orizzontale. Tabellone a sinistra alto quanto lo schermo, plancia di gioco a destra. Tema chiaro bianco e rosso, unico di proposito. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f5; --line:#dde2ea; --ink:#15171c; --muted:#6b7280;
  --red:#e10a1e; --red-deep:#b3000f; --on-red:#ffffff; --gold:#f5b400; --green:#15a34a; --violet:#7c3aed;
  --f-display:'Titillium Web',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Titillium Web',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.35;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 20px;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
.app{max-width:1080px;margin:0 auto;display:grid;gap:12px}
@media(min-width:900px) and (min-height:621px){.app{grid-template-columns:minmax(0,600px) minmax(0,1fr);align-items:start}}
.side{display:grid;gap:10px;align-content:start;min-width:0}

/* Barra */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-family:var(--f-display);font-weight:900;font-style:italic;font-size:22px;letter-spacing:-.01em;line-height:1;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo b{color:var(--red);font-weight:900}
.mark{width:24px;height:24px;border-radius:7px;background:var(--red);position:relative;flex:none;box-shadow:0 3px 8px rgba(225,10,30,.3)}
.mark::after{content:"";position:absolute;inset:6px;background:repeating-conic-gradient(#fff 0 25%,var(--red) 0 50%) 0 0/6px 6px;border-radius:2px}
.icons{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-weight:900;font-size:18px}
.ib svg{width:20px;height:20px}
.ib:focus-visible,.btn:focus-visible,.chip:focus-visible,.cell:focus-visible{outline:2px solid var(--red);outline-offset:2px}
#fsbtn{display:none}
@media (pointer:coarse){#fsbtn{display:grid}}

/* Piloti */
.tower{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.chip{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:7px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:5px 8px;text-align:left;cursor:pointer;min-width:0}
.chip .tk{grid-row:span 2;width:14px}
.chip .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center;min-width:0}
.chip .cash{font-weight:900;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.05}
.chip.turn{border-color:var(--red);box-shadow:0 0 0 2px rgba(225,10,30,.15)}
.chip.out{opacity:.35}
.b{font-size:9px;font-weight:700;letter-spacing:.06em;padding:0 4px;border-radius:3px;background:var(--surface-2);color:var(--muted);flex:none;line-height:1.6}
.b.red{background:var(--red);color:var(--on-red)}
.b.gold{background:var(--gold);color:var(--ink)}

/* Tabellone */
.board{display:grid;grid-template-columns:1.3fr repeat(7,1fr) 1.3fr;grid-template-rows:1.3fr repeat(7,1fr) 1.3fr;gap:2px;background:var(--line);border:2px solid var(--line);border-radius:14px;overflow:hidden;width:100%;max-width:600px;aspect-ratio:1;margin-inline:auto;box-shadow:0 8px 30px rgba(21,23,28,.08)}
.cell{background:var(--surface);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;min-height:0;padding:2px;cursor:pointer;font-weight:900;font-size:clamp(8px,2.3vw,12px);text-align:center;line-height:1;border:0;color:var(--ink)}
.cell .strip{position:absolute;background:var(--g)}
.side-b .strip{top:0;left:0;right:0;height:20%}
.side-t .strip{bottom:0;left:0;right:0;height:20%}
.side-l .strip{right:0;top:0;bottom:0;width:20%}
.side-r .strip{left:0;top:0;bottom:0;width:20%}
.cell .pr{font-weight:600;font-size:.78em;color:var(--muted);font-variant-numeric:tabular-nums}
.cell.owned{box-shadow:inset 0 0 0 2.5px var(--oc)}
.cell.mort{background:repeating-linear-gradient(135deg,var(--surface) 0 4px,var(--surface-2) 4px 8px);color:var(--muted)}
.cell .lv{display:flex;gap:1px;height:.6em}
.cell .lv i{width:.45em;background:var(--red);border-radius:1px}
.cell .lv b{font-size:.8em;background:var(--ink);color:var(--surface);padding:0 2px;border-radius:2px;line-height:1.2}
.cell .roy{position:absolute;top:1px;right:2px;font-size:.75em;color:var(--violet)}
.cell .tks{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;position:absolute;bottom:3px;left:2px;right:2px}
.tk{display:inline-block;width:clamp(7px,2vw,11px);aspect-ratio:1;border-radius:50%;background:var(--pc);box-shadow:0 0 0 1.5px var(--surface)}
.tk.me{box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px var(--ink)}
.cell.special{color:var(--muted)}
.cell.k{font-size:clamp(9px,2.6vw,14px);color:var(--ink)}
.cell.go{background:repeating-conic-gradient(var(--ink) 0 25%,var(--surface) 0 50%) 0 0/10px 10px}
.cell .lbl{padding:2px 4px;border-radius:4px;background:var(--surface)}
.cell.cops .lbl{background:var(--red);color:var(--on-red)}
.cell.sc .lbl{background:var(--gold)}
.cell.pit .lbl{border:1.5px solid var(--ink)}
.cell.hl{background:#fff3c4}
.center{grid-area:2/2/9/9;background:radial-gradient(circle at 50% 45%,rgba(225,10,30,.13),transparent 62%),var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.5vw,10px);padding:8px;text-align:center;min-width:0}
.center .brand{font-weight:900;font-style:italic;font-size:clamp(15px,4.4vw,28px);line-height:1}
.center .brand b{color:var(--red)}
.dice{display:flex;gap:10px}
.die{width:clamp(28px,8.5vw,48px);aspect-ratio:1;background:var(--red);border-radius:24%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%;box-shadow:0 4px 0 var(--red-deep),0 6px 14px rgba(225,10,30,.25)}
.die i{border-radius:50%;margin:10%}
.die i.on{background:var(--on-red)}
.die.rolling{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}100%{transform:rotate(-9deg)}}
.now{font-weight:700;font-size:clamp(11px,3vw,15px);display:flex;align-items:center;gap:6px}
.now small{color:var(--muted);font-weight:600}
.msg{font-weight:700;font-size:clamp(11px,2.9vw,15px);max-width:26ch;min-height:2.6em;text-wrap:balance;display:flex;align-items:center;justify-content:center}
.msg.card{background:var(--ink);color:var(--surface);border-radius:10px;padding:6px 10px;font-weight:600;animation:pop .25s ease-out}
.msg.warn{color:var(--red)}
.msg.good{color:var(--green)}
@keyframes pop{from{transform:scale(.85);opacity:0}}

/* Plancia azioni */
.act{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 0}
.btn{font-family:var(--f-display);font-weight:900;font-size:16px;text-transform:uppercase;letter-spacing:.03em;padding:8px 14px;min-height:48px;border-radius:12px;background:var(--surface-2);border:1.5px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--red);color:var(--on-red);box-shadow:0 4px 0 var(--red-deep)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--red-deep)}
.btn.out{background:var(--surface);border-color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--surface)}
.btn.sm{font-size:12px;min-height:34px;padding:4px 10px;border-radius:9px}
.btn.xs{font-size:11px;min-height:28px;padding:2px 8px;border-radius:7px}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn small{font-weight:600;opacity:.85;text-transform:none}
.deal{display:grid;grid-template-columns:8px auto minmax(0,1fr) auto;gap:10px;align-items:center}
.deal .thumb{width:clamp(48px,14vmin,80px);display:flex}
.deal .thumb:empty{display:none}
.trk{display:block;overflow:visible}
.trk.mini{width:100%;height:auto;max-height:clamp(34px,11vmin,60px)}
.trk.big{width:100%;height:auto;max-height:min(46vh,240px)}
.trk .draw{stroke-dasharray:1;animation:draw 1.2s ease-out}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.trkcard{position:relative;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--g) 18%,transparent),transparent 70%),var(--surface-2);border-radius:14px;padding:14px 18px 22px;display:flex;justify-content:center}
.trkkm,.trkcc{position:absolute;bottom:6px;font-size:12px;font-weight:700;color:var(--muted)}
.trkkm{left:10px}
.trkkm b{color:var(--ink);font-size:14px}
.trkcc{right:10px}
.auc .thumb{width:72px}
.deal .sw{height:100%;min-height:40px;border-radius:4px;background:var(--g)}
.deal b{display:block;font-weight:900;font-size:18px;line-height:1.1}
.deal small{color:var(--muted);font-weight:600}
.deal .px{font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.waitline{display:flex;align-items:center;gap:8px;font-weight:900;text-transform:uppercase;min-height:48px;justify-content:center}
.waitline .tk{width:12px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.ticker{display:flex;align-items:center;gap:8px;background:transparent;border:0;padding:2px 4px;color:var(--muted);font-size:13px;text-align:left;cursor:pointer;min-width:0}
.ticker span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ticker svg{width:16px;height:16px;flex:none}

/* Fogli */
.backdrop{position:fixed;inset:0;background:rgba(21,23,28,.45);z-index:35;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:90%;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;animation:up .2s ease-out;box-shadow:0 -10px 40px rgba(21,23,28,.18)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h2{font-weight:900;font-style:italic;font-size:24px;margin:0;line-height:1.05;text-wrap:balance;display:flex;align-items:center;gap:8px}
.sheet p{margin:0;color:var(--muted)}
.sheet h3{margin:0;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.handoff{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--surface);border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px}
.band{height:8px;border-radius:4px;background:var(--g)}
.rt{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center}
.rt div{background:var(--surface-2);border-radius:8px;padding:5px 2px;display:grid;gap:1px}
.rt small{font-size:10px;color:var(--muted);font-weight:700}
.rt b{font-size:14px;font-variant-numeric:tabular-nums}
.rt .cur{background:var(--red);color:var(--on-red)}
.rt .cur small{color:var(--on-red)}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{background:var(--surface-2);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:600}
.fact b{font-weight:900}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border:1.5px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:6px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--g)}
.tile .h{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding-top:2px}
.tile .h b{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .h span{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.tile .a{display:flex;gap:4px;flex-wrap:wrap}
.tile .a .btn{flex:1 1 auto}
.tile.mort{background:repeating-linear-gradient(135deg,var(--surface) 0 6px,var(--surface-2) 6px 12px)}
.debt{display:flex;justify-content:space-between;align-items:center;background:#ffe9eb;border-radius:12px;padding:10px 12px;gap:10px}
.debt b{font-size:24px;font-weight:900;color:var(--red);font-variant-numeric:tabular-nums}
.auc{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.auc .big{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.auc .who{font-weight:700;display:flex;gap:6px;align-items:center}
.bidders{display:flex;gap:6px;flex-wrap:wrap}
.bidders>span{display:flex;gap:4px;align-items:center;font-size:12px;font-weight:700;background:var(--surface-2);padding:2px 8px;border-radius:20px}
.bidders>span.gone{opacity:.35;text-decoration:line-through}
.trade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trade>div{min-width:0;display:grid;gap:6px;align-content:start;background:var(--surface-2);border-radius:12px;padding:8px}
.picks{display:flex;flex-wrap:wrap;gap:4px}
.pick{display:flex;align-items:center;gap:4px;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:4px 7px;font-size:12px;font-weight:700;cursor:pointer}
.pick .sw{width:6px;height:14px;border-radius:2px;background:var(--g)}
.pick.on{border-color:var(--red);background:#ffe9eb}
.pick.mort{text-decoration:line-through dotted}
.step{display:flex;align-items:center;gap:4px}
.step b{flex:1;text-align:center;font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.clauses{display:grid;gap:6px;background:var(--ink);color:var(--surface);border-radius:12px;padding:10px}
.clauses h3{color:var(--gold)}
.cl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:600}
.cl select{background:#2a2d35;color:var(--surface);border:0;border-radius:6px;padding:4px 6px;font:inherit;font-weight:700}
.sum{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.sum dt{color:var(--muted);font-weight:700}
.sum dd{margin:0;font-weight:700}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px;align-items:center}
.prow input{background:var(--surface-2);border:1.5px solid var(--line);border-radius:8px;padding:8px;color:var(--ink);font:inherit;font-weight:700;min-width:0;width:100%;-webkit-user-select:text;user-select:text}
.swatch{width:28px;height:28px;border-radius:50%;background:var(--pc);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.seg{display:flex;background:var(--surface-2);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{background:transparent;border:0;padding:5px 10px;font-weight:700;font-size:12px;color:var(--muted);cursor:pointer;border-radius:6px;display:flex;gap:5px;align-items:center}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(21,23,28,.12)}
.cardbig{background:var(--ink);color:var(--surface);border-radius:14px;padding:16px;font-size:17px;font-weight:700}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.rules div{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:13px}
.rules b{display:block;font-weight:900;font-size:14px}
.rank{display:grid;gap:6px}
.rank div{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:var(--surface-2);padding:8px 10px;border-radius:10px;font-variant-numeric:tabular-nums;font-weight:700}
.rank div:first-child{background:#ffe9eb;box-shadow:inset 0 0 0 2px var(--red)}
.rank div:first-child .pos{color:var(--red)}
.rank .pos{font-weight:900;font-size:20px;font-style:italic}
.logl{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:13px}
.logl li:first-child{font-weight:700}
.muted{color:var(--muted)}

/* Orizzontale su telefono */
@media (orientation:landscape) and (max-height:620px){
  html,body{height:100%}
  body{overflow:hidden;padding-block:6px;box-sizing:border-box}
  .app{max-width:none;height:100%;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:stretch}
  .boardcol{height:100%;min-height:0;display:flex;align-items:center}
  .board{height:100%;width:auto;max-width:none;box-sizing:border-box;border-radius:12px}
  .side{overflow-y:auto;gap:8px;padding-right:2px;overscroll-behavior:contain}
  .logo{font-size:18px}
  .ib{width:34px;height:34px}
  .sheet{max-height:96%;max-width:760px;border-radius:16px 16px 0 0;padding-top:12px;gap:10px}
}
/* Verticale su telefono: chiedi di ruotare */
.rotate{display:none}
@media (orientation:portrait) and (max-width:760px) and (pointer:coarse){
  .rotate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px))}
  .rotate h2{font-weight:900;font-style:italic;font-size:28px;margin:0}
  .rotate .phone{width:48px;height:80px;border:4px solid var(--red);border-radius:11px;position:relative;animation:turn 2.4s ease-in-out infinite}
  .rotate .phone::after{content:"";position:absolute;left:50%;bottom:5px;width:10px;height:3px;margin-left:-5px;background:var(--red);border-radius:2px}
  @keyframes turn{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
}
/* Monoposto, effetti, partenza */
.board{position:relative}
.cars{position:absolute;inset:0;pointer-events:none;z-index:3}
.car{position:absolute;left:0;top:0;width:var(--car,14px);height:calc(var(--car,14px)*2.17);margin-left:calc(var(--car,14px)/-2);margin-top:calc(var(--car,14px)*-1.085);transition:transform .14s linear;filter:drop-shadow(0 2px 1.5px rgba(21,23,28,.4))}
.car svg{width:100%;height:100%;display:block}
.car.me{z-index:2;filter:drop-shadow(0 0 3px var(--gold)) drop-shadow(0 0 2px var(--gold)) drop-shadow(0 1.5px 1.5px rgba(21,23,28,.35))}
.cell .ic{width:1.8em;height:1.8em;flex:none}
.cell .ic+span{font-size:.72em}
.cell .drs{background:var(--green);color:#fff;padding:1px 4px;border-radius:3px}
.cell.wk::after{content:"";position:absolute;top:2px;right:2px;width:1em;height:1em;background:repeating-conic-gradient(var(--ink) 0 25%,#fff 0 50%) 0 0/.5em .5em;border-radius:2px;box-shadow:0 0 0 1px var(--ink);animation:flag 1.1s ease-in-out infinite}
@keyframes flag{50%{transform:rotate(-14deg) scale(1.15)}}
.pot{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pot span{font-size:clamp(9px,2.3vw,12px);font-weight:700;background:var(--surface-2);border-radius:20px;padding:1px 9px;white-space:nowrap}
.pot span.full{background:var(--gold)}

function cellTrack(i,o){
  const t=TRACKS[SQ[i].tk];if(!t)return '';
  const col=o?(o.mort?'#9ca3af':P(o.owner).color):'#b6bcc6';
  return `<svg viewBox="-8 -8 ${t.w+16} ${t.h+16}" aria-hidden="true"><path d="${t.d}" fill="none" stroke="${col}" stroke-width="${o?11:9}" stroke-linejoin="round" stroke-linecap="round"${o&&o.mort?' stroke-dasharray="6 6"':''}/></svg>`;
}
function trackSVG(i,cls='big'){
  const sq=SQ[i],t=TRACKS[sq.tk];if(!t)return '';
  const pad=9,m=t.d.match(/^M([\d.]+) ([\d.]+)/),sx=+m[1],sy=+m[2],c=gcol(i);
  const flag=`<g transform="translate(${sx-3} ${sy-3})"><rect width="6" height="6" fill="#fff" stroke="var(--ink)" stroke-width=".8"/><rect width="3" height="3" fill="var(--ink)"/><rect x="3" y="3" width="3" height="3" fill="var(--ink)"/></g>`;
  const car=cls==='big'&&!reduced?`<circle r="3.4" fill="var(--red)" stroke="#fff" stroke-width="1.3"><animateMotion dur="${(sq.km*1.4).toFixed(1)}s" repeatCount="indefinite" path="${t.d}"/></circle>`:'';
  return `<svg class="trk ${cls}" viewBox="${-pad} ${-pad} ${t.w+pad*2} ${t.h+pad*2}" role="img" aria-label="Tracciato di ${esc(sq.name)}">
    <path d="${t.d}" fill="none" stroke="var(--ink)" stroke-width="${cls==='big'?7:9}" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="draw" d="${t.d}" pathLength="1" fill="none" stroke="${c}" stroke-width="${cls==='big'?4:5}" stroke-linejoin="round" stroke-linecap="round"/>
    ${cls==='big'?`<path d="${t.d}" fill="none" stroke="#fff" stroke-width=".8" stroke-dasharray="2 3" opacity=".75"/>`:''}
    ${flag}${car}</svg>`;
}

let AC=null, muted=false, stepK=0;
try{muted=localStorage.getItem(MUTE_KEY)==='1';}catch(e){}
function ac(){
  if(muted) return null;
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f,dur,type='sine',vol=.12,when=0,slide){
  const a=ac(); if(!a) return;
  const t=a.currentTime+when, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(dur,vol=.2,when=0,hp=800){
  const a=ac(); if(!a) return;
  const t=a.currentTime+when, n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let k=0;k<n;k++) d[k]=(Math.random()*2-1)*(1-k/n);
  const s=a.createBufferSource(), g=a.createGain(), f=a.createBiquadFilter();
  f.type='highpass'; f.frequency.value=hp; s.buffer=buf; g.gain.value=vol;
  s.connect(f).connect(g).connect(a.destination); s.start(t);
}
const arp=(notes,step=.09,type='square',vol=.07)=>notes.forEach((n,k)=>tone(n,step*1.6,type,vol,k*step));

const mf=m=>440*Math.pow(2,(m-69)/12);
// La minore · Fa · Do · Sol, 120 BPM, sedicesimi
const CHORDS=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
const ARP=[0,1,2,3,2,1,0,1,2,3,4,3,2,1,2,3];
function mVoice(type,f,t,dur,vol,dest,att=.008){
  const a=AC,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(dest);o.start(t);o.stop(t+dur+.05);return o;
}
function mNoise(t,dur,vol,type,freq){
  const a=AC,s2=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s2.buffer=MUSIC.noise;f.type=type;f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s2.connect(f).connect(g).connect(MUSIC.out);s2.start(t,Math.random()*.5);s2.stop(t+dur+.02);
}
function mStep(t,k){
  const a=AC,bar=Math.floor(k/16)%4,st=k%16,ch=CHORDS[bar],loop=Math.floor(k/64);
  // cassa
  if(st%4===0){const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(.85,t);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(g).connect(MUSIC.out);o.start(t);o.stop(t+.3);}
  // rullante e charleston
  if(st===4||st===12) mNoise(t,.16,.32,'bandpass',1900);
  if(st%2===0) mNoise(t,st%4===2?.06:.03,st%4===2?.13:.06,'highpass',7500);
  // basso in ottavi, salto d'ottava
  if(st%2===0){const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;lp.connect(MUSIC.out);mVoice('sawtooth',mf(ch[0]-24+(st===6||st===14?12:0)),t,.2,.13,lp);}
  // arpeggio con eco (entra dal secondo giro)
  if(loop>0||bar>1){const tones=[ch[0],ch[1],ch[2],ch[0]+12,ch[1]+12];mVoice('square',mf(tones[ARP[st]]+12),t,.11,.035,MUSIC.delay);}
  // accordo di sottofondo
  if(st===0){const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=950;lp.connect(MUSIC.out);ch.forEach((m,j)=>{mVoice('sawtooth',mf(m)*(1+(j-1)*.003),t,2.1,.028,lp,.35);});}
  // piccolo riff ogni secondo giro
  if(loop%2===1&&(st===0||st===3||st===6||st===10)&&bar<3){mVoice('triangle',mf(ch[[2,1,0,1][[0,3,6,10].indexOf(st)]]+12),t,.32,.07,MUSIC.delay);}
}
function mSchedule(){
  if(!MUSIC.playing||!AC)return;
  const spb=60/120/4;
  while(MUSIC.next<AC.currentTime+.15){mStep(MUSIC.next,MUSIC.step);MUSIC.next+=spb;MUSIC.step++;}
}
function musicStart(){
  if(!MUSIC.on||muted||MUSIC.playing||$('#menu').hidden)return;
  const a=ac();if(!a)return;
  if(!MUSIC.noise){const n=a.sampleRate,b=a.createBuffer(1,n,n),d=b.getChannelData(0);for(let k=0;k<n;k++)d[k]=Math.random()*2-1;MUSIC.noise=b;}
  const out=a.createGain(),comp=a.createDynamicsCompressor(),dl=a.createDelay(1),fb=a.createGain(),wet=a.createGain();
  out.gain.setValueAtTime(0,a.currentTime);out.gain.linearRampToValueAtTime(.5,a.currentTime+1.8);
  dl.delayTime.value=.375;fb.gain.value=.32;wet.gain.value=.35;
  const dIn=a.createGain();dIn.connect(out);dIn.connect(dl);dl.connect(fb).connect(dl);dl.connect(wet).connect(out);
  out.connect(comp).connect(a.destination);
  MUSIC.out=out;MUSIC.delay=dIn;MUSIC.playing=true;MUSIC.next=a.currentTime+.12;MUSIC.step=0;
  MUSIC.timer=setInterval(mSchedule,25);paintMusic();
}
function musicStop(fade=.7){
  if(!MUSIC.playing)return;
  clearInterval(MUSIC.timer);MUSIC.playing=false;
  const g=MUSIC.out,t=AC.currentTime;
  try{g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+fade);}catch(e){}
  setTimeout(()=>{try{g.disconnect();}catch(e){}},fade*1000+300);paintMusic();
}
function paintMusic(){const b=$('#musicbtn');if(b){b.textContent=(MUSIC.on&&!muted?'🎵 ':'🔇 ')+T('Musica','Music');b.setAttribute('aria-pressed',MUSIC.on&&!muted?'true':'false');}}
function sfx(n,remote){
  if(!remote&&n!=='step'&&NET.on&&NET.host)hostFx({n});

  if(SFX[n]) try{SFX[n]();}catch(e){}

}

// ================= Economia =================
function gain(p,n){p.cash+=n;sfx('coin');log(`${p.name} +${fmt(n)}`);}
function lvCost(i,l){const up=G[SQ[i].g].up,b=l===4?up*2:up,o=S.own[i];return b;}
function upCost(i){return lvCost(i,S.own[i].level+1);}
function levelValue(i,l){const up=G[SQ[i].g].up;return l<=3?l*up:5*up;}
function propValue(i){const o=S.own[i];return (o.mort?SQ[i].price/2:SQ[i].price)+(SQ[i].t==='c'?levelValue(i,o.level):0);}
function netWorth(p){return p.cash+propsOf(p).reduce((a,i)=>a+propValue(i),0)-(p.loan?p.loan.owe:0);}
const mortValue=i=>Math.floor(SQ[i].price/2);
const unmortCost=i=>r5(SQ[i].price*.55);
function pactActive(a,b){return (S.pacts||[]).some(x=>((x.a===a&&x.b===b)||(x.a===b&&x.b===a))&&S.round<=x.until);}
function roysOn(i){return (S.roys||[]).filter(r=>r.prop===i&&S.round<=r.until);}
function rentOf(i){
  const sq=SQ[i],o=S.own[i],owner=P(o.owner);
  if(o.mort) return 0;
  if(sq.t==='u'){const n=propsOf(owner).filter(j=>SQ[j].t==='u'&&!S.own[j].mort).length;return (S.dice[0]+S.dice[1])*(n===2?12:5);}
  const t=rentTable(sq);
  let r=o.level===0?(ownsGroup(owner,sq.g)?t[0]*2:t[0]):t[o.level];
  if(S.weekend===i) r*=2;
  return r;
}
function pickWeekend(){
  const cs=SQ.map((s,i)=>i).filter(i=>SQ[i].t==='c');
  S.weekend=cs[Math.floor(Math.random()*cs.length)];
  log(T(`🏁 GP del weekend: ${SQ[S.weekend].name} · diritti ×2`,`🏁 Weekend GP: ${SQ[S.weekend].name} · fees ×2`));
}
const st=id=>(S.stats=S.stats||{})[id]||(S.stats[id]={rent:0,deals:0,built:0});
function canUpgrade(p,i){const sq=SQ[i],o=S.own[i];return sq.t==='c'&&o&&o.owner===p.id&&o.level<4&&ownsGroup(p,sq.g)&&!groupHasMort(sq.g)&&p.cash>=upCost(i);}
function upgrade(i){const p=P(S.own[i].owner),c=upCost(i);p.cash-=c;S.own[i].level++;st(p.id).built++;sfx('build');log(T(`${p.name}: ${S.own[i].level===4?'GP':'tribuna'} a ${SQ[i].name} (−${fmt(c)})`,`${p.name}: ${S.own[i].level===4?'GP':'grandstand'} at ${SQ[i].name} (−${fmt(c)})`));}
function sellUpgrade(i){const o=S.own[i],p=P(o.owner),c=lvCost(i,o.level),b=Math.floor(c/2);o.level--;p.cash+=b;sfx('coin');log(T(`${p.name} smonta a ${SQ[i].name} (+${fmt(b)})`,`${p.name} dismantles at ${SQ[i].name} (+${fmt(b)})`));}
function canMortgage(i){const o=S.own[i];return o&&!o.mort&&o.level===0&&(SQ[i].t==='u'||!groupHasUpgrades(SQ[i].g));}
function mortgage(i){const o=S.own[i],p=P(o.owner);o.mort=true;p.cash+=mortValue(i);sfx('coin');log(T(`${p.name} ipoteca ${SQ[i].name} (+${fmt(mortValue(i))})`,`${p.name} mortgages ${SQ[i].name} (+${fmt(mortValue(i))})`));}
function unmortgage(i){const o=S.own[i],p=P(o.owner),c=unmortCost(i);if(p.cash<c)return;p.cash-=c;o.mort=false;sfx('pay');log(T(`${p.name} riscatta ${SQ[i].name} (−${fmt(c)})`,`${p.name} unmortgages ${SQ[i].name} (−${fmt(c)})`));}
function hasAssets(p){return propsOf(p).some(i=>S.own[i].level>0||canMortgage(i));}
function autoRaise(p,need){
  for(let g=0;g<200&&p.cash<need;g++){
    const ups=propsOf(p).filter(i=>S.own[i].level>0).sort((a,b)=>G[SQ[a].g].up-G[SQ[b].g].up);
    if(ups.length){sellUpgrade(ups[0]);continue;}
    const m=propsOf(p).filter(canMortgage).sort((a,b)=>SQ[a].price-SQ[b].price);
    if(m.length){mortgage(m[0]);continue;}
    break;
  }
}
async function pay(p,amt,creditor,why,opt={}){
  if(p.out||amt<=0) return true;
  if(p.cash<amt){
    sfx('alarm');
    if(p.cpu) autoRaise(p,amt); else await debtScreen(p,amt,creditor,why);
  }
  if(p.cash<amt){await bankrupt(p,creditor);return false;}
  p.cash-=amt; if(creditor) creditor.cash+=amt; else S.pot=(S.pot||0)+amt;
  sfx('pay'); log(`${p.name} −${fmt(amt)}${creditor?' → '+creditor.name:''} · ${why}`);
  return true;
}
async function bankrupt(p,creditor){
  sfx('bankrupt');
  if(creditor){creditor.cash+=p.cash;}
  for(const i of propsOf(p)){ if(creditor){S.own[i].owner=creditor.id;S.own[i].level=0;} else delete S.own[i]; }
  p.cash=0;p.out=true;p.stopgo=false;p.outAt=Date.now();
  S.roys=(S.roys||[]).filter(r=>r.holder!==p.id);
  S.pacts=(S.pacts||[]).filter(x=>x.a!==p.id&&x.b!==p.id);
  log(T(`💥 ${p.name} in bancarotta${creditor?': tutto a '+creditor.name:''}`,`💥 ${p.name} is bankrupt${creditor?': everything goes to '+creditor.name:''}`));
  setMsg(T(`${p.name} in bancarotta!`,`${p.name} is bankrupt!`),'warn'); render(); await wait(900);
  checkOver();
}
function checkOver(){if(S.players.filter(p=>!p.out).length<=1&&!S.over)endGame();}
function ranking(){return [...S.players].sort((a,b)=>(a.out-b.out)||(netWorth(b)-netWorth(a))||((b.outAt||0)-(a.outAt||0)));}
function recordHist(){S.hist=S.hist||[];const v=S.players.map(p=>p.out?0:Math.max(0,netWorth(p)));const last=S.hist[S.hist.length-1];if(last&&last.r===S.round)last.v=v;else S.hist.push({r:S.round,v});}
function endGame(){
  recordHist();
  S.over=true;S.phase='over';
  const w=ranking()[0];
  const c=S.champ;
  if(c&&!S.scored){
    S.scored=true;const mult=c.idx===c.n-1?2:1;
    S.gained=ranking().map((p,k)=>{const g=(PTS[k]||0)*mult;c.pts[p.id]+=g;return g;});
    c.wins[w.id]++;c.results.push(ranking().map(p=>p.id));
  }
  setMsg(c?T(`🏁 ${w.name} vince il ${c.names[c.idx]}!`,`🏁 ${w.name} wins the ${c.names[c.idx]}!`):T(`🏁 ${w.name} campione!`,`🏁 ${w.name} is the champion!`),'good');log(T(`Bandiera a scacchi: vince ${w.name}`,`Chequered flag: ${w.name} wins`));
  sfx('win');save();render();confetti(220);showGameOver();
}

const handoff=p=>NET.on?'':S.players.filter(x=>!x.cpu&&!x.out).length>1?`<div class="handoff">📱 ${T('Passa il telefono a','Pass the phone to')} ${tok(p)} ${esc(p.name)}</div>`:'';

async function debtScreen(p,amt,creditor,why){
  while(p.cash<amt){
    const mine=propsOf(p).sort((a,b)=>a-b);
    const tiles=mine.map(i=>{
      const o=S.own[i];let a='';
      if(o.level>0) a+=`<button class="btn xs dark" data-choice="down:${i}">${T('Smonta','Dismantle')} +${fmt(Math.floor(lvCost(i,o.level)/2))}</button>`;
      if(canMortgage(i)) a+=`<button class="btn xs dark" data-choice="mort:${i}">${T('Ipoteca','Mortgage')} +${fmt(mortValue(i))}</button>`;
      if(!a) return '';
      return `<div class="tile ${o.mort?'mort':''}" style="--g:${gcol(i)}"><div class="h"><b>${esc(SQ[i].name)}</b><span>${o.mort?T('IPO','MTG'):LV_SHORT[o.level]}</span></div><div class="a">${a}</div></div>`;
    }).join('');
    const any=hasAssets(p);
    const c=await askFor(p,'__auto')(`${handoff(p)}<h2>${any?T('Servono fondi','You need cash'):T('Bancarotta','Bankruptcy')}</h2>
      <div class="debt"><span>${esc(why)}${creditor?' → '+esc(creditor.name):''}<br><small class="muted">${T('In cassa','Cash')} ${fmt(p.cash)}</small></span><b>${fmt(amt)}</b></div>
      ${any?`<div class="tiles">${tiles}</div>`:`<p>${T('Niente più da ipotecare o smontare.','Nothing left to mortgage or dismantle.')}</p>`}
      <div class="row"><button class="btn ${any?'out':'primary'}" data-choice="bk" ${any?'disabled':''}>${T('Dichiara bancarotta','Declare bankruptcy')}</button></div>`);
    if(c==='__auto'){autoRaise(p,amt);break;}
    if(c==='bk') break;
    const [k,i]=c.split(':');
    if(k==='down') sellUpgrade(+i); else if(k==='mort') mortgage(+i);
    render();
  }
  closeSheet();
}

// ================= Movimento e caselle =================
async function moveSteps(p,n){
  const dir=Math.sign(n);stepK=0;
  for(let k=0;k<Math.abs(n);k++){
    p.pos=(p.pos+dir+32)%32;
    if(dir>0&&p.pos===0){const b=LAP_BONUS;p.cash+=b;sfx('coin');log(T(`${p.name} passa dal via +${fmt(b)}`,`${p.name} passes GO +${fmt(b)}`));}
    else sfx('step');
    render(); await wait(130);
  }
}
async function moveTo(p,t){const n=(t-p.pos+32)%32;await moveSteps(p,n===0?32:n);}
async function stopGo(p,reason){sfx('siren');setMsg(reason,'warn');log(`${p.name}: ${reason}`);p.pos=PIT;p.stopgo=true;render();await wait(700);}

async function resolve(p){
  if(p.out||S.over) return;
  const sq=SQ[p.pos];
  if(sq.t==='c'||sq.t==='u'){
    const o=S.own[p.pos];
    if(!o){S.phase='buy';S.pending=p.pos;setMsg(T(`${sq.name} libero`,`${sq.name} is for sale`));return;}
    if(o.owner===p.id){setMsg(T(`In casa a ${sq.code}`,`Home track: ${sq.code}`));return;}
    const owner=P(o.owner);
    if(o.mort){setMsg(T(`${sq.code} ipotecato: gratis`,`${sq.code} is mortgaged: free`),'good');return;}
    if(pactActive(p.id,owner.id)){setMsg(T(`🤝 Patto con ${owner.name}: gratis`,`🤝 Pact with ${owner.name}: free`),'good');log(T(`${p.name} non paga ${owner.name} (patto)`,`${p.name} pays nothing to ${owner.name} (pact)`));return;}
    const r=rentOf(p.pos);
    setMsg(`${S.weekend===p.pos?'🏁 GP! ':''}${T('Diritti','Fee')} ${fmt(r)} → ${owner.name}`,'warn');render();
    const ok=await pay(p,r,owner,T(`diritti ${sq.name}`,`fee at ${sq.name}`));
    if(ok) st(owner.id).rent+=r;
    if(ok) for(const ry of roysOn(p.pos)){
      const h=P(ry.holder); if(h.out||ry.holder===owner.id) continue;
      const cut=Math.floor(r*ry.pct/100); if(cut<=0) continue;
      const amt=Math.min(cut,owner.cash); owner.cash-=amt; h.cash+=amt;
      log(T(`🕶️ ${h.name} incassa il ${ry.pct}% (${fmt(amt)}) su ${sq.name}`,`🕶️ ${h.name} collects ${ry.pct}% (${fmt(amt)}) on ${sq.name}`));
    }
    return;
  }
  switch(sq.t){
    case 'card':return drawCard(p);
    case 'tax':setMsg(`${sq.name} ${fmt(sq.amount)}`,'warn');await pay(p,sq.amount,null,sq.name);return;
    case 'drs':{const n=3;setMsg(T(`DRS aperto: +${n}`,`DRS open: +${n}`),'good');sfx('engine');render();await wait(500);await moveSteps(p,n);return resolve(p);}
    case 'cops':return stopGo(p,T('Commissari di gara · Stop & Go','Race stewards · Stop & Go'));
    case 'pit':setMsg(T('Transito in Pit Lane','Driving through Pit Lane'));return;
    case 'sc':
      if(S.pot>0){const w=S.pot;S.pot=0;gain(p,w);setMsg(T(`🚨 Montepremi Safety Car: +${fmt(w)}`,`🚨 Safety Car jackpot: +${fmt(w)}`),'good');log(T(`${p.name} incassa il montepremi (${fmt(w)})`,`${p.name} collects the jackpot (${fmt(w)})`));render();if(w>=150)confetti(90);}
      else setMsg(T('Safety Car: montepremi vuoto','Safety Car: the jackpot is empty'));
      return;
    case 'go':setMsg(T('Semaforo Verde!','Green Light!'));return;
  }
}
async function drawCard(p){
  if(!S.deck||S.deckPos>=S.deck.length){S.deck=shuffle([...CARDS.keys()]);S.deckPos=0;}
  const c=CARDS[S.deck[S.deckPos++]];

}

// ================= Aste =================
function cpuMaxBid(p,i){
  const sq=SQ[i];let v=sq.price;
  if(sq.g){
    const idx=groupIdx(sq.g),mine=idx.filter(j=>S.own[j]&&S.own[j].owner===p.id).length;
    if(mine===idx.length-1) v*=1.8; else if(mine>0) v*=1.3;
    if(S.players.some(o=>o!==p&&!o.out&&idx.filter(j=>S.own[j]&&S.own[j].owner===o.id).length===idx.length-1)) v*=1.35;
  }
  return Math.min(Math.floor(v*df().bid*(.85+Math.random()*.3)),p.cash-60);
}
async function auction(i){
  const sq=SQ[i];
  let ids=S.players.filter(p=>!p.out).map(p=>p.id);
  const start=ids.indexOf(S.turn);ids=ids.slice(start).concat(ids.slice(0,start));
  const all=[...ids];let bid=0,leader=null,k=0;const max={};
  sfx('gavel');S.phase='auction';
  const view=(p,human)=>`${human?handoff(p):''}<h2>🔨 ${T('Asta','Auction')} · ${esc(sq.name)}</h2>
    <div class="auc"><div class="thumb">${sq.t==='c'?trackSVG(i,'mini'):`<div class="band" style="--g:${gcol(i)};width:8px;height:56px"></div>`}</div>
    <div><div class="big">${fmt(bid)}</div><div class="who">${leader!==null?tok(P(leader))+' '+esc(P(leader).name):'<span class="muted">'+T('Nessuna offerta · listino ','No bids yet · list price ')+fmt(sq.price)+'</span>'}</div></div></div>
    <div class="bidders">${all.map(id=>`<span class="${ids.includes(id)?'':'gone'}">${tok(P(id))}${esc(P(id).name)}</span>`).join('')}</div>
    ${human?`<div class="row">${[10,50,100].map(n=>`<button class="btn ${n===10?'primary':'dark'}" data-choice="${n}" ${bid+n>p.cash?'disabled':''}>+${n}</button>`).join('')}<button class="btn out" data-choice="pass">${T('Passo','Pass')}</button></div>`
      :`<div class="waitline">${tok(p)} ${esc(p.name)} ${T('ci pensa…','is thinking…')}</div>`}`;
  for(let guard=0;guard<300&&ids.length;guard++){
    if(ids.length===1&&leader===ids[0]) break;
    const pid=ids[k%ids.length];
    if(pid===leader){k++;continue;}
    const p=P(pid);let c;
    if(p.cpu){
      openSheet(view(p,false),false);await wait(650);
      if(max[pid]===undefined) max[pid]=cpuMaxBid(p,i);
      const room=max[pid]-bid;
      c= room>=10 ? (room>150&&Math.random()<.4?'50':'10') : 'pass';
    } else {if(NET.on&&!isMine(p))openSheet(view(p,false),false);c=await ask(view(p,true),p,'pass');}
    if(c==='pass'){ids.splice(k%ids.length,1);log(T(`${p.name} passa`,`${p.name} passes`));sfx('no');}
    else{bid+=+c;leader=pid;k++;sfx('bid');}
  }
  closeSheet();
  if(leader!==null){
    const w=P(leader);w.cash-=bid;S.own[i]={owner:w.id,level:0,mort:false};
    sfx('gavel');setMsg(T(`🔨 ${w.name} vince ${sq.code} a ${fmt(bid)}`,`🔨 ${w.name} wins ${sq.code} for ${fmt(bid)}`),'good');log(T(`Asta: ${w.name} compra ${sq.name} per ${fmt(bid)}`,`Auction: ${w.name} buys ${sq.name} for ${fmt(bid)}`));
  } else {setMsg(T(`${sq.code}: nessuna offerta`,`${sq.code}: no bids`));log(T(`Asta deserta per ${sq.name}`,`No bids for ${sq.name}`));}
}

// ================= Turni =================
function afterPhase(){const p=cur();return (S.lastDbl&&!p.out&&!p.stopgo&&!S.over)?'roll':'end';}
async function roll(){
  if(busy||S.over||S.phase!=='roll') return;
  busy=true;render();
  const p=cur(),d1=rnd6(),d2=rnd6();
  await animateDice(d1,d2);
  S.dice=[d1,d2];S.lastDbl=d1===d2;if(S.lastDbl)S.doubles++;
  log(`${p.name} 🎲 ${d1}+${d2}${S.lastDbl?T(' doppio',' double'):''}`);
  if(S.doubles>=3) await stopGo(p,T('3 doppi: Stop & Go','3 doubles: Stop & Go'));
  else{setMsg(S.lastDbl?T(`Doppio! ${d1+d2}`,`Double! ${d1+d2}`):`${d1+d2}`);await moveSteps(p,d1+d2);await resolve(p);}
  if(S.phase!=='buy'&&!S.over) S.phase=afterPhase();
  busy=false;save();render();
}
function buy(){
  if(S.phase!=='buy'||busy) return;
  const p=cur(),i=S.pending,sq=SQ[i];if(p.cash<sq.price)return;
  p.cash-=sq.price;S.own[i]={owner:p.id,level:0,mort:false};sfx('buy');
  log(T(`${p.name} compra ${sq.name} (${fmt(sq.price)})`,`${p.name} buys ${sq.name} (${fmt(sq.price)})`));
  const full=sq.g&&ownsGroup(p,sq.g);
  setMsg(full?T(`Gruppo ${G[sq.g].n} completo!`,`${G[sq.g].n} group complete!`):T(`${sq.code} è tuo`,`${sq.code} is yours`),'good');
  if(full) confetti(80);
  S.pending=null;S.phase=afterPhase();save();render();
}
async function toAuction(){
  if(S.phase!=='buy'||busy) return;
  busy=true;const i=S.pending;S.pending=null;
  await auction(i);
  S.phase=afterPhase();busy=false;save();render();
}
function endTurn(){if(S.over||busy||S.phase!=='end')return;nextTurn();}
function nextTurn(){
  if(S.over) return;
  const n=S.players.length;let i=S.turn,k=0,crossed=false;
  do{i=(i+1)%n;k++;if(i===(S.first||0))crossed=true;}while(P(i).out&&k<=n);
  if(crossed){
    S.round++;
    const exp=(S.roys||[]).filter(r=>S.round>r.until).length+(S.pacts||[]).filter(x=>S.round>x.until).length;
    S.roys=(S.roys||[]).filter(r=>S.round<=r.until);S.pacts=(S.pacts||[]).filter(x=>S.round<=x.until);
    if(exp) log(T(`${exp} accordi sotto banco scaduti`,`${exp} under-the-table deals expired`));
    recordHist();
    if(S.limit&&S.round>S.limit){log(T(`Fine dei ${S.limit} giri`,`${S.limit} laps completed`));endGame();return;}
    pickWeekend();
  }
  S.turn=i;startTurn();
}
async function startTurn(){
  const p=cur();
  S.doubles=0;S.lastDbl=false;S.phase='roll';S.pending=null;S.autoOff=false;
  setMsg(T(`Tocca a ${p.name}`,`${p.name}'s turn`));banner(p);keepAwake();
  if(p.loan&&S.round>p.loan.due){
    const owe=r5(p.loan.owe*1.2);p.loan=null;
    setMsg(T(`🦈 Lo strozzino riscuote ${fmt(owe)}`,`🦈 The loan shark collects ${fmt(owe)}`),'warn');log(T(`🦈 Lo strozzino riscuote ${fmt(owe)} da ${p.name} (con mora)`,`🦈 The loan shark collects ${fmt(owe)} from ${p.name} (with penalty)`));sfx('siren');render();await wait(900);
    await pay(p,owe,null,T('strozzino','loan shark'),{full:true});
    if(p.out||S.over){save();render();if(!S.over){await wait(700);nextTurn();}return;}
  }
  if(p.stopgo){
    S.phase='stopgo';save();render();
    const c=p.cpu?cpuStopGo(p):await askFor(p,'skip')(`${handoff(p)}<h2>🚦 Stop &amp; Go</h2><p>${esc(p.name)} ${T('è fermo in Pit Lane.','is stuck in Pit Lane.')}</p>
      <div class="row">
        ${p.flags>0?`<button class="btn primary" data-choice="flag">${T('Bandiera verde','Green flag')} ×${p.flags}</button>`:''}
        <button class="btn ${p.flags?'dark':'primary'}" data-choice="pay" ${p.cash>=STOPGO_FEE?'':'disabled'}>${T('Paga','Pay')} ${fmt(STOPGO_FEE)}</button>
        <button class="btn dark" data-choice="bribe" ${p.cash>=BRIBE?'':'disabled'}>🕶️ ${T('Bustarella','Bribe')} ${fmt(BRIBE)} <small>50%</small></button>
        <button class="btn out" data-choice="skip">${T('Salto il turno','Skip my turn')}</button>
      </div>`);
    closeSheet();
    p.stopgo=false;
    if(c==='flag'){p.flags--;log(T(`${p.name} usa Bandiera verde`,`${p.name} uses a Green flag`));sfx('coin');S.phase='roll';}
    else if(c==='pay'){p.cash-=STOPGO_FEE;S.pot=(S.pot||0)+STOPGO_FEE;sfx('pay');log(T(`${p.name} paga lo Stop & Go`,`${p.name} pays the Stop & Go`));S.phase='roll';}
    else if(c==='bribe'){
      p.cash-=BRIBE;S.pot=(S.pot||0)+BRIBE;sfx('pay');
      if(Math.random()<.5){setMsg(T('🕶️ Commissari corrotti: si riparte!','🕶️ Stewards bribed: back on track!'),'good');log(T(`${p.name} corrompe i commissari`,`${p.name} bribes the stewards`));S.phase='roll';sfx('deal');}
      else{setMsg(T('🕶️ Bustarella scoperta! Turno saltato','🕶️ Bribe exposed! Turn skipped'),'warn');log(T(`${p.name} scoperto a corrompere i commissari`,`${p.name} caught bribing the stewards`));S.phase='end';sfx('siren');}
    }
    else{setMsg(T(`${p.name} sconta lo Stop & Go`,`${p.name} serves the Stop & Go`),'warn');log(T(`${p.name} salta il turno`,`${p.name} skips a turn`));S.phase='end';}
    save();render();
    if(S.phase==='end'){await wait(900);endTurn();return;}
  }
  save();render();
  if(p.cpu) cpuTurn();
}

// ================= CPU =================
function cpuStopGo(p){
  if(p.flags>0) return 'flag';
  if(p.cash>=400&&Math.random()<.25) return 'bribe';
  if(p.cash>=250) return 'pay';
  return 'skip';
}
function cpuWantsBuy(p,i){
  const sq=SQ[i];if(p.cash<sq.price)return false;
  const completes=sq.g&&groupIdx(sq.g).every(j=>j===i||(S.own[j]&&S.own[j].owner===p.id));
  return completes||p.cash-sq.price>=df().reserve;
}
function cpuManage(p){
  for(const i of propsOf(p)) if(S.own[i].mort&&p.cash-unmortCost(i)>=400) unmortgage(i);
  for(let n=0;n<20;n++){
    const o=propsOf(p).filter(i=>canUpgrade(p,i)&&p.cash-upCost(i)>=df().build).sort((a,b)=>S.own[a].level-S.own[b].level||upCost(a)-upCost(b));
    if(!o.length)break;upgrade(o[0]);
  }
}
async function cpuSeekTrade(p){
  S.asked=S.asked||{};
  if(Math.random()>df().trade) return;
  for(const g of Object.keys(G)){
    if(groupHasUpgrades(g)) continue;
    const idx=groupIdx(g),mine=idx.filter(i=>S.own[i]&&S.own[i].owner===p.id);
    if(mine.length!==idx.length-1) continue;
    const j=idx.find(i=>!mine.includes(i));
    if(!S.own[j]||S.own[j].owner===p.id) continue;
    const q=P(S.own[j].owner),key=p.id+'-'+j;
    if(S.asked[key]&&S.round-S.asked[key]<4) continue;
    S.asked[key]=S.round;
    const swap=tradable(p).find(i=>{const s=SQ[i];return s.g&&s.g!==g&&groupIdx(s.g).every(k=>k===i||(S.own[k]&&S.own[k].owner===q.id));});
    const cash=r10(SQ[j].price*(1.6+Math.random()*.6));
    if(swap===undefined&&p.cash-cash<200) continue;
    const offer=blankOffer(p.id,q.id);
    offer.get=[j];
    if(swap!==undefined) offer.give=[swap]; else offer.cashGive=cash;
    // tocco "corrotto": a volte offre un patto o una percentuale
    if(Math.random()<.35) offer.pact=1+Math.floor(Math.random()*2);
    await negotiate(offer);
    render();await wait(400);
    return;
  }
}
async function cpuTurn(){
  if(cpuActive) return; cpuActive=true;
  let doEnd=false;const p=cur();
  try{
    await wait(700);
    for(let g=0;g<14&&!S.over&&cur()===p;g++){
      if(S.phase==='roll'){if(S.doubles===0) await cpuSeekTrade(p);cpuManage(p);render();await roll();await wait(450);}
      else if(S.phase==='buy'){if(cpuWantsBuy(p,S.pending))buy();else await toAuction();await wait(500);}
      else if(S.phase==='end'){cpuManage(p);save();render();await wait(500);doEnd=true;break;}
      else break;
    }
  } finally {cpuActive=false;}
  if(doEnd&&cur()===p) endTurn();
}

// ================= Trattative =================
function tradable(p){return propsOf(p).filter(i=>S.own[i].level===0&&!(SQ[i].g&&groupHasUpgrades(SQ[i].g)));}
function blankOffer(from,to){return {from,to,give:[],get:[],cashGive:0,cashGet:0,royGive:{pct:0,turns:2},royGet:{pct:0,turns:2},pact:0};}
function invert(o){return {from:o.to,to:o.from,give:[...o.get],get:[...o.give],cashGive:o.cashGet,cashGet:o.cashGive,royGive:{...o.royGet},royGet:{...o.royGive},pact:o.pact};}
function offerValid(o){
  const a=P(o.from),b=P(o.to);
  return !a.out&&!b.out&&a.cash>=o.cashGive&&b.cash>=o.cashGet&&o.give.every(i=>S.own[i]&&S.own[i].owner===a.id)&&o.get.every(i=>S.own[i]&&S.own[i].owner===b.id)
    &&(o.give.length||o.get.length||o.cashGive||o.cashGet||o.pact);
}
function execOffer(o){
  const a=P(o.from),b=P(o.to);
  o.give.forEach(i=>S.own[i].owner=b.id);o.get.forEach(i=>S.own[i].owner=a.id);
  a.cash+=o.cashGet-o.cashGive;b.cash+=o.cashGive-o.cashGet;
  S.roys=S.roys||[];S.pacts=S.pacts||[];
  if(o.royGive.pct) o.give.forEach(i=>S.roys.push({prop:i,holder:a.id,pct:o.royGive.pct,until:S.round+o.royGive.turns}));
  if(o.royGet.pct) o.get.forEach(i=>S.roys.push({prop:i,holder:b.id,pct:o.royGet.pct,until:S.round+o.royGet.turns}));
  if(o.pact) S.pacts.push({a:a.id,b:b.id,until:S.round+o.pact});
  st(a.id).deals++;st(b.id).deals++;
  sfx('deal');log(`🤝 ${T('Affare','Deal')} ${a.name} ⇄ ${b.name}`);setMsg(`🤝 ${T('Affare','Deal')} ${a.name} ⇄ ${b.name}`,'good');
  save();render();
}
function rentPower(p){return propsOf(p).reduce((s,i)=>s+(S.own[i].mort?0:(SQ[i].t==='u'?40:rentOf(i))),0);}
function valFor(i,receiver,bundle){
  const sq=SQ[i];let v=S.own[i].mort?sq.price*.5:sq.price;
  if(sq.g&&groupIdx(sq.g).every(j=>bundle.includes(j)||(S.own[j]&&S.own[j].owner===receiver.id))) v+=sq.price*1.5;
  return v;
}
const royFactor=r=>Math.min(.8,r.pct/100*r.turns*.35);
function cpuEval(o){ // dal punto di vista di chi riceve l'offerta (o.to)
  const R=P(o.to),A=P(o.from);
  let gain=o.cashGive+o.give.reduce((s,i)=>s+valFor(i,R,o.give)*(1-royFactor(o.royGive)),0)
          +o.get.reduce((s,i)=>s+SQ[i].price*royFactor(o.royGet),0);
  let loss=o.cashGet+o.get.reduce((s,i)=>s+(S.own[i].mort?SQ[i].price*.5:SQ[i].price)+(valFor(i,A,o.get)-SQ[i].price)*.6,0);
  if(o.pact){const d=(rentPower(A)-rentPower(R))*o.pact*.4; if(d>0) gain+=d; else loss+=-d;}
  return {gain,loss};
}
function cpuRespond(o){
  const R=P(o.to),A=P(o.from);
  const {gain,loss}=cpuEval(o);
  if(gain>=loss*df().accept+5&&gain>0) return {type:'accept'};
  const deficit=r10(loss*1.15-gain+10);
  const c=invert(o);
  if(c.cashGive>0){const red=Math.min(c.cashGive,deficit);c.cashGive-=red;const rest=deficit-red;if(rest>0)c.cashGet+=rest;}
  else c.cashGet+=deficit;
  if(c.cashGet<=A.cash&&deficit<1500&&Math.random()<.85) return {type:'counter',offer:c,line:T('Così non ci sto. Facciamo così:',"Not like that. Here's my offer:")};
  if(c.give.length&&!c.royGive.pct){const c2=invert(o);c2.royGive={pct:50,turns:3};if(cpuEval(invert(c2)).gain>=0) return {type:'counter',offer:c2,line:T('Niente soldi? Allora mi tengo il 50% dei diritti per 3 giri.',"No cash? Then I keep 50% of the fees for 3 laps.")};}
  return {type:'reject'};
}
function offerSummary(o,viewer){
  const me=P(viewer),other=P(viewer===o.from?o.to:o.from);

}

async function negotiate(o){
  for(let chain=0;chain<6;chain++){
    if(!offerValid(o)){log(T('Trattativa saltata','Negotiation fell through'));return false;}
    const R=P(o.to),A=P(o.from);
    let resp;
    if(R.cpu){
      resp=cpuRespond(o);
      if(resp.type!=='accept'){
        if(A.cpu&&resp.type==='counter'){ // tra CPU: accettano la controfferta se ancora conveniente
          const ev=cpuEval(resp.offer); resp= ev.gain>=ev.loss? {type:'accept',offer:resp.offer}:{type:'reject'};
          if(resp.type==='accept'){execOffer(resp.offer);return true;}
        }
      }
    } else {
      const c=await askFor(R,'no',true)(`${handoff(R)}<h2>📨 ${T('Offerta da','Offer from')} ${tok(A)} ${esc(A.name)}</h2>${o.line?`<p><b>“${esc(o.line)}”</b></p>`:''}${offerSummary(o,R.id)}
        <div class="row"><button class="btn primary" data-choice="ok">${T('Accetta','Accept')}</button><button class="btn dark" data-choice="counter">${T('Controfferta','Counteroffer')}</button><button class="btn out" data-choice="no">${T('Rifiuta','Decline')}</button></div>`);
      closeSheet();
      if(c==='ok') resp={type:'accept'};
      else if(c==='no') resp={type:'reject'};
      else{
        const n=await editFor(R,invert(o),true,T(`Controfferta a ${esc(A.name)}`,`Counteroffer to ${esc(A.name)}`));
        resp=n?{type:'counter',offer:n}:{type:'reject'};
      }
    }
    if(resp.type==='accept'){execOffer(o);if(R.cpu&&!A.cpu) await say(T(`${esc(R.name)} accetta! 🤝`,`${esc(R.name)} accepts! 🤝`),A);return true;}
    if(resp.type==='reject'){sfx('no');log(T(`${R.name} rifiuta ${A.name}`,`${R.name} declines ${A.name}`));setMsg(T(`${R.name} rifiuta l'offerta`,`${R.name} declines the offer`),'warn');render();if(R.cpu&&!A.cpu) await say(T(`${esc(R.name)} rifiuta.`,`${esc(R.name)} declines.`),A);return false;}
    o=resp.offer;if(resp.line)o.line=resp.line;
    sfx('bid');log(T(`${R.name} fa una controfferta`,`${R.name} makes a counteroffer`));
  }
  log(T('Trattativa arenata','Negotiation stalled'));return false;
}
function say(t,p){return askFor(p,'ok',true)(`<h2>${t}</h2><div class="row"><button class="btn primary" data-choice="ok">OK</button></div>`).then(()=>closeSheet());}
function canTrade(){return !!S&&!S.over&&!busy&&isMine(cur())&&['roll','end'].includes(S.phase)&&rivals(cur()).length>0;}
async function startTrade(pre={}){
  if(!canTrade()) return;
  const p=cur(),q=pre.to!=null&&!P(pre.to).out?P(pre.to):rivals(p)[0];
  const draft=blankOffer(p.id,q.id);
  if(pre.get) draft.get=pre.get.filter(i=>tradable(q).includes(i));
  if(pre.give) draft.give=pre.give.filter(i=>tradable(p).includes(i));
  if(isGuest()){const o=await editOffer(draft,false,T('Proponi affare','Propose a deal'));closeSheet();if(o)netSend({t:'offer',o});return;}
  busy=true; render();
  const o=await editOffer(draft,false,T('Proponi affare','Propose a deal'));
  closeSheet();
  if(o) await negotiate(o);
  busy=false;save();render();
}

const carRot={};

function placeCars(){
  const layer=$('#cars');if(!layer)return;
  if(!S){layer.innerHTML='';return;}
  const c1=$('#c1');$('#board').style.setProperty('--car',Math.max(8,Math.min(c1.offsetWidth,c1.offsetHeight)*.44)+'px');
  const groups={};

  S.players.forEach(p=>{
    let el=document.getElementById('car'+p.id);
    if(!el){el=document.createElement('div');el.id='car'+p.id;el.className='car';el.innerHTML=CAR(p.color);layer.appendChild(el);}
    el.hidden=p.out;if(p.out)return;
    const cell=$('#c'+p.pos),g=groups[p.pos],k=g.indexOf(p.id),n=g.length;
    let x=cell.offsetLeft+cell.offsetWidth/2,y=cell.offsetTop+cell.offsetHeight/2;
    if(n>1){const a=k/n*Math.PI*2-Math.PI/2,r=Math.min(cell.offsetWidth,cell.offsetHeight)*.24;x+=Math.cos(a)*r;y+=Math.sin(a)*r;}
    const want=rotFor(p.pos);let cur0=carRot[p.id];
    if(cur0===undefined)cur0=want;else{let d=((want-cur0)%360+540)%360-180;cur0+=d;}
    carRot[p.id]=cur0;
    el.style.transform=`translate(${x}px,${y}px) rotate(${cur0}deg)`;
    el.classList.toggle('me',!S.over&&cur()===p);

function confetti(n=140,remote){
  if(!remote&&NET.on&&NET.host)hostFx({n:'confetti',c:n});
  if(reduced)return;
  const cv=$('#confetti');cv.hidden=false;const ctx=cv.getContext('2d'),s=devicePixelRatio||1;
  const W=cv.width=innerWidth*s,H=cv.height=innerHeight*s;
  const cols=['#e10a1e','#f5b400','#15171c','#2563eb','#15a34a','#ec4899','#ffffff'];
  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.35,y:H*.4,vx:(Math.random()-.5)*16*s,vy:(-Math.random()*13-4)*s,r:Math.random()*6,vr:(Math.random()-.5)*.4,w:(4+Math.random()*5)*s,h:(6+Math.random()*8)*s,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){
    ctx.clearRect(0,0,W,H);
    ps.forEach(q=>{q.vy+=.38*s;q.x+=q.vx;q.y+=q.vy;q.vx*=.985;q.r+=q.vr;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.fillStyle=q.c;ctx.fillRect(-q.w/2,-q.h/2,q.w,q.h);ctx.restore();});
    if(t-t0<2800)requestAnimationFrame(f);else{ctx.clearRect(0,0,W,H);cv.hidden=true;}
  })(t0);
}

function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p;}
function chartHTML(){
  const h=S.hist||[];if(h.length<2)return '';
  const W=440,H=170,L=44,Rr=10,TP=10,B=24;
  const step=niceStep(Math.max(1,...h.flatMap(x=>x.v))/4),top=step*Math.ceil(Math.max(1,...h.flatMap(x=>x.v))/step);
  const x=k=>L+(W-L-Rr)*k/(h.length-1),y=v=>TP+(H-TP-B)*(1-v/top);
  let g='';
  for(let v=0;v<=top+1e-9;v+=step) g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${v>=1000?(v/1000).toFixed(v%1000?1:0)+'k':v}</text>`;
  g+=`<text x="${L}" y="${H-6}" font-size="10" fill="var(--muted)">${T('Giro','Lap')} ${h[0].r}</text><text x="${W-Rr}" y="${H-6}" text-anchor="end" font-size="10" fill="var(--muted)">${T('Giro','Lap')} ${h[h.length-1].r}</text>`;
  const lines=S.players.map((p,pi)=>`<polyline points="${h.map((e,k)=>x(k).toFixed(1)+','+y(e.v[pi]).toFixed(1)).join(' ')}" fill="none" stroke="${p.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(h.length-1)}" cy="${y(h[h.length-1].v[pi])}" r="4" fill="${p.color}" stroke="var(--surface)" stroke-width="2"/>`).join('');
  return `<div class="nw"><h3>${T('Patrimonio giro per giro','Net worth lap by lap')}</h3><div class="nwbox"><svg viewBox="0 0 ${W} ${H}" id="nwsvg" data-l="${L}" data-r="${Rr}" data-w="${W}" role="img" aria-label="${T('Andamento del patrimonio di ogni pilota','Net worth of each driver over time')}">${g}${lines}<line id="nwx" x1="0" x2="0" y1="${TP}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/><rect x="${L}" y="${TP}" width="${W-L-Rr}" height="${H-TP-B}" fill="transparent"/></svg><div class="nwtip" id="nwtip" hidden></div></div>
    <div class="legend">${S.players.map(p=>`<span>${tok(p)} ${esc(p.name)}</span>`).join('')}</div></div>`;
}
document.addEventListener('pointermove',e=>{

async function chooseOrder(){
  const res={};let cont=S.players.map(p=>p.id),tie=false;
  const view=(btn)=>{
    const sums=cont.filter(id=>res[id]).map(id=>res[id][0]+res[id][1]),mx=Math.max(0,...sums);
    return `<h2>🏎️ ${T('Chi parte in pole?','Who starts on pole?')}</h2>${tie?`<p><b>${T('Pari! Spareggio.','Tie! Roll-off.')}</b></p>`:''}
      <div class="order">${S.players.map(p=>{const r=res[p.id];const on=r&&cont.includes(p.id)&&r[0]+r[1]===mx;
        return `<div class="${on?'best':''}">${tok(p)}<span>${esc(p.name)}</span><span class="dd">${r?`<span class="die">${dieHTML(r[0])}</span><span class="die">${dieHTML(r[1])}</span>`:'<span class="muted">…</span>'}</span><span class="sum">${r?r[0]+r[1]:''}</span></div>`;}).join('')}</div>${btn}`;
  };
  for(let guard=0;guard<10&&cont.length>1;guard++){
    for(const id of cont){
      const p=P(id);
      if(p.cpu){openSheet(view(`<div class="waitline">${tok(p)} ${esc(p.name)} ${T('lancia…','is rolling…')}</div>`),false);await wait(550);}
      else await askFor(p,'roll')(view(`${handoff(p)}<div class="row"><button class="btn primary" data-choice="roll">🎲 ${T('Lancia','Roll')} ${esc(p.name)}</button></div>`));
      res[id]=[rnd6(),rnd6()];sfx('dice');
      openSheet(view(''),false);await wait(450);
    }
    const mx=Math.max(...cont.map(id=>res[id][0]+res[id][1]));
    const top=cont.filter(id=>res[id][0]+res[id][1]===mx);
    if(top.length>1){tie=true;cont=top;cont.forEach(id=>delete res[id]);openSheet(view(''),false);await wait(700);}
    else cont=top;
  }
  const w=P(cont[0]);
  sfx('engine');
  const pole=`<div class="pole">${tok(w)} ${esc(w.name)} ${T('parte in pole!','starts on pole!')}</div>`;
  if(S.players.every(p=>p.cpu)){openSheet(view(pole),false);await wait(1200);}
  else if(NET.on){openSheet(view(pole),false);await wait(1800);}
  else await ask(view(pole+`<div class="row"><button class="btn primary" data-choice="go">🚦 ${T('Semaforo verde','Lights out')}</button></div>`));
  closeSheet();
  return w.id;
}

function fbBackend(){
  const d=firebase.database(),r=p=>d.ref('pt/'+p);
  return {uid:firebase.auth().currentUser.uid,
    set:(p,v)=>r(p).set(v),update:(p,v)=>r(p).update(v),remove:p=>r(p).remove(),
    push:(p,v)=>r(p).push(v),get:async p=>(await r(p).get()).val(),
    on:(p,cb)=>{const h=s=>cb(s.val());r(p).on('value',h);return()=>r(p).off('value',h);},
    onAdd:(p,cb)=>{const h=s=>cb(s.key,s.val());r(p).on('child_added',h);return()=>r(p).off('child_added',h);},
    onDisc:(p,v)=>v===null?r(p).onDisconnect().remove():r(p).onDisconnect().set(v),
    txn:(p,fn)=>r(p).transaction(fn).then(x=>({committed:x.committed}))};
}
// Motore locale: simula il database tra le schede dello stesso browser (solo per i test).
function localBackend(){
  const ch=new BroadcastChannel('pt-localnet');let tree={};const L=[],discs=[];
  const uid='u'+Math.random().toString(36).slice(2,10);
  const parts=p=>p.split('/').filter(Boolean);
  const getp=p=>parts(p).reduce((o,k)=>o&&typeof o==='object'?o[k]:undefined,tree);
  const setp=(p,v)=>{const ks=parts(p);let o=tree;for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=='object'||o[ks[i]]===null)o[ks[i]]={};o=o[ks[i]];}
    if(v===null||v===undefined)delete o[ks[ks.length-1]];else o[ks[ks.length-1]]=JSON.parse(JSON.stringify(v));};
  const fire=()=>L.slice().forEach(l=>l.check());
  const apply=op=>{if(op.k==='set')setp(op.p,op.v);else if(op.k==='upd')for(const x in op.v)setp(op.p+'/'+x,op.v[x]);};
  const doOp=op=>{apply(op);ch.postMessage(op);setTimeout(fire,0);};
  let gotTree;const ready=new Promise(r=>{gotTree=r;setTimeout(r,250);});
  ch.onmessage=e=>{const m=e.data;
    if(m.k==='hello'){ch.postMessage({k:'tree',v:tree});return;}
    if(m.k==='tree'){if(!Object.keys(tree).length&&m.v)tree=m.v;gotTree();setTimeout(fire,0);return;}
    apply(m);setTimeout(fire,0);};
  ch.postMessage({k:'hello'});
  addEventListener('pagehide',()=>discs.forEach(([p,v])=>{apply({k:'set',p,v});ch.postMessage({k:'set',p,v});}));
  return {uid,ready,
    set:(p,v)=>{doOp({k:'set',p,v});return Promise.resolve();},
    update:(p,v)=>{doOp({k:'upd',p,v});return Promise.resolve();},
    remove:p=>{doOp({k:'set',p,v:null});return Promise.resolve();},
    push:(p,v)=>{const id='k'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);doOp({k:'set',p:p+'/'+id,v});return Promise.resolve({key:id});},
    get:async p=>JSON.parse(JSON.stringify(getp(p)??null)),
    on:(p,cb)=>{let last;const l={check(){const v=JSON.stringify(getp(p)??null);if(v!==last){last=v;cb(JSON.parse(v));}}};L.push(l);setTimeout(()=>l.check(),0);return()=>{const i=L.indexOf(l);if(i>=0)L.splice(i,1);};},
    onAdd:(p,cb)=>{const seen=new Set();const l={check(){const o=getp(p)||{};for(const k of Object.keys(o).sort()){if(!seen.has(k)){seen.add(k);cb(k,o[k]);}}}};L.push(l);setTimeout(()=>l.check(),0);return()=>{const i=L.indexOf(l);if(i>=0)L.splice(i,1);};},
    onDisc:(p,v)=>{discs.push([p,v]);},
    txn:async(p,fn)=>{const v=fn(getp(p)??null);if(v!==undefined)doOp({k:'set',p,v});return {committed:v!==undefined};}};
}

// ---------- Stanze ----------
async function joinSelf(name){await NET.db.update(room(`players/${NET.uid}`),{name,online:true,ts:Date.now()});NET.db.onDisc(room(`players/${NET.uid}/online`),false);}
async function createRoom(pub){
  const name=readName();await netInit();const db=NET.db;
  let code=genCode();for(let k=0;k<5&&await db.get(`rooms/${code}/meta`);k++)code=genCode();
  netReset();Object.assign(NET,{on:true,host:true,code,pub:!!pub,cpus:pub?0:1,lobbyT:Date.now()});
  await db.set(room('meta'),{host:NET.uid,pub:!!pub,status:'lobby',ts:Date.now(),hostOnline:true,cpus:NET.cpus});
  db.onDisc(room('meta/hostOnline'),false);
  await joinSelf(name);
  if(pub){await db.set(`public/${code}`,{n:1,max:4,ts:Date.now()});db.onDisc(`public/${code}`,null);}
  if(!pub)lsSet(LAST_ROOM,code);
  hostListen();showLobby();
}
async function joinRoom(code,quiet){
  code=String(code||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,5);
  if(code.length!==5){if(!quiet)toastSheet(T('Il codice ha 5 lettere.','The code has 5 letters.'));return false;}
  const name=readName();await netInit();const db=NET.db;
  const meta=await db.get(`rooms/${code}/meta`);
  if(!meta||meta.status==='closed'){if(!quiet)toastSheet(T('Stanza non trovata.','Room not found.'));return false;}
  const me=await db.get(`rooms/${code}/players/${NET.uid}`);
  if(meta.status!=='lobby'&&!me){if(!quiet)toastSheet(T('La partita è già iniziata.','That game has already started.'));return false;}
  const ps=await db.get(`rooms/${code}/players`)||{};
  if(!me&&Object.values(ps).filter(x=>x.online!==false).length+(meta.cpus||0)>=6){if(!quiet)toastSheet(T('La stanza è piena.','The room is full.'));return false;}
  netReset();Object.assign(NET,{on:true,host:meta.host===NET.uid,code,pub:!!meta.pub,started:false,lobbyT:Date.now()});
  await joinSelf(name);lsSet(LAST_ROOM,meta.pub?null:code);
  if(NET.host){NET.cpus=meta.cpus||0;hostListen();if(meta.status==='lobby')showLobby();}
  else{guestListen();if(meta.status==='lobby')showLobby();else openSheet(`<p class="waitline">⏳ ${T('Rientro in partita…','Rejoining the game…')}</p>`,false);}
  return true;
}
async function quickMatch(){
  readName();await netInit();const db=NET.db;
  const list=await db.get('public')||{},now=Date.now();
  const cand=Object.entries(list).filter(([,v])=>v&&v.n<v.max&&now-v.ts<180000).sort((a,b)=>a[1].ts-b[1].ts);
  for(const [code] of cand){const r=await db.txn(`public/${code}/n`,n=>n==null||n>=4?undefined:n+1);if(r.committed&&await joinRoom(code,true))return;}
  await createRoom(true);
}
function toastSheet(msg){openSheet(`<h2>🌐 Online</h2><p>${msg}</p><div class="row"><button class="btn dark" data-act="online">${T('Indietro','Back')}</button></div>`,false);}

// ---------- Host ----------
function hostListen(){
  const db=NET.db;netOff();NET.lobby={meta:null,players:{}};
  NET.offs.push(db.on(room('meta'),m=>{NET.lobby.meta=m;}));
  NET.offs.push(db.on(room('players'),ps=>{NET.lobby.players=ps||{};
    if(!NET.started){if(NET.pub){db.update(`public/${NET.code}`,{n:Object.values(ps||{}).filter(x=>x.online!==false).length});pubCountdown();}showLobby();}
    else hostPresence(ps||{});}));
  NET.offs.push(db.onAdd(room('inbox'),(k,m)=>hostInbox(k,m)));
  db.update(room('meta'),{hostOnline:true});
  if(NET.pub&&!NET.tick)NET.tick=setInterval(()=>{if(!NET.started)showLobby();},5000);
}
function pubCountdown(){
  if(!NET.host||!NET.pub||NET.started)return;
  const n=Object.values(NET.lobby.players||{}).filter(x=>x.online!==false).length;
  if(n>=4){clearInterval(NET.cdT);NET.cdT=null;startOnline();return;}
  if(n>=2&&!NET.cdT){NET.cd=20;NET.cdT=setInterval(()=>{NET.cd--;NET.db.update(room('meta'),{cd:NET.cd});if(NET.cd<=0){clearInterval(NET.cdT);NET.cdT=null;startOnline();}else showLobby();},1000);}
  if(n<2&&NET.cdT){clearInterval(NET.cdT);NET.cdT=null;NET.cd=null;NET.db.update(room('meta'),{cd:null});}
}
async function startOnline(){
  if(NET.started)return;NET.started=true;clearInterval(NET.cdT);clearInterval(NET.tick);NET.tick=null;
  const ps=NET.lobby.players||{},ids=Object.keys(ps).filter(u=>ps[u].online!==false);
  setup.mode='single';if(!setup.limit)setup.limit=20;
  setup.players=ids.map((u,k)=>({name:cleanName(ps[u].name),cpu:false,color:COLORS[k%6],uid:u}))
    .concat(Array.from({length:NET.cpus},(_,k)=>({name:'CPU '+(k+1),cpu:true,color:COLORS[(ids.length+k)%6]})));
  await NET.db.update(room('meta'),{status:'play',cpus:NET.cpus,cd:null});
  if(NET.pub)NET.db.remove(`public/${NET.code}`);
  closeSheet();paintNet();startGame(null);
}
function pushState(){
  if(!NET.on||!NET.host||!NET.started||!S||NET.timer)return;
  const wait=Math.max(0,200-(Date.now()-(NET.lastPush||0)));
  NET.timer=setTimeout(()=>{NET.timer=null;NET.lastPush=Date.now();if(!S||!NET.on)return;
    const s2={...S,log:S.log.slice(0,15),hist:S.over?S.hist:[],asked:{}};
    NET.db.set(room('state'),{j:JSON.stringify(s2),busy:!!busy,ov:NET.overlay||null,t:Date.now()});},wait);
}
function hostFx(o){if(!NET.on||!NET.host||!NET.started)return;NET.fxs=(NET.fxs||0)+1;NET.db.set(room('fx'),{...o,s:NET.fxs});}
function remoteAsk(uid,msg,def){const id=++NET.seq;return new Promise(res=>{NET.pending[id]={res,uid,def};NET.db.set(room(`to/${uid}`),{...msg,id});});}
function sanitizeOffer(o){
  if(!o||typeof o!=='object')return null;
  const ints=a=>Array.isArray(a)?a.map(Number).filter(i=>Number.isInteger(i)&&i>=0&&i<32):[];
  const cash=v=>Math.max(0,Math.floor(+v||0));
  const roy=r=>({pct:PCTS.includes(+(r&&r.pct))?+r.pct:0,turns:[1,2,3].includes(+(r&&r.turns))?+r.turns:2});
  return {from:+o.from,to:+o.to,give:ints(o.give),get:ints(o.get),cashGive:cash(o.cashGive),cashGet:cash(o.cashGet),royGive:roy(o.royGive),royGet:roy(o.royGet),pact:[0,1,2,3].includes(+o.pact)?+o.pact:0};
}
function hostInbox(k,m){
  NET.db.remove(room(`inbox/${k}`));
  if(!m||!S)return;
  const p=S.players.find(q=>q.uid&&q.uid===m.from);if(!p)return;
  if(m.t==='choice'||m.t==='edited'){const pd=NET.pending[m.id];
    if(pd&&pd.uid===m.from){delete NET.pending[m.id];NET.db.remove(room(`to/${m.from}`));pd.res(m.t==='choice'?String(m.v):sanitizeOffer(m.o));}return;}
  if(S.over||cur()!==p||p.cpu)return;
  if(m.t==='act'&&GAME_ACT[m.a]){GAME_ACT[m.a](m.ds||{});return;}
  if(m.t==='offer'&&!busy&&['roll','end'].includes(S.phase)){const o=sanitizeOffer(m.o);if(!o||o.from!==p.id)return;
    (async()=>{busy=true;render();await negotiate(o);busy=false;save();render();})();}
}
function hostPresence(ps){
  if(!S)return;
  for(const p of S.players){
    if(!p.uid||p.out)continue;
    const on=!!ps[p.uid]&&ps[p.uid].online!==false;
    if(!on&&!p.away){
      p.away=true;p.cpu=true;log(T(`📴 ${p.name} si è disconnesso: guida la CPU`,`📴 ${p.name} disconnected: the CPU takes over`));
      for(const id in NET.pending){const pd=NET.pending[id];if(pd.uid===p.uid){delete NET.pending[id];NET.db.remove(room(`to/${p.uid}`));pd.res(pd.def);}}
      save();render();
      if(!S.over&&cur()===p&&!busy&&!cpuActive&&['roll','end','buy'].includes(S.phase))cpuTurn();
    }else if(on&&p.away){p.away=false;p.cpu=false;log(T(`📶 ${p.name} è tornato in pista`,`📶 ${p.name} is back on track`));save();render();}
  }
}

function guestListen(){
  const db=NET.db;netOff();NET.lobby={meta:null,players:{}};let fxInit=false;
  NET.offs.push(db.on(room('meta'),m=>{NET.lobby.meta=m;
    if(!m||m.status==='closed'){netGone(T("L'host ha chiuso la partita.",'The host closed the game.'));return;}
    if(m.status==='lobby'&&NET.started){NET.started=false;NET.overShown=false;S=null;render();}
    if(m.status==='lobby')showLobby();
    NET.hostAway=m.hostOnline===false;paintNet();}));
  NET.offs.push(db.on(room('players'),ps=>{NET.lobby.players=ps||{};if(!NET.started)showLobby();}));
  NET.offs.push(db.on(room('state'),v=>guestState(v)));
  NET.offs.push(db.on(room(`to/${NET.uid}`),v=>guestPrompt(v)));
  NET.offs.push(db.on(room('fx'),v=>{if(!v)return;if(!fxInit){fxInit=true;NET.fxs=v.s;return;}if(v.s<=(NET.fxs||0))return;NET.fxs=v.s;
    if(v.n==='dice')animateDice(v.a,v.b,true);else if(v.n==='confetti')confetti(v.c,true);else sfx(v.n,true);}));
}
function guestState(v){
  if(!v||!v.j||!NET.on)return;
  if(NET.lobby.meta&&NET.lobby.meta.status==='lobby')return;
  const first=!NET.started;NET.started=true;
  if(first){hideMenu();musicStop();for(const k in carRot)delete carRot[k];for(const k in prevCash)delete prevCash[k];$('#cars').innerHTML='';if(!NET.prompt)closeSheet();paintNet();}
  const pt=S&&S.turn,pr=S&&S.round;
  try{S=JSON.parse(v.j);}catch(e){return;}
  busy=!!v.busy;
  if(!first&&(pt!==S.turn||pr!==S.round)&&!S.over){banner(cur());if(isMine(cur()))sfx('bid',true);}
  render();
  if(NET.prompt)return;
  if(S.over){if(!NET.overShown){NET.overShown=true;setTimeout(()=>{if(!NET.prompt&&S&&S.over)showGameOver();},900);}return;}
  if(NET.localSheet){if(NET.panel==='manage')showManage();else if(NET.panel&&NET.panel.startsWith('info:'))showInfo(+NET.panel.slice(5));return;}
  if(v.ov){openSheet(v.ov,false);$('#sheet').classList.add('ro');NET.roShown=true;}
  else if(NET.roShown)closeSheet();
}
function guestPrompt(v){
  if(!v){if(NET.prompt){NET.prompt=null;choice=null;trResolve=null;closeSheet();}return;}
  if(NET.prompt===v.id)return;NET.prompt=v.id;sfx('card',true);
  if(v.kind==='ask'){choice=val=>{NET.prompt=null;netSend({t:'choice',id:v.id,v:val});closeSheet();};openSheet(v.html,false);}
  else editOffer(v.o,v.locked,v.title).then(o=>{NET.prompt=null;closeSheet();netSend({t:'edited',id:v.id,o:o||null});});
}
function netGone(msg){
  netReset();S=null;GEN++;busy=false;cpuActive=false;choice=null;trResolve=null;
  $('#cars').innerHTML='';render();
  openSheet(`<h2>🌐 Online</h2><p>${msg}</p><div class="row"><button class="btn primary" data-act="menu">🏠 Menu</button></div>`,false);
}
async function netLeave(endForAll){
  if(!NET.on)return;
  const db=NET.db,code=NET.code,wasHost=NET.host,started=NET.started;
  try{
    if(wasHost){
      if(endForAll||!started){await db.update(`rooms/${code}/meta`,{status:'closed',hostOnline:false});if(NET.pub)db.remove(`public/${code}`);setTimeout(()=>db.remove(`rooms/${code}`),4000);lsSet(KEY_ON,null);lsSet(LAST_ROOM,null);}
      else await db.update(`rooms/${code}/meta`,{hostOnline:false});
    }else{await db.update(`rooms/${code}/players/${NET.uid}`,{online:false});if(!started)db.remove(`rooms/${code}/players/${NET.uid}`);}
  }catch(e){}
  netReset();
}
async function resumeOnline(){
  const sv=(()=>{try{return JSON.parse(lsGet(KEY_ON));}catch(e){return null;}})();
  if(!sv||!sv.net){showMenu();return;}
  await netInit();const meta=await NET.db.get(`rooms/${sv.net.code}/meta`);
  if(!meta||meta.status==='closed'||meta.host!==NET.uid){lsSet(KEY_ON,null);toastSheet(T('Questa stanza non esiste più.','This room no longer exists.'));return;}
  hideMenu();musicStop();GEN++;
  netReset();Object.assign(NET,{on:true,host:true,code:sv.net.code,pub:!!sv.net.pub,started:true,cpus:meta.cpus||0});
  S=sv;busy=false;cpuActive=false;
  await joinSelf(lsGet(NAME_KEY)||S.players.find(p=>p.uid===NET.uid)?.name||'Host');
  hostListen();paintNet();
  if(S.phase==='auction')S.phase='buy';if(S.phase==='buy'&&S.pending==null)S.phase='end';if(S.phase==='order')S.phase='roll';
  render();pushState();
  if(S.phase==='stopgo'){cur().stopgo=true;startTurn();}else if(cur().cpu)cpuTurn();
}

function tutorial(){
  return new Promise(res=>{
    let k=0;const ov=document.createElement('div');ov.className='coach';document.body.appendChild(ov);
    const finish=()=>{ov.remove();removeEventListener('resize',draw);try{localStorage.setItem(TUT_KEY,'1');}catch(e){}res();};
    function draw(){
      const [sel,t,d]=TUT[k],el=sel&&document.querySelector(sel),r=el&&el.offsetParent!==null?el.getBoundingClientRect():null;
      const vw=innerWidth,vh=innerHeight,bw=Math.min(320,vw-32);
      let spot='',bx=(vw-bw)/2,by=vh/2-90;
      if(r&&r.width){
        const pad=6;spot=`<div class="spot" style="left:${r.left-pad}px;top:${r.top-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px"></div>`;
        const big=r.width*r.height>vw*vh*.5;
        if(big){bx=(vw-bw)/2;by=vh/2-90;}
        else if(r.right+bw+20<vw){bx=r.right+14;by=Math.min(Math.max(12,r.top),vh-200);}
        else if(r.left-bw-20>0){bx=r.left-bw-14;by=Math.min(Math.max(12,r.top),vh-200);}
        else{bx=Math.min(Math.max(12,r.left),vw-bw-12);by=r.bottom+180<vh?r.bottom+12:Math.max(12,r.top-190);}
      }else spot='<div class="spot none"></div>';
      ov.innerHTML=`${spot}<div class="bubble" style="left:${bx}px;top:${by}px;width:${bw}px" role="dialog" aria-live="polite">
        <div class="tstep">${k+1} / ${TUT.length}</div><b>${t}</b><p>${d}</p>
        <div class="row"><button class="btn sm out" data-tut="skip">${T('Salta','Skip')}</button><button class="btn sm primary" data-tut="next">${k===TUT.length-1?T('Via!','Go!'):T('Avanti','Next')}</button></div></div>`;
      const nb=ov.querySelector('[data-tut=next]');nb&&nb.focus({preventScroll:true});
    }
    ov.addEventListener('click',e=>{const b=e.target.closest('[data-tut]');if(!b)return;e.stopPropagation();
      if(b.dataset.tut==='skip'){finish();return;} sfx('bid');k++; if(k>=TUT.length)finish(); else draw();});
    addEventListener('resize',draw);draw();
  });
}
